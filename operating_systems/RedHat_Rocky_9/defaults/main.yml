redhat_rocky_9_defaults:

  temp_dir: true

  preflight:
    enabled: true
    selinux_informational: true

  ssg_content:
    enabled: true
    require_when_evidence_enabled: true

  # Drift re-assert of SSG STIG RHEL-09-255025/255030/255040/255080/255085/255090/255095/255100/255135/255140/255145/255150/255155/255160/255165/255175.
  sshd:
    enabled: true
    main_config: '/etc/ssh/sshd_config'
    config_dir: '/etc/ssh/sshd_config.d'
    build_access_drop_in: '/etc/ssh/sshd_config.d/50-build-access.conf'
    drop_in:
      path: '/etc/ssh/sshd_config.d/60-ansible-stig.conf'
      owner: 'root'
      group: 'root'
      mode: '0600'
      selinux:
        level: 's0'
        role: 'object_r'
        type: 'etc_t'
        user: 'system_u'
    settings:
      ClientAliveInterval: '600'
      ClientAliveCountMax: '1'
      LogLevel: 'VERBOSE'
      X11Forwarding: 'no'
      StrictModes: 'yes'
      IgnoreRhosts: 'yes'
      HostbasedAuthentication: 'no'
      PermitEmptyPasswords: 'no'
      GSSAPIAuthentication: 'no'
      KerberosAuthentication: 'no'
      PermitUserEnvironment: 'no'
      IgnoreUserKnownHosts: 'yes'
      PrintLastLog: 'yes'
      RekeyLimit: '1G 1h'
      X11UseLocalhost: 'yes'
      Banner: '/etc/issue'

  # Drift re-assert of SSG STIG RHEL-09-411010/611075/411025.
  login_defs:
    enabled: true
    path: '/etc/login.defs'
    settings:
      PASS_MAX_DAYS: '60'
      PASS_MIN_DAYS: '1'
      UMASK: '077'

  # Drift re-assert of SSG STIG RHEL-09-411050.
  useradd:
    enabled: true
    path: '/etc/default/useradd'
    inactive: '35'
    chage_existing_users: true
    min_uid: 1000

  # Drift re-assert of SSG STIG RHEL-09-611090/611110/611065/611070/611100/611115/611125/611120/611130/611105.
  pwquality:
    enabled: true
    config_dir: '/etc/security/pwquality.conf.d'
    path: '/etc/security/pwquality.conf.d/00-stig.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    settings:
      minlen: '15'
      ucredit: '-1'
      lcredit: '-1'
      dcredit: '-1'
      ocredit: '-1'
      difok: '8'
      maxrepeat: '3'
      maxclassrepeat: '4'
      minclass: '4'
      dictcheck: '1'

  # Drift re-assert of SSG STIG RHEL-09-411075/411080/411085/411090.
  faillock:
    enabled: true
    path: '/etc/security/faillock.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    settings:
      deny: '3'
      fail_interval: '900'
      unlock_time: '0'
      even_deny_root: true

  # Drift re-assert of SSG STIG RHEL-09-211020.
  banner:
    enabled: true
    source: 'dod_banner.txt'
    destinations:
      - '/etc/issue'
      - '/etc/issue.net'
    owner: 'root'
    group: 'root'
    mode: '0644'

  # Drift re-assert of SSG STIG RHEL-09-213070; live kernel verification is deferred outside containers.
  sysctl:
    enabled: true
    config_dir: '/etc/sysctl.d'
    path: '/etc/sysctl.d/99-stig.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    reload: true
    settings:
      kernel.randomize_va_space: '2'

  # Drift re-assert of SSG STIG RHEL-09-215075/211035/215015 plus verified CIS Rocky Linux 9 v2.0.0 nftables delta.
  packages:
    enabled: true
    install:
      - 'openssl-pkcs11'
    remove:
      - 'vsftpd'
    rng_tools:
      enabled: true
      package: 'rng-tools'
      service: 'rngd'
      only_when_fips_disabled: true

  # Drift re-assert of SSG STIG RHEL-09-211030.
  systemd_default:
    enabled: true
    target: 'multi-user.target'

  # Verified CIS Rocky Linux 9 Benchmark v2.0.0 deltas sourced per control in vars/main.yml.
  cis_deltas:
    enabled: true
    sshd:
      enabled: true
      settings:
        MaxAuthTries: '4'
        LoginGraceTime: '60'
        MaxStartups: '10:30:60'
        MaxSessions: '10'
    sudo:
      enabled: true
      path: '/etc/sudoers.d/60-ansible-cis'
      owner: 'root'
      group: 'root'
      mode: '0440'
      use_pty: true
      logfile: '/var/log/sudo.log'
    nftables:
      enabled: true
      package: 'nftables'
    journald:
      enabled: true
      config_dir: '/etc/systemd/journald.conf.d'
      path: '/etc/systemd/journald.conf.d/60-ansible-cis.conf'
      owner: 'root'
      group: 'root'
      mode: '0644'
      settings:
        Compress: 'yes'
        Storage: 'persistent'
    pass_warn_age:
      enabled: true
      value: '7'

  # Host-only controls are staged for R-07b; R-07a must not mutate these live controls.
  audit_offload:
    enabled: false
  aide:
    enabled: false
  fapolicyd:
    enabled: false
  grub_password:
    enabled: false

  selinux:
    enabled: true
    mode: 'assert'
  firewalld:
    enabled: true
    mode: 'assert'
  fips:
    enabled: false
    mode: 'assert'
  mounts:
    enabled: false
    mode: 'assert'

  evidence:
    enabled: false
    path: '/var/tmp/redhat_rocky_9_evidence'

# The shared v3.0.0 loader keys defaults and overrides from Ansible's magic role_name.
# The owner-locked on-disk role directory is RedHat_Rocky_9, while the public override
# contract remains the lower-case import/config name redhat_rocky_9.
RedHat_Rocky_9_defaults: "{{ redhat_rocky_9_defaults }}"
RedHat_Rocky_9: "{{ redhat_rocky_9 | default({}) }}"
