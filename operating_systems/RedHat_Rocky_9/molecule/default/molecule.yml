---
dependency:
  name: 'galaxy'
driver:
  name: 'docker'
platforms:
  - name: 'rocky9'
    image: 'geerlingguy/docker-rockylinux9-ansible@sha256:0380319c504ba2d18a1ceb9c7a8cbee6f6eac06309cda143ac5743e62e6acfe5'
    pre_build_image: true
    privileged: true
    command: '/usr/sbin/init'
    cgroupns_mode: 'host'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:rw'
    tmpfs:
      - '/run'
      - '/tmp'
    capabilities:
      - 'SYS_ADMIN'
provisioner:
  name: 'ansible'
  inventory:
    group_vars:
      all:
        ENV: 'ci'
  config_options:
    defaults:
      gathering: 'smart'
verifier:
  name: 'ansible'
scenario:
  test_sequence:
    - 'dependency'
    - 'destroy'
    - 'create'
    - 'prepare'
    - 'converge'
    - 'idempotence'
    - 'verify'
    - 'cleanup'
    - 'destroy'
