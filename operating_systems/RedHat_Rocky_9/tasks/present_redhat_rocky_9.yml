# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_redhat_rocky_9.yml'                                    #
# --- [ Description ] ----------------------------------------------------------------------- #
# Rocky Linux 9 hardening drift re-assertion and verified CIS delta controls.                 #
# =========================================================================================== #

#region ------ [ Script ] ------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (present_redhat_rocky_9)'
  block:

    #region ------ [ Preflight ] ------------------------------------------------------------- #

    - name: 'INFO | Entering Preflight Stage'
      when: config.preflight.enabled | default(true) | bool
      block:

        - name: 'PREFLIGHT | Verify Rocky Linux 9 Platform'
          ansible.builtin.assert:
            that:
              - ansible_facts.os_family == 'RedHat'
              - ansible_facts.distribution_major_version | string == '9'
            fail_msg: >-
              redhat_rocky_9 supports RedHat-family version 9 hosts only.
              Detected {{ ansible_facts.distribution | default('unknown') }}
              {{ ansible_facts.distribution_major_version | default('unknown') }}.
            quiet: true

        - name: 'PREFLIGHT | Verify python3-dnf Is Installed'
          ansible.builtin.assert:
            that:
              - "'python3-dnf' in ansible_facts.packages"
            fail_msg: >-
              The 'python3-dnf' package is required by ansible.builtin.dnf but is not
              installed on this host. Install it before running this role:
                dnf install -y python3-dnf
            quiet: true

        - name: 'PREFLIGHT | Locate SCAP Security Guide Content Candidates'
          loop: "{{ redhat_rocky_9_constants.ssg_content_candidates }}"
          loop_control: { loop_var: '__ssg_candidate__' }
          changed_when: false
          ansible.builtin.stat:
            path: "{{ __ssg_candidate__ }}"
          register: __redhat_rocky_9_ssg_candidates__

        - name: 'PREFLIGHT | Record SCAP Security Guide Content Path'
          ansible.builtin.set_fact:
            __redhat_rocky_9_ssg_content_path: >-
              {{
                (
                  __redhat_rocky_9_ssg_candidates__.results
                  | selectattr('stat.exists')
                  | map(attribute='__ssg_candidate__')
                  | list
                  | first
                ) | default('')
              }}

        - name: 'PREFLIGHT | Verify SCAP Content Exists When Evidence Is Enabled'
          when:
            - config.evidence.enabled | default(false) | bool
            - config.ssg_content.require_when_evidence_enabled | default(true) | bool
          ansible.builtin.assert:
            that:
              - __redhat_rocky_9_ssg_content_path | length > 0
            fail_msg: >-
              No SSG content data stream was found. Checked:
              {{ redhat_rocky_9_constants.ssg_content_candidates | join(', ') }}.
            quiet: true

        - name: 'PREFLIGHT | Read SELinux Mode'
          become: true
          changed_when: false
          failed_when: false
          when: config.selinux.enabled | default(true) | bool
          ansible.builtin.command:
            argv:
              - '/usr/sbin/getenforce'
          register: __redhat_rocky_9_getenforce__

        - name: 'PREFLIGHT | Report SELinux Mode in Containers'
          when:
            - config.selinux.enabled | default(true) | bool
            - ansible_facts.virtualization_type | default('') in redhat_rocky_9_constants.container_virtualization_types
          ansible.builtin.debug:
            msg: "SELinux mode is informational in containers: {{ __redhat_rocky_9_getenforce__.stdout | default('unknown') }}"

        - name: 'PREFLIGHT | Assert SELinux Enforcing Outside Containers'
          when:
            - config.selinux.enabled | default(true) | bool
            - config.selinux.mode | default('assert') == 'assert'
            - ansible_facts.virtualization_type | default('') not in redhat_rocky_9_constants.container_virtualization_types
          ansible.builtin.assert:
            that:
              - __redhat_rocky_9_getenforce__.stdout == 'Enforcing'
            fail_msg: 'SELinux is not enforcing.'
            quiet: true

    #endregion --- [ Preflight ] ------------------------------------------------------------- #

    #region ------ [ Main ] ------------------------------------------------------------------ #

    - name: 'INFO | Entering Main Stage'
      become: true
      block:

        - name: 'MAIN | Read FIPS Runtime State'
          changed_when: false
          failed_when: false
          ansible.builtin.command:
            argv:
              - '/usr/bin/cat'
              - '/proc/sys/crypto/fips_enabled'
          register: __redhat_rocky_9_fips_state__

        - name: 'MAIN | Record FIPS Runtime State'
          ansible.builtin.set_fact:
            __redhat_rocky_9_fips_enabled: "{{ (__redhat_rocky_9_fips_state__.stdout | default('0') | trim) == '1' }}"

        - name: 'MAIN | Assert FIPS Runtime State When Enabled'
          when:
            - config.fips.enabled | default(false) | bool
            - config.fips.mode | default('assert') == 'assert'
            - ansible_facts.virtualization_type | default('') not in redhat_rocky_9_constants.container_virtualization_types
          ansible.builtin.assert:
            that:
              - __redhat_rocky_9_fips_enabled | bool
            fail_msg: 'FIPS mode is not enabled. R-07b owns the consumer decision for this host-only gap.'
            quiet: true

        - name: 'MAIN | Check firewalld Enabled State'
          changed_when: false
          failed_when: false
          when: config.firewalld.enabled | default(true) | bool
          ansible.builtin.command:
            argv:
              - '/usr/bin/systemctl'
              - 'is-enabled'
              - 'firewalld'
          register: __redhat_rocky_9_firewalld_enabled__

        - name: 'MAIN | Assert firewalld Is Enabled Outside Containers'
          when:
            - config.firewalld.enabled | default(true) | bool
            - config.firewalld.mode | default('assert') == 'assert'
            - ansible_facts.virtualization_type | default('') not in redhat_rocky_9_constants.container_virtualization_types
          ansible.builtin.assert:
            that:
              - __redhat_rocky_9_firewalld_enabled__.stdout == 'enabled'
            fail_msg: 'firewalld is not enabled.'
            quiet: true

        - name: 'MAIN | Build Package Install List'
          ansible.builtin.set_fact:
            __redhat_rocky_9_install_packages: >-
              {{
                (config.packages.install | default([]))
                + (
                  (
                    config.packages.rng_tools.enabled | default(true) | bool
                    and (
                      not (config.packages.rng_tools.only_when_fips_disabled | default(true) | bool)
                      or not (__redhat_rocky_9_fips_enabled | bool)
                    )
                  )
                  | ternary([config.packages.rng_tools.package | default('rng-tools')], [])
                )
                + (
                  (
                    config.cis_deltas.enabled | default(true) | bool
                    and config.cis_deltas.nftables.enabled | default(true) | bool
                  )
                  | ternary([config.cis_deltas.nftables.package | default('nftables')], [])
                )
              }}

        - name: 'MAIN | Install Required Packages'
          when:
            - config.packages.enabled | default(true) | bool
            - __redhat_rocky_9_install_packages | length > 0
          ansible.builtin.dnf:
            name: "{{ __redhat_rocky_9_install_packages }}"
            state: 'present'

        - name: 'MAIN | Remove Prohibited Packages'
          when:
            - config.packages.enabled | default(true) | bool
            - config.packages.remove | default([]) | length > 0
          ansible.builtin.dnf:
            name: "{{ config.packages.remove }}"
            state: 'absent'

        - name: 'MAIN | Enable rngd Service When Not in FIPS Mode'
          when:
            - config.packages.enabled | default(true) | bool
            - config.packages.rng_tools.enabled | default(true) | bool
            - not (__redhat_rocky_9_fips_enabled | bool)
            - ansible_facts.service_mgr | default('') == 'systemd'
          ansible.builtin.systemd_service:
            name: "{{ config.packages.rng_tools.service | default('rngd') }}"
            enabled: true

        - name: 'MAIN | Ensure sshd Configuration Directory Exists'
          when: config.sshd.enabled | default(true) | bool
          ansible.builtin.file:
            path: "{{ config.sshd.config_dir }}"
            state: 'directory'
            owner: 'root'
            group: 'root'
            mode: '0755'

        - name: 'MAIN | Collect sshd Drop-In Files'
          when: config.sshd.enabled | default(true) | bool
          ansible.builtin.find:
            paths: "{{ config.sshd.config_dir }}"
            patterns: '*.conf'
            file_type: 'file'
          register: __redhat_rocky_9_sshd_dropins__

        - name: 'MAIN | Build Role-Owned sshd Directive Cleanup Matrix'
          when: config.sshd.enabled | default(true) | bool
          ansible.builtin.set_fact:
            __redhat_rocky_9_sshd_cleanup_files: >-
              {{
                (
                  [config.sshd.main_config]
                  + (
                    __redhat_rocky_9_sshd_dropins__.files
                    | default([])
                    | map(attribute='path')
                    | reject('equalto', config.sshd.drop_in.path)
                    | reject('equalto', config.sshd.build_access_drop_in)
                    | list
                  )
                )
                | unique
                | list
              }}
            __redhat_rocky_9_sshd_cleanup_directives: >-
              {{
                (config.sshd.settings.keys() | list)
                + (
                  (
                    config.cis_deltas.enabled | default(true) | bool
                    and config.cis_deltas.sshd.enabled | default(true) | bool
                  )
                  | ternary(config.cis_deltas.sshd.settings.keys() | list, [])
                )
              }}

        - name: 'MAIN | Remove Active Duplicates for Role-Owned sshd Directives'
          loop: "{{ __redhat_rocky_9_sshd_cleanup_files | product(__redhat_rocky_9_sshd_cleanup_directives) | list }}"
          loop_control: { loop_var: '__sshd_cleanup__' }
          when: config.sshd.enabled | default(true) | bool
          ansible.builtin.lineinfile:
            path: "{{ __sshd_cleanup__.0 }}"
            regexp: "(?i)^\\s*{{ __sshd_cleanup__.1 }}\\s+.*$"
            state: 'absent'
            owner: 'root'
            group: 'root'
            mode: '0600'
          notify: 'Reload sshd'

        - name: 'MAIN | Deploy Role-Owned sshd Drop-In'
          when: config.sshd.enabled | default(true) | bool
          ansible.builtin.template:
            src: 'sshd-ansible-stig.conf.j2'
            dest: "{{ config.sshd.drop_in.path }}"
            owner: "{{ config.sshd.drop_in.owner | default('root') }}"
            group: "{{ config.sshd.drop_in.group | default('root') }}"
            mode: "{{ config.sshd.drop_in.mode | default('0600') }}"
            selevel: "{{ config.sshd.drop_in.selinux.level | default(omit) }}"
            serole: "{{ config.sshd.drop_in.selinux.role | default(omit) }}"
            setype: "{{ config.sshd.drop_in.selinux.type | default(omit) }}"
            seuser: "{{ config.sshd.drop_in.selinux.user | default(omit) }}"
            validate: '/usr/sbin/sshd -t -f %s'
          notify: 'Reload sshd'

        - name: 'MAIN | Configure login.defs STIG Settings'
          loop: "{{ config.login_defs.settings | dict2items }}"
          loop_control: { loop_var: '__login_def__' }
          when: config.login_defs.enabled | default(true) | bool
          ansible.builtin.lineinfile:
            path: "{{ config.login_defs.path }}"
            regexp: "^\\s*#?\\s*{{ __login_def__.key }}\\s+.*$"
            line: "{{ __login_def__.key }}\t{{ __login_def__.value }}"
            owner: 'root'
            group: 'root'
            mode: '0644'

        - name: 'MAIN | Configure login.defs CIS PASS_WARN_AGE'
          when:
            - config.login_defs.enabled | default(true) | bool
            - config.cis_deltas.enabled | default(true) | bool
            - config.cis_deltas.pass_warn_age.enabled | default(true) | bool
          ansible.builtin.lineinfile:
            path: "{{ config.login_defs.path }}"
            regexp: '^\\s*#?\\s*PASS_WARN_AGE\\s+.*$'
            line: "PASS_WARN_AGE\t{{ config.cis_deltas.pass_warn_age.value }}"
            owner: 'root'
            group: 'root'
            mode: '0644'

        - name: 'MAIN | Configure Default User Inactivity'
          when: config.useradd.enabled | default(true) | bool
          ansible.builtin.lineinfile:
            path: "{{ config.useradd.path }}"
            regexp: '^\\s*#?\\s*INACTIVE=.*$'
            line: "INACTIVE={{ config.useradd.inactive }}"
            owner: 'root'
            group: 'root'
            mode: '0644'

        - name: 'MAIN | List Existing Local Interactive Users'
          changed_when: false
          when:
            - config.useradd.enabled | default(true) | bool
            - config.useradd.chage_existing_users | default(true) | bool
          ansible.builtin.shell:
            cmd: >-
              awk -F: '($3 >= {{ config.useradd.min_uid | default(1000) }}) && ($7 !~ /(nologin|false)$/) { print $1 }' /etc/passwd
            executable: '/bin/bash'
          register: __redhat_rocky_9_interactive_users__

        - name: 'MAIN | Configure Existing User Inactivity'
          loop: "{{ __redhat_rocky_9_interactive_users__.stdout_lines | default([]) }}"
          loop_control: { loop_var: '__interactive_user__' }
          when:
            - config.useradd.enabled | default(true) | bool
            - config.useradd.chage_existing_users | default(true) | bool
          changed_when: "'changed=true' in __redhat_rocky_9_chage__.stdout"
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              before="$(chage -l {{ __interactive_user__ | quote }} | awk -F: '/Password inactive/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
              if [ "${before}" != "{{ config.useradd.inactive }}" ]; then
                chage --inactive {{ config.useradd.inactive | quote }} {{ __interactive_user__ | quote }}
              fi
              after="$(chage -l {{ __interactive_user__ | quote }} | awk -F: '/Password inactive/ {gsub(/^[[:space:]]+/, "", $2); print $2}')"
              if [ "${before}" != "${after}" ]; then
                printf 'changed=true before=%s after=%s\n' "${before}" "${after}"
              else
                printf 'changed=false before=%s after=%s\n' "${before}" "${after}"
              fi
            executable: '/bin/bash'
          register: __redhat_rocky_9_chage__

        - name: 'MAIN | Ensure pwquality Configuration Directory Exists'
          when: config.pwquality.enabled | default(true) | bool
          ansible.builtin.file:
            path: "{{ config.pwquality.config_dir }}"
            state: 'directory'
            owner: 'root'
            group: 'root'
            mode: '0755'

        - name: 'MAIN | Deploy pwquality STIG Drop-In'
          when: config.pwquality.enabled | default(true) | bool
          ansible.builtin.template:
            src: 'pwquality-stig.conf.j2'
            dest: "{{ config.pwquality.path }}"
            owner: "{{ config.pwquality.owner | default('root') }}"
            group: "{{ config.pwquality.group | default('root') }}"
            mode: "{{ config.pwquality.mode | default('0644') }}"

        - name: 'MAIN | Deploy faillock Configuration'
          when: config.faillock.enabled | default(true) | bool
          ansible.builtin.template:
            src: 'faillock.conf.j2'
            dest: "{{ config.faillock.path }}"
            owner: "{{ config.faillock.owner | default('root') }}"
            group: "{{ config.faillock.group | default('root') }}"
            mode: "{{ config.faillock.mode | default('0644') }}"

        - name: 'MAIN | Deploy Standard Mandatory DoD Notice and Consent Banner'
          loop: "{{ config.banner.destinations }}"
          loop_control: { loop_var: '__banner_destination__' }
          when: config.banner.enabled | default(true) | bool
          ansible.builtin.copy:
            src: "{{ config.banner.source }}"
            dest: "{{ __banner_destination__ }}"
            owner: "{{ config.banner.owner | default('root') }}"
            group: "{{ config.banner.group | default('root') }}"
            mode: "{{ config.banner.mode | default('0644') }}"

        - name: 'MAIN | Deploy sysctl STIG Configuration'
          when: config.sysctl.enabled | default(true) | bool
          block:

            - name: 'MAIN | Ensure sysctl Configuration Directory Exists'
              ansible.builtin.file:
                path: "{{ config.sysctl.config_dir | default(config.sysctl.path | dirname) }}"
                state: 'directory'
                owner: 'root'
                group: 'root'
                mode: '0755'

            - name: 'MAIN | Deploy sysctl STIG Configuration File'
              ansible.builtin.template:
                src: 'sysctl-stig.conf.j2'
                dest: "{{ config.sysctl.path }}"
                owner: "{{ config.sysctl.owner | default('root') }}"
                group: "{{ config.sysctl.group | default('root') }}"
                mode: "{{ config.sysctl.mode | default('0644') }}"
              notify: 'Reload sysctl'

        - name: 'MAIN | Ensure sudoers.d Directory Exists'
          when:
            - config.cis_deltas.enabled | default(true) | bool
            - config.cis_deltas.sudo.enabled | default(true) | bool
          ansible.builtin.file:
            path: "{{ config.cis_deltas.sudo.path | dirname }}"
            state: 'directory'
            owner: 'root'
            group: 'root'
            mode: '0750'

        - name: 'MAIN | Deploy CIS sudoers Drop-In'
          when:
            - config.cis_deltas.enabled | default(true) | bool
            - config.cis_deltas.sudo.enabled | default(true) | bool
          ansible.builtin.template:
            src: 'sudoers-cis.j2'
            dest: "{{ config.cis_deltas.sudo.path }}"
            owner: "{{ config.cis_deltas.sudo.owner | default('root') }}"
            group: "{{ config.cis_deltas.sudo.group | default('root') }}"
            mode: "{{ config.cis_deltas.sudo.mode | default('0440') }}"
            validate: '/usr/sbin/visudo -cf %s'

        - name: 'MAIN | Ensure journald Configuration Directory Exists'
          when:
            - config.cis_deltas.enabled | default(true) | bool
            - config.cis_deltas.journald.enabled | default(true) | bool
          ansible.builtin.file:
            path: "{{ config.cis_deltas.journald.config_dir }}"
            state: 'directory'
            owner: 'root'
            group: 'root'
            mode: '0755'

        - name: 'MAIN | Deploy CIS journald Drop-In'
          when:
            - config.cis_deltas.enabled | default(true) | bool
            - config.cis_deltas.journald.enabled | default(true) | bool
          ansible.builtin.template:
            src: 'journald-cis.conf.j2'
            dest: "{{ config.cis_deltas.journald.path }}"
            owner: "{{ config.cis_deltas.journald.owner | default('root') }}"
            group: "{{ config.cis_deltas.journald.group | default('root') }}"
            mode: "{{ config.cis_deltas.journald.mode | default('0644') }}"
          notify: 'Restart systemd-journald'

        - name: 'MAIN | Read Current systemd Default Target'
          changed_when: false
          failed_when: false
          when:
            - config.systemd_default.enabled | default(true) | bool
            - ansible_facts.service_mgr | default('') == 'systemd'
          ansible.builtin.command:
            argv:
              - '/usr/bin/systemctl'
              - 'get-default'
          register: __redhat_rocky_9_systemd_default__

        - name: 'MAIN | Configure systemd Default Target'
          when:
            - config.systemd_default.enabled | default(true) | bool
            - ansible_facts.service_mgr | default('') == 'systemd'
            - __redhat_rocky_9_systemd_default__.stdout | default('') != config.systemd_default.target
          changed_when: true
          ansible.builtin.command:
            argv:
              - '/usr/bin/systemctl'
              - 'set-default'
              - "{{ config.systemd_default.target }}"

    #endregion --- [ Main ] ------------------------------------------------------------------ #

#endregion --- [ Script ] -------------------------------------------------------------------- #
