galaxy_info:

  role_name: 'redhat_rocky_10'
  namespace: 'ansible_framework'
  author: 'nwarila-platform'
  description: >-
    Minimum requirements for the ansible-framework suite on a new RHEL or Rocky Linux 10
    host: a writable remote-tmp base, python3.12 and a boto3-capable virtualenv. Carries no
    STIG hardening entry point; the RHEL 8 role's is release-specific and is not ported.

  license: 'MIT'
  min_ansible_version: '2.21'

  platforms:
    - name: 'EL'
      versions:
        - '10'

  galaxy_tags:
    - 'bootstrap'
    - 'stig'

dependencies: []
