# ============================================================================================= #
# File: '{{ role_path }}/tasks/bootstrap.yml'                                  | Version 1.0.0  #
# --- [ Description ] ------------------------------------------------------------------------- #
# MINIMUM requirements for the ansible-framework suite to run on a NEW Windows Server 2025      #
# host. Called EXPLICITLY by the deploying playbook — never by a loader.                        #
#                                                                                               #
# THERE IS DELIBERATELY NO tasks/main.yml LOADER FOR THIS ROLE. The shared application loader   #
# is Windows-safe, so the old objection -- that it was Linux-only -- no longer applies. It is   #
# still wrong here: its contract is a state and an ENV, which describe application              #
# convergence, not a one-shot repair, and it would run a remote module before this file has     #
# flipped the shell. See tasks/main.yml for the guard that stands in its place.                 #
#                                                                                               #
# --- [ How To Call It ] ---------------------------------------------------------------------- #
#   - name: 'Bootstrap | Windows Server 2025 minimum requirements'
#     hosts: 'wazuh_agents_windows'
#     gather_facts: false
#     tasks:
#       - name: 'Bootstrap | Windows Server 2025'
#         ansible.builtin.include_role:
#           name: 'windows_server_2025'
#           tasks_from: 'bootstrap'
#
#   * 'operating_systems' must be on roles_path (the framework's ansible.cfg declares it; a
#     consuming product whose ansible.cfg overwrites that must re-add it), or use the path form
#     'name: "{{ playbook_dir }}/../operating_systems/windows_server_2025"'.
#   * EXACTLY ONE invocation, BEFORE every other play against the Windows group. The omission
#     bug already shipped once: a deployment path reached the agent stage without this having
#     run, and the first file push died on a cmd-ism ("Parameter format not correct").
#   * gather_facts MUST be false: implicit gathering runs a PowerShell module BEFORE this file
#     can repair the shell, over whatever shell type the inventory guessed — the exact failure
#     this file exists to prevent. This file loads the facts it needs itself, after the gate.
#   * Pass NO 'vars:' to that include_role. Block vars are precedence 16; include_role params
#     are 20, include_tasks params 21 and extra vars 22 — all outrank the connection scoping
#     below. A stray 'vars: { ansible_shell_type: powershell }' on the include, or
#     '-e ansible_shell_type=...', silently re-breaks the pre-flip stage on a fresh host, and a
#     task file cannot out-precedence its own caller. This is the one scoping limitation, and it
#     is called out here rather than papered over.
#   * This file repairs the HOST, not the controller's connection variables, and deliberately
#     does NOT set_fact them. The suite's LATER plays still need 'ansible_shell_type: powershell'
#     from the inventory.
#
# --- [ What It Does, And Why In This Order ] ------------------------------------------------- #
#   1. TRANSPORT: flip OpenSSH DefaultShell cmd.exe -> PowerShell, reset the connection, then
#      PROVE the flip over a fresh session. Nothing else can run first: every ansible.windows.*
#      module in the suite is a PowerShell module whose command wrapping must match the shell
#      OpenSSH actually serves.
#   2. INITIALIZATION: only now can facts be gathered (fact gathering IS a module run).
#   3. MAIN: require an elevated token, install any declared OpenSSH public trust, and hold the
#      pre-join computer name.
#
# NOTE the deliberate INVERSION of the Linux bootstrap's order (facts/OS-assert first, work
# second): on Windows the transport is not yet trustworthy when the file starts, so the OS
# assert cannot come first — it guards the MAIN work, not the transport repair. Any fact or
# assert placed before the gate is a coin flip, because the file cannot know which shell the
# host is currently serving until it has probed.
# ============================================================================================= #

#region ------ [ Process: Bootstrap The Host ] ------------------------------------------------ #

- name: 'PROCESS | Bootstrap The Windows Server Host'

  # become: BOTH forms, deliberately, and over the WHOLE file rather than just the cmd stage.
  # The keyword alone is not durable — the 'ansible_become' VARIABLE is what ansible-core
  # consults first (constants.py MAGIC_VARIABLE_MAPPING become=('ansible_become',);
  # task_executor._set_become_plugin reads cvars['ansible_become'] and only falls back to the
  # keyword), so a caller with 'ansible_become: true' anywhere in play or inventory scope would
  # defeat a bare 'become: false'. This is NOT belt-and-braces: with a sudo become plugin bound
  # to a Windows shell family, ansible-core raises
  #   "The <cmd|powershell> shell family is incompatible with the sudo become plugin"
  # (plugins/become/__init__.py _build_success_command, which reaches for shell.ECHO /
  # shell.COMMAND_SEP — attributes no Windows shell plugin has) and the FIRST task of this file
  # dies. Consuming products commonly set '[privilege_escalation] become = True' globally.
  # Scoping the guard to the cmd stage only is NOT enough: the post-reset gate then dies with
  # the same error in its 'powershell' form.
  # Escalation here is not merely unnecessary, it is fatal: sudo does not exist on these
  # targets, and module-level become on Windows only ever engages for become_method 'runas'.
  become: false
  vars:
    ansible_become: false

  block:

  #region ------ [ Process: Serve PowerShell Over The Transport ] ----------------------------- #
  #   WHY THIS EXISTS AT ALL: the Terraform layer that builds these instances deliberately
  #   leaves OpenSSH's DefaultShell at cmd.exe — per that framework's own locals.tf, setting it
  #   to PowerShell breaks Terraform remote-exec SCP upload when its dormant SSH bootstrap is
  #   re-activated. That is a Terraform-owned concern this suite does not touch, so the flip is
  #   permanently this file's job, on every fresh boot.
  #
  #   WHY IT MUST BE FIRST AND IDEMPOTENT: a refresh / OS-swap-replaced instance re-arrives with
  #   a fresh Windows boot and DefaultShell back at cmd.exe, regardless of what a prior run
  #   flipped it to.

    - name: 'PROCESS | Serve PowerShell Over The Transport'

      # SCOPE, precisely: block vars are precedence 16. They outrank the per-host
      # 'ansible_shell_type: powershell' a dynamic inventory composes for Windows hosts
      # (inventory host vars, precedence 8) and any play-level value (12), and they END at the
      # block boundary — so the gate / facts / assert tasks below are NOT wrapped as cmd. A
      # task-level copy on each raw task (17) would behave identically but would have to be
      # repeated per task, inviting exactly the copy-paste drift that gave the production
      # reference two tasks with the same name; a play-level copy would be both too wide for a
      # shared framework file and unavailable here, since a task file has no play keywords.
      #
      # WHY cmd AT ALL: this stage's own SSH session lands on the CURRENT, not-yet-flipped
      # DefaultShell (cmd.exe), so its commands must be wrapped cmd-style to execute at all.
      vars:
        ansible_shell_type: 'cmd'

      block:

      #region ------ [ Process: Set OpenSSH DefaultShell To PowerShell ] ---------------------- #

        # BEST-EFFORT BY CONSTRUCTION (failed_when: false), and RE-ENTRANCY is exactly why.
        # An ALREADY-FLIPPED host cannot be reached through the cmd wrapper at all: ansible
        # builds 'chcp.com 65001 >nul 2>&1 && <PowerShell -EncodedCommand ...>'
        # (connection/ssh.py _build_command, using the cmd shell plugin's
        # _SHELL_REDIRECT_ALLNULL / _SHELL_AND), and PowerShell rejects '&&' with
        # "The token '&&' is not a valid statement separator in this version", leaving stdout
        # EMPTY. A guard that treats empty stdout as "not flipped" then mis-fires, the flip
        # below is attempted through the same broken wrapper, and a HARD failure here would
        # abort a run that was actually already healthy. Hence: no task in this stage is allowed
        # to fail the run — the ONLY gate is the post-reset verify, which runs over a fresh
        # session with the shell type the rest of the suite uses.
        - name: 'BEGIN | Read The Current OpenSSH DefaultShell'
          register: '__windows_server_2025_defaultshell_query__'
          changed_when: false
          failed_when: false

          ansible.builtin.raw: 'reg query "HKLM\SOFTWARE\OpenSSH" /v DefaultShell'

        # Fires when the query does NOT already show PowerShell: a never-flipped instance
        # (cmd.exe, or the value missing entirely pre-first-boot), a refresh-replaced instance
        # back at the framework default, or the empty-stdout re-entrant case above. '/f' forces
        # the add with no confirmation prompt.
        #
        # NOTE THE DOUBLED BACKSLASHES below, and do not "clean them up". Unlike the raw command
        # strings (verbatim text, no {{ }} involved, correctly single), this 'when:' IS a Jinja
        # expression, and Jinja applies Python-style escapes inside '...' string literals. A
        # single '\v' decodes to a VERTICAL TAB (0x0b), so
        # 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' silently becomes
        # 'C:\Windows\System32\WindowsPowerShell<VT>1.0\powershell.exe' and never matches reg
        # query's real output — breaking the idempotency guard forever, with no error anywhere.
        # '\W', '\S' and '\p' are not valid escapes and survive unharmed, which is exactly why
        # the bug is invisible on inspection: 90% of the path still looks right.
        - name: 'PROCESS | Set OpenSSH DefaultShell To PowerShell'
          when: >-
            'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe' not in
            (__windows_server_2025_defaultshell_query__.stdout | default('', true))
          changed_when: true
          failed_when: false

          ansible.builtin.raw: >-
            reg add "HKLM\SOFTWARE\OpenSSH" /v DefaultShell /t REG_SZ
            /d "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" /f

      #endregion --- [ Process: Set OpenSSH DefaultShell To PowerShell ] ---------------------- #

  #region ------ [ Process: Rebind The Session To The New Shell ] ----------------------------- #

    # UNCONDITIONAL — no 'when:' — for two reasons: (a) ansible-core explicitly lists
    # reset_connection among the meta actions that do NOT support conditionals
    # (strategy/__init__.py), so a 'when:' would be warned about and IGNORED — writing one would
    # be a lie in the source; (b) it is harmless when nothing was flipped (one extra reconnect)
    # but ESSENTIAL when it was.
    #
    # THE MUX MECHANIC (do not delete this task as "unnecessary" without re-reading this):
    # OpenSSH serves the shell that was bound to the ControlPersist master AT THE MOMENT THAT
    # MASTER WAS OPENED, not at the moment a command is sent. The query task above already
    # opened (or reused) a master while DefaultShell was still cmd, and ControlPersist keeps
    # that cmd-bound master warm well past this file. The registry flip only affects masters
    # opened AFTER it. Without this reset, the next task — and the next play — ride that SAME
    # warm cmd-bound socket with powershell-style wrapping and die on a cmd-ism ("Parameter
    # format not correct"), which is exactly what a live -vvvv repro traced to this.
    # Sitting OUTSIDE the cmd-scoped block is intentional: it is the boundary between the two
    # transport worlds, and it is shell-agnostic (the reset only runs 'ssh -O check' then
    # 'ssh -O stop' against the mux socket).
    - name: 'PROCESS | Reset The Connection To Apply The New Shell'
      ansible.builtin.meta: 'reset_connection'

    # THE REAL GATE. Everything above is best-effort precisely because a re-entrant run cannot
    # talk to an already-flipped host through the cmd wrapper. This task runs over the FRESH
    # post-reset session with the powershell shell type the rest of the suite uses, so it is the
    # first command in this file that is guaranteed to be wrapped correctly for whatever shell
    # is actually serving. If the flip genuinely did not take, it fails loudly HERE rather than
    # letting a later play die on an unexplained cmd-ism.
    #
    # The task var (precedence 17) is declared explicitly rather than inherited from the
    # inventory: a shared framework file must not depend on the caller's inventory having
    # composed ansible_shell_type at all, and 17 also outranks a block-scoped 16 if this task is
    # ever moved back inside the cmd block.
    - name: 'END | Verify DefaultShell Now Serves PowerShell'
      vars:
        ansible_shell_type: 'powershell'
      register: '__windows_server_2025_defaultshell_verify__'
      changed_when: false
      failed_when: >-
        'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe' not in
        (__windows_server_2025_defaultshell_verify__.stdout | default('', true))

      ansible.builtin.raw: 'reg query "HKLM\SOFTWARE\OpenSSH" /v DefaultShell'

  #endregion --- [ Process: Rebind The Session To The New Shell ] ----------------------------- #

  #endregion --- [ Process: Serve PowerShell Over The Transport ] ----------------------------- #

  #region ------ [ Begin: Read The Host And Confirm It Is Supported ] ------------------------- #

    - name: 'BEGIN | Read The Host And Confirm It Is Supported'
      block:

      #region ------ [ Begin: Load The Required Facts ] --------------------------------------- #

        # CONDITIONAL AND NARROW, same contract as the Linux bootstrap: this file is called on
        # hosts whose facts may or may not have been gathered, so it loads only what its own
        # assert reads, and only if that is missing.
        #
        # WINDOWS DIFFERENCES, all deliberate:
        #   * The guard names WINDOWS facts. 'distribution' is NOT usable here: on Windows it
        #     comes from Win32_OperatingSystem.Caption, which ansible.windows' setup module only
        #     sets when the session token is ELEVATED, and which its own source comment says is
        #     LOCALIZED. os_family / distribution_version / os_product_type come from
        #     [Environment]::OSVersion and a native ProductType call — always present, never
        #     localized, no elevation needed.
        #   * There is deliberately no network-facts sibling: nothing in this file or in the
        #     suite's Windows path reads ansible_default_ipv4 (the agent's manager address comes
        #     from the MANAGER's hostvars, and the agent's own address from inventory), and
        #     gathering 'network' on Windows pulls a much heavier subset.
        #   * FQCN, not ansible.builtin.setup. Both work — builtin resolves here because a
        #     Windows connection sets module_implementation_preferences ('.ps1','.exe',''), so
        #     'setup' becomes 'setup.ps1', which config/ansible_builtin_runtime.yml redirects to
        #     ansible.windows.setup. The FQCN simply removes the question; the dependency is
        #     identical either way, since builtin lands on the same collection module.
        #   * The '!all','!min',<subset> spelling is identical to the Linux one and behaves
        #     identically here ('!all' excludes all-minus-min, '!min' then excludes min,
        #     'distribution' adds it back). Unlike POSIX setup, an INVALID subset only WARNS on
        #     Windows rather than failing — a typo degrades silently, so do not mistype it.
        - name: 'BEGIN | Load The Required Facts'
          when: >-
            ansible_facts.os_family is undefined
            or ansible_facts.distribution_version is undefined
            or ansible_facts.os_product_type is undefined
          ansible.windows.setup: { gather_subset: [ '!all', '!min', 'distribution' ] }

      #endregion --- [ Begin: Load The Required Facts ] --------------------------------------- #

      #region ------ [ Begin: Require A Supported Release ] ----------------------------------- #

        # BUILD NUMBER, not major version: EVERY Windows since 10 reports major version 10, so
        # the Linux reference's '(major_version | int) == 8' shape asserts nothing at all here.
        # Windows Server 2025 is NT 10.0 build 26100 (Server 2022 is 20348, Server 2019 is
        # 17763). The build ALONE is not enough here: Windows 11 24H2 is also build 26100, so
        # os_product_type is what separates client from server. It comes from a native
        # ProductType call that needs no elevated token. Both 'server' and 'domain_controller'
        # are accepted: a domain controller IS a server, and ProductType reports it separately
        # only to name the role it holds.
        # distribution_version is [Environment]::OSVersion.Version.ToString(), e.g.
        # '10.0.26100.0'; element 2 is the build. 'distribution' and installation type are
        # printed for the operator only, never asserted on.
        - name: 'BEGIN | Require A Supported Windows Server Release'
          vars:
            # Padded BEFORE indexing: an unexpected short version string must not blow up the
            # assert itself with an index error instead of reporting the OS it actually found.
            __os_build__: >-
              {{ (((ansible_facts.distribution_version | default('') | string).split('.'))
              + ['0', '0', '0'])[2] }}
          ansible.builtin.assert:
            that:
              - (ansible_facts.os_family | default('') | string) == 'Windows'
              - (ansible_facts.os_product_type | default('') | string)
                in ['server', 'domain_controller']
              - (__os_build__ | int) == 26100
            fail_msg: >-
              The role 'windows_server_2025' is intended for Windows Server 2025
              (NT 10.0 build 26100) hosts only. Detected:
              {{ ansible_facts.distribution
              | default('<unreported: needs an elevated token>', true) }}
              version {{ ansible_facts.distribution_version | default('<unknown>', true) }},
              family {{ ansible_facts.os_family | default('<unknown>', true) }},
              product type {{ ansible_facts.os_product_type | default('<unknown>', true) }},
              installation type
              {{ ansible_facts.os_installation_type | default('<unknown>', true) }}.
              NOTE 'distribution' is reported only when the session token is elevated, and it is
              localized — it is printed for the operator, never asserted on.
            quiet: true

      #endregion --- [ Begin: Require A Supported Release ] ----------------------------------- #

  #endregion --- [ Begin: Read The Host And Confirm It Is Supported ] ------------------------- #

  #region ------ [ Process: Converge The Host Identity ] -------------------------------------- #
  #   INTENTIONALLY THIN. Every item the Linux bootstrap does in its Main stage is either
  #   already guaranteed on Windows or actively wrong to port:
  #     * python3.12 / pip / venv / venv drift probe / venv permissions — nothing on a Windows
  #       target runs a Python module at all. The suite's Windows path is entirely win_*/raw,
  #       and its only boto3 work is delegated to the CONTROLLER. Bootstrap must not install
  #       Python here.
  #     * prerequisite roles (ca_certificates, python3_pip) — both are Linux roles, and only
  #       python3_pip even exists in this framework; a loop + include_role here would reference
  #       a role that cannot run.
  #     * an exec-capable remote-tmp base — Windows has no noexec mounts and no fapolicyd, and
  #       modules are pipelined into the shell on this connection rather than staged in
  #       remote_tmp. This is precisely where the Linux fapolicyd requirement has NO analogue.
  #     * a TLS floor — nothing target-side makes an outbound .NET HTTPS call; the agent MSI is
  #       fetched controller-side and pushed. The customary ServicePointManager::SecurityProtocol
  #       bootstrap line would protect nothing.
  #     * an execution-policy relaxation — ansible already passes '-ExecutionPolicy Unrestricted'
  #       on every command it wraps, so Set-ExecutionPolicy is a no-op; and in the only case
  #       that would matter (a machine GPO) MachinePolicy outranks it anyway.
  #     * hosts-file normalisation — the Windows analogue of /etc/hosts lives in
  #       C:\Windows\System32\drivers\etc, EXACTLY the directory a deploy's Windows FIM proof may
  #       watch in realtime; a bootstrap that wrote an entry there would inject spurious
  #       file-integrity alerts into the very evidence such a run exists to produce.
  #       (The computer NAME is no longer in this list: a host that joins a directory carries its
  #       name into the computer object, so it must be set here, before any join — see MAIN.)
  #
  #   NOT INCLUDED, deliberately, but worth knowing: an assert that the ssh transfer method is
  #   not pinned to 'scp'. scp shells out through DefaultShell and breaks once it is PowerShell
  #   — the same hazard the Terraform layer's locals.tf describes. Ansible's default 'smart'
  #   tries sftp (a shell-independent subsystem) first, so this is latent, not live, and a
  #   var-level assert cannot see an ini-level setting anyway.

    - name: 'PROCESS | Converge The Host Identity'
      block:

      #region ------ [ Begin: Require An Elevated Session Token ] ----------------------------- #

        # The one precondition the suite cannot recover from on its own. Installing the agent
        # MSI, writing under 'C:\Program Files (x86)', and driving a Windows service all require
        # an elevated token, and NOTHING in the suite requests elevation: the Windows plays run
        # become: false because sudo does not exist there and 'runas' would need a stored
        # password. Today that works because the SSH login is the built-in Administrator
        # (RID 500), whose token is not UAC-filtered by default. A hardened image that enables
        # Admin Approval Mode for the built-in Administrator (FilterAdministratorToken) silently
        # produces a FILTERED token: the MSI install then fails deep inside the agent role, and
        # the tell is that ansible_distribution above comes back null. Probe it in one round
        # trip and fail here instead, with the reason, at the cheapest possible point.
        # This is a CHECK, not a repair: a filtered token cannot elevate itself in-session.
        - name: 'BEGIN | Read Whether The Session Token Is Elevated'
          register: '__windows_server_2025_token_elevated__'
          changed_when: false

          ansible.windows.win_powershell:
            error_action: 'stop'
            script: |
              $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
              $principal = [Security.Principal.WindowsPrincipal]$identity
              $adminRole = [Security.Principal.WindowsBuiltInRole]::Administrator
              $Ansible.Result = @{
                  user = $identity.Name
                  elevated = $principal.IsInRole($adminRole)
              }
              $Ansible.Changed = $false

        - name: 'BEGIN | Require An Elevated Session Token'
          ansible.builtin.assert:
            that:
              - (__windows_server_2025_token_elevated__.result.elevated | default(false)) | bool
            fail_msg: >-
              The connected session
              ({{ __windows_server_2025_token_elevated__.result.user | default('<unknown>') }})
              does not hold an
              elevated Administrators token. The suite installs an MSI, writes under
              'C:\Program Files (x86)' and manages a service with become: false, so it cannot
              elevate for itself. Check UAC Admin Approval Mode for the built-in Administrator
              (FilterAdministratorToken) and the SSH login used for this host.
            quiet: true

      #endregion --- [ Begin: Require An Elevated Session Token ] ----------------------------- #

        #region ------ [ Begin: Validate The Declared OpenSSH Principals ] -------------------- #
        # The declaration is hand-authored, and a malformed or reserved derived name would make a
        # later connection fail after this play had already changed the host.

        - name: 'BEGIN | Validate The Declared OpenSSH Principals'
          vars:
            __principals__: "{{ ssh_trusted_principals | default([]) }}"
            __users__: "{{ __principals__ | map(attribute='user') | map('lower') | list }}"
            __key_files__: >-
              {{ __users__ | map('regex_replace', '\\', '_')
                 | map('regex_replace', '$', '_authorized_keys') | list }}
          when: (ssh_trusted_principals | default([]) | length) > 0

          ansible.builtin.assert:
            fail_msg: >-
              ssh_trusted_principals must contain unique {user, public_key} mappings. Users must
              be DOMAIN\user or unqualified names. Keys must be shaped OpenSSH RSA or ECDSA
              public keys. No declaration may derive the reserved
              administrators_authorized_keys file.
            quiet: true
            that:
              - ssh_trusted_principals | default([]) is sequence
              - ssh_trusted_principals | default([]) is not string
              - __principals__ | reject('mapping') | list | length == 0
              - __principals__ | rejectattr('user', 'defined') | list | length == 0
              - __principals__ | rejectattr('public_key', 'defined') | list | length == 0
              - >-
                __principals__ | map(attribute='user') | map('string')
                | reject('match', '^([A-Za-z0-9.-]+\\\\[A-Za-z0-9._-]+|[A-Za-z0-9._-]+)$')
                | list | length == 0
              - >-
                __principals__ | map(attribute='public_key') | map('string')
                | reject('match', '^(ecdsa-sha2-nistp(256|384|521)|ssh-rsa) '
                  ~ 'AAAA[0-9A-Za-z+/]+=*( [^\r\n]*)?$') | list | length == 0
              - __users__ | unique | length == __users__ | length
              - __key_files__ | unique | length == __key_files__ | length
              - "'administrators_authorized_keys' not in __key_files__"

        #endregion --- [ Begin: Validate The Declared OpenSSH Principals ] -------------------- #

        #region ------ [ Process: Install The Declared OpenSSH Keys ] ------------------------- #
        # Staging and installation are one action split into two phases so a later invalid key
        # cannot leave an earlier principal's live file changed.

        - name: 'PROCESS | Stage And Validate Every OpenSSH Key Candidate'
          changed_when: false
          register: '__windows_server_2025_key_candidates__'
          when: (ssh_trusted_principals | default([]) | length) > 0

          ansible.windows.win_powershell:
            depth: 2
            error_action: 'stop'
            parameters:
              PrincipalsJson: "{{ ssh_trusted_principals | to_json }}"
            remote_src: false
            script: |
              Param([System.String]$PrincipalsJson)
              $Principals = @($PrincipalsJson | ConvertFrom-Json)
              $Directory = Join-Path $env:ProgramData 'ssh'
              $Keygen = Join-Path $env:WINDIR 'System32\OpenSSH\ssh-keygen.exe'
              $Candidates = @()

              Function Invoke-NativeCommand {
                Param(
                  [System.String]$FilePath,
                  [System.String[]]$Argument
                )
                $Previous = $ErrorActionPreference
                Try {
                  $ErrorActionPreference = 'Continue'
                  $Output = & $FilePath @Argument 2>&1
                  $Exit = $LASTEXITCODE
                } Finally {
                  $ErrorActionPreference = $Previous
                }
                Return [PSCustomObject]@{
                  ExitCode = $Exit
                  Output = @($Output)
                  Text = [System.String]($Output -join [Environment]::NewLine)
                }
              }

              Try {
                ForEach ($Principal in $Principals) {
                  $User = $Principal.user.ToLowerInvariant()
                  $Name = '{0}_authorized_keys' -f $User.Replace('\', '_')
                  $Candidate = Join-Path $Directory ($Name + '.candidate')
                  $Candidates += $Candidate
                  [IO.File]::WriteAllText(
                    $Candidate,
                    $Principal.public_key.TrimEnd() + [Environment]::NewLine,
                    [Text.UTF8Encoding]::new($false)
                  )
                  $Validation = Invoke-NativeCommand -FilePath $Keygen -Argument @(
                    '-l', '-f', $Candidate)
                  If ($Validation.ExitCode -ne 0) {
                    Throw ("OpenSSH rejected the key candidate for '$User': " +
                      "'$($Validation.Text)'.")
                  }
                }
              } Catch {
                $Candidates | Where-Object { Test-Path -LiteralPath $PSItem } |
                  Remove-Item -Force
                Throw
              }
              $Ansible.Changed = $false

        # ------------------------------------------------------------------------------------- #

        - name: 'PROCESS | Install Every Validated OpenSSH Key'
          when:
            - (ssh_trusted_principals | default([]) | length) > 0

          ansible.windows.win_powershell:
            depth: 2
            error_action: 'stop'
            parameters:
              PrincipalsJson: "{{ ssh_trusted_principals | to_json }}"
            remote_src: false
            script: |
              Param([System.String]$PrincipalsJson)
              $Principals = @($PrincipalsJson | ConvertFrom-Json)
              $Directory = Join-Path $env:ProgramData 'ssh'
              $Administrators = [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
              $System = [Security.Principal.SecurityIdentifier]::new('S-1-5-18')
              $Allow = [Security.AccessControl.AccessControlType]::Allow
              $None = [Security.AccessControl.InheritanceFlags]::None
              $NoPropagation = [Security.AccessControl.PropagationFlags]::None
              $Full = [Security.AccessControl.FileSystemRights]::FullControl

              Function Test-KeyAcl([System.String]$Path) {
                $Acl = Get-Acl -LiteralPath $Path
                $Rules = @($Acl.GetAccessRules($true, $true,
                  [Security.Principal.SecurityIdentifier]))
                $Owner = $Acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
                If ($Owner -ne $Administrators.Value -or $Rules.Count -ne 2) {
                  Return $false
                }
                $Expected = @($Administrators.Value, $System.Value) | Sort-Object
                $Actual = @($Rules | ForEach-Object { $PSItem.IdentityReference.Value }) |
                  Sort-Object
                Return -not ($Rules | Where-Object {
                  $PSItem.IsInherited -or $PSItem.AccessControlType -ne $Allow -or
                  $PSItem.FileSystemRights -ne $Full -or $PSItem.InheritanceFlags -ne $None -or
                  $PSItem.PropagationFlags -ne $NoPropagation
                }) -and (($Expected -join '|') -eq ($Actual -join '|'))
              }

              $Ansible.Changed = $false
              ForEach ($Principal in $Principals) {
                $User = $Principal.user.ToLowerInvariant()
                $Name = '{0}_authorized_keys' -f $User.Replace('\', '_')
                $Candidate = Join-Path $Directory ($Name + '.candidate')
                $Live = Join-Path $Directory $Name
                $Same = (Test-Path -LiteralPath $Live) -and
                  ([IO.File]::ReadAllText($Live) -ceq [IO.File]::ReadAllText($Candidate)) -and
                  (Test-KeyAcl -Path $Live)
                If ($Same) {
                  Remove-Item -LiteralPath $Candidate -Force
                  Continue
                }

                $Acl = [Security.AccessControl.FileSecurity]::new()
                $Acl.SetAccessRuleProtection($true, $false)
                $Acl.SetOwner($Administrators)
                $Acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                  $System, $Full, $None, $NoPropagation, $Allow))
                $Acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                  $Administrators, $Full, $None, $NoPropagation, $Allow))
                Set-Acl -LiteralPath $Candidate -AclObject $Acl
                Move-Item -LiteralPath $Candidate -Destination $Live -Force
                If (-not (Test-KeyAcl -Path $Live)) {
                  Throw ("The installed OpenSSH key file for '$User' has the wrong owner or " +
                    'ACE set.')
                }
                $Ansible.Changed = $true
              }

        #endregion --- [ Process: Install The Declared OpenSSH Keys ] ------------------------- #

        #region ------ [ Process: Converge The OpenSSH Configuration ] ------------------------ #
        # An interrupted controller produces the recoverable layouts; a missing administrators
        # block identifies a foreign image, and a provisioning account can leave a different
        # owner that the replacement must carry rather than silently change.

        - name: 'PROCESS | Recover And Converge The OpenSSH Configuration'
          when: (ssh_trusted_principals | default([]) | length) > 0

          ansible.windows.win_powershell:
            depth: 2
            error_action: 'stop'
            parameters:
              PrincipalsJson: "{{ ssh_trusted_principals | to_json }}"
            remote_src: false
            script: |
              Param([System.String]$PrincipalsJson)
              $Principals = @($PrincipalsJson | ConvertFrom-Json) |
                ForEach-Object {
                  [PSCustomObject]@{
                    User = $PSItem.user.ToLowerInvariant()
                    File = '{0}_authorized_keys' -f
                      $PSItem.user.ToLowerInvariant().Replace('\', '_')
                  }
                } | Sort-Object User
              $Directory = Join-Path $env:ProgramData 'ssh'
              $Live = Join-Path $Directory 'sshd_config'
              $Backup = Join-Path $Directory 'sshd_config.backup'
              $Candidate = Join-Path $Directory 'sshd_config.candidate'
              $Sshd = Join-Path $env:WINDIR 'System32\OpenSSH\sshd.exe'
              $Changed = $false

              Function Invoke-NativeCommand {
                Param(
                  [System.String]$FilePath,
                  [System.String[]]$Argument
                )
                $Previous = $ErrorActionPreference
                Try {
                  $ErrorActionPreference = 'Continue'
                  $Output = & $FilePath @Argument 2>&1
                  $Exit = $LASTEXITCODE
                } Finally {
                  $ErrorActionPreference = $Previous
                }
                Return [PSCustomObject]@{
                  ExitCode = $Exit
                  Output = @($Output)
                  Text = [System.String]($Output -join [Environment]::NewLine)
                }
              }

              Function Get-Sddl([System.String]$Path) {
                Return (Get-Acl -LiteralPath $Path).GetSecurityDescriptorSddlForm(
                  [Security.AccessControl.AccessControlSections]'Owner, Access')
              }
              Function Test-Config([System.String]$Path) {
                Return Invoke-NativeCommand -FilePath $Sshd -Argument @('-t', '-f', $Path)
              }
              Function Restore-Backup([System.String]$Layout, [System.String]$Snapshot) {
                $BackupValidation = Test-Config -Path $Backup
                If ($BackupValidation.ExitCode -ne 0) {
                  Throw ("Cannot recover the $Layout layout: the backup configuration is " +
                    "invalid; OpenSSH said '$($BackupValidation.Text)'.")
                }
                If (Test-Path -LiteralPath $Live) { Remove-Item -LiteralPath $Live -Force }
                Move-Item -LiteralPath $Backup -Destination $Live -Force
                $RestoredValidation = Test-Config -Path $Live
                If ($RestoredValidation.ExitCode -ne 0 -or
                    (Get-Sddl -Path $Live) -ne $Snapshot) {
                  Throw ("Recovery of the $Layout layout did not preserve valid content and " +
                    "metadata; OpenSSH said '$($RestoredValidation.Text)'.")
                }
                If (Test-Path -LiteralPath $Candidate) {
                  Remove-Item -LiteralPath $Candidate -Force
                }
                $Ansible.Result = @{ Layout = $Layout }
              }

              If (-not (Test-Path -LiteralPath $Live)) {
                If (-not (Test-Path -LiteralPath $Backup)) {
                  Throw 'OpenSSH configuration is missing and no recovery backup exists.'
                }
                $Snapshot = Get-Sddl -Path $Backup
                Restore-Backup -Layout 'missing-live' -Snapshot $Snapshot
                $Changed = $true
              } Else {
                $LiveValidation = Test-Config -Path $Live
                $LiveValid = $LiveValidation.ExitCode -eq 0
                If (Test-Path -LiteralPath $Backup) {
                  $Snapshot = Get-Sddl -Path $Backup
                  If (-not $LiveValid) {
                    Restore-Backup -Layout 'invalid-live' -Snapshot $Snapshot
                    $Changed = $true
                    $LiveValid = $true
                  } ElseIf ((Get-Sddl -Path $Live) -eq $Snapshot) {
                    Remove-Item -LiteralPath $Backup -Force
                    If (Test-Path -LiteralPath $Candidate) {
                      Remove-Item -LiteralPath $Candidate -Force
                    }
                  } Else {
                    Restore-Backup -Layout 'interrupted-replacement' -Snapshot $Snapshot
                    $Changed = $true
                    $LiveValid = $true
                  }
                } ElseIf ($LiveValid -and (Test-Path -LiteralPath $Candidate)) {
                  Remove-Item -LiteralPath $Candidate -Force
                }
              }

              $Text = [IO.File]::ReadAllText($Live)
              $NewLine = If ($Text.Contains("`r`n")) { "`r`n" } Else { "`n" }
              $Lines = @($Text -split "`r?`n", 0)
              $MatchIndexes = @(0..($Lines.Count - 1) | Where-Object {
                $Lines[$PSItem] -match '^\s*Match\s+'
              })
              $DeclaredUsers = @($Principals | ForEach-Object { $PSItem.User })
              $Kept = [Collections.Generic.List[String]]::new()
              $Cursor = 0
              ForEach ($Index in $MatchIndexes) {
                If ($Index -lt $Cursor) { Continue }
                For ($I = $Cursor; $I -lt $Index; $I++) { $Kept.Add($Lines[$I]) }
                $Next = @($MatchIndexes | Where-Object { $PSItem -gt $Index } |
                  Select-Object -First 1)
                $End = If ($Next.Count) { $Next[0] } Else { $Lines.Count }
                $Block = @($Lines[$Index..($End - 1)])
                $Header = $Block[0]
                $NonBlank = @($Block | Where-Object { $PSItem.Trim().Length -gt 0 })
                $Managed = $false
                $ManagedUserPattern =
                  '^\s*Match\s+User\s+([A-Za-z0-9._-]+(?:\\[A-Za-z0-9._-]+)?)\s*$'
                If ($Header -match $ManagedUserPattern) {
                  $User = $Matches[1].ToLowerInvariant()
                  $ExpectedFile = '{0}_authorized_keys' -f $User.Replace('\', '_')
                  $Managed = $NonBlank.Count -eq 2 -and
                    $NonBlank[1] -match
                      ('^\s*AuthorizedKeysFile\s+__PROGRAMDATA__/ssh/{0}\s*$' -f
                       [Regex]::Escape($ExpectedFile))
                  If ($DeclaredUsers -contains $User -and -not $Managed) {
                    Throw ("Existing Match User stanza for '$User' is not owned by this " +
                      'declaration.')
                  }
                } ElseIf ($Header -match '^\s*Match\s+User\s+(.+)$') {
                  $Selectors = @($Matches[1].Split(',') |
                    ForEach-Object { $PSItem.Trim().ToLowerInvariant() })
                  $Conflict = @($DeclaredUsers | Where-Object { $Selectors -contains $PSItem })
                  If ($Conflict.Count) {
                    Throw ("Existing compound Match User stanza names declared user '{0}'." -f
                      $Conflict[0])
                  }
                }
                If (-not $Managed) { $Block | ForEach-Object { $Kept.Add($PSItem) } }
                $Cursor = $End
              }
              For ($I = $Cursor; $I -lt $Lines.Count; $I++) { $Kept.Add($Lines[$I]) }

              $AdminIndex = @(0..($Kept.Count - 1) | Where-Object {
                $Kept[$PSItem] -match '^\s*Match\s+Group\s+administrators\s*$'
              } | Select-Object -First 1)
              If (-not $AdminIndex.Count) {
                Throw 'OpenSSH configuration has no Match Group administrators block.'
              }
              $ManagedLines = [Collections.Generic.List[String]]::new()
              ForEach ($Principal in $Principals) {
                $ManagedLines.Add(('Match User {0}' -f $Principal.User))
                $ManagedLines.Add(('    AuthorizedKeysFile __PROGRAMDATA__/ssh/{0}' -f
                  $Principal.File))
                $ManagedLines.Add('')
              }
              $Output = [Collections.Generic.List[String]]::new()
              For ($I = 0; $I -lt $Kept.Count; $I++) {
                If ($I -eq $AdminIndex[0]) {
                  $ManagedLines | ForEach-Object { $Output.Add($PSItem) }
                }
                $Output.Add($Kept[$I])
              }
              $CandidateText = ($Output -join $NewLine)
              [IO.File]::WriteAllText(
                $Candidate, $CandidateText, [Text.UTF8Encoding]::new($false))
              $LiveBytes = [Convert]::ToBase64String([IO.File]::ReadAllBytes($Live))
              $CandidateBytes = [Convert]::ToBase64String([IO.File]::ReadAllBytes($Candidate))
              If ($LiveValid -and $LiveBytes -ceq $CandidateBytes) {
                Remove-Item -LiteralPath $Candidate -Force
                $Ansible.Changed = $Changed
                Return
              }
              $Validation = Invoke-NativeCommand -FilePath $Sshd -Argument @(
                '-t', '-f', $Candidate)
              If ($Validation.ExitCode -ne 0) {
                Remove-Item -LiteralPath $Candidate -Force
                Throw "OpenSSH rejected the candidate configuration: '$($Validation.Text)'."
              }
              ForEach ($Principal in $Principals) {
                $Effective = Invoke-NativeCommand -FilePath $Sshd -Argument @(
                  '-T', '-f', $Candidate, '-C',
                  "user=$($Principal.User),host=h,addr=127.0.0.1")
                If ($Effective.ExitCode -ne 0 -or
                    $Effective.Output -notcontains
                      ('authorizedkeysfile __PROGRAMDATA__/ssh/{0}' -f $Principal.File)) {
                  Remove-Item -LiteralPath $Candidate -Force
                  Throw ('OpenSSH did not select the declared key file for ' +
                    "'$($Principal.User)'; it said '$($Effective.Text)'.")
                }
              }

              $OriginalAcl = Get-Acl -LiteralPath $Live
              $OriginalSddl = $OriginalAcl.GetSecurityDescriptorSddlForm(
                [Security.AccessControl.AccessControlSections]'Owner, Access')
              $Owner = $OriginalAcl.GetOwner([Security.Principal.SecurityIdentifier])
              $CandidateAcl = Get-Acl -LiteralPath $Candidate
              $CandidateAcl.SetOwner($Owner)
              Set-Acl -LiteralPath $Candidate -AclObject $CandidateAcl
              $ReadOwner = (Get-Acl -LiteralPath $Candidate).GetOwner(
                [Security.Principal.SecurityIdentifier]).Value
              If ($ReadOwner -ne $Owner.Value) {
                Remove-Item -LiteralPath $Candidate -Force
                Throw "Cannot carry OpenSSH owner '$($Owner.Value)'; read back '$ReadOwner'."
              }

              $ReplaceError = $null
              Try {
                [IO.File]::Replace($Candidate, $Live, $Backup)
              } Catch {
                $ReplaceError = $PSItem.Exception.Message
                If (-not (Test-Path -LiteralPath $Live) -and
                    (Test-Path -LiteralPath $Backup)) {
                  Move-Item -LiteralPath $Backup -Destination $Live -Force
                }
                If (Test-Path -LiteralPath $Candidate) {
                  Remove-Item -LiteralPath $Candidate -Force
                }
              }
              $LiveValidation = If (Test-Path -LiteralPath $Live) {
                Test-Config -Path $Live
              }
              $LiveValid = (Test-Path -LiteralPath $Live) -and
                $LiveValidation.ExitCode -eq 0
              $LiveSddl = If (Test-Path -LiteralPath $Live) { Get-Sddl -Path $Live } Else { '' }
              If ($ReplaceError) {
                If (-not $LiveValid -or $LiveSddl -ne $OriginalSddl) {
                  Throw ("OpenSSH replacement failed ($ReplaceError) and live revalidation " +
                    "failed; OpenSSH said '$($LiveValidation.Text)'.")
                }
                Throw ('OpenSSH replacement failed with a valid preserved live file: ' +
                  $ReplaceError)
              }
              If (-not $LiveValid -or $LiveSddl -ne $OriginalSddl) {
                $Layout = If (-not $LiveValid) { 'invalid-live' } Else { 'metadata-difference' }
                If (Test-Path -LiteralPath $Live) { Remove-Item -LiteralPath $Live -Force }
                Move-Item -LiteralPath $Backup -Destination $Live -Force
                $RollbackValidation = Test-Config -Path $Live
                If ($RollbackValidation.ExitCode -ne 0 -or
                    (Get-Sddl -Path $Live) -ne $OriginalSddl) {
                  Throw ("OpenSSH $Layout rollback did not restore valid content and " +
                    "metadata; OpenSSH said '$($RollbackValidation.Text)'.")
                }
                Throw ("OpenSSH replacement produced $Layout; the backup was restored. " +
                  "OpenSSH said '$($LiveValidation.Text)'.")
              }
              Remove-Item -LiteralPath $Backup -Force
              If (Test-Path -LiteralPath $Candidate) {
                Remove-Item -LiteralPath $Candidate -Force
              }
              $Ansible.Changed = $true

        #endregion --- [ Process: Converge The OpenSSH Configuration ] ------------------------ #

        #region ------ [ Process: Hold A Current OpenSSH Listener ] --------------------------- #
        # A failed prior restart or a stopped service can leave valid disk state behind a stale
        # or absent listener, so the service PID and process start time prove convergence.

        - name: 'PROCESS | Hold A Current OpenSSH Listener'
          when: (ssh_trusted_principals | default([]) | length) > 0

          ansible.windows.win_powershell:
            depth: 2
            error_action: 'stop'
            remote_src: false
            script: |
              $Config = Join-Path $env:ProgramData 'ssh\sshd_config'
              $Service = Get-CimInstance Win32_Service -Filter "Name='sshd'"
              $Process = If ($Service.ProcessId) {
                Get-Process -Id $Service.ProcessId -ErrorAction SilentlyContinue
              }
              $ConfigTime = (Get-Item -LiteralPath $Config).LastWriteTimeUtc
              $Stale = $Service.State -ne 'Running' -or -not $Process -or
                $Process.StartTime.ToUniversalTime() -le $ConfigTime
              $Ansible.Changed = $false
              If ($Stale) {
                If ($Service.State -eq 'Running') { Restart-Service -Name 'sshd' -Force } Else {
                  Start-Service -Name 'sshd'
                }
                $Ansible.Changed = $true
                $Service = Get-CimInstance Win32_Service -Filter "Name='sshd'"
                $Process = If ($Service.ProcessId) {
                  Get-Process -Id $Service.ProcessId -ErrorAction SilentlyContinue
                }
              }
              If ($Service.State -ne 'Running' -or -not $Process -or
                  $Process.StartTime.ToUniversalTime() -le $ConfigTime) {
                Throw 'OpenSSH has no running listener process newer than sshd_config.'
              }

        #endregion --- [ Process: Hold A Current OpenSSH Listener ] --------------------------- #

        #region ------ [ Process: Set The Computer Name ] ------------------------------------- #
        # The host's own name. A host that later joins a directory carries this name into its
        # computer object, and a rename AFTER a join needs directory credentials the bootstrap
        # does not have -- so it happens here, first. win_hostname only queues the change; the
        # restart applies it, and the name is read back from the machine afterwards, so nothing
        # downstream runs on a half-renamed host.
        #
        # It defaults to 'inventory_hostname': an inventory that names its hosts after the
        # machines already carries the answer, and passing it again would be a second copy of one
        # value. A consumer whose inventory names hosts by something that is not a computer name
        # -- an address, an instance id -- sets 'windows_bootstrap_hostname' to '' to leave the
        # name alone. Declare it as a PLAY variable, never as 'vars:' on the include
        # (call contract above).

        # A rename is only possible while the host stands alone. Once it has joined a directory
        # its name lives in the computer object, and changing it needs directory credentials this
        # bootstrap does not hold -- Windows answers 'Access is denied'. That is an ORDERING
        # fault, not a runtime one, so it is named here rather than left to surface as
        # a permission error.

        - name: 'BEGIN | Read The Current Name And Directory Membership'
          changed_when: false
          register: '__windows_server_2025_identity__'

          ansible.windows.win_shell: |
            $system = Get-CimInstance -ClassName 'Win32_ComputerSystem'
            Write-Output ($system.Name + '|' + $system.PartOfDomain)

        - name: 'BEGIN | Require The Name To Be Set Before Any Join'
          vars:
            __windows_bootstrap_current__: >-
              {{ (__windows_server_2025_identity__.stdout | trim).split('|') | first | upper }}
            __windows_bootstrap_joined__: >-
              {{ ((__windows_server_2025_identity__.stdout | trim).split('|')
              | last | lower) == 'true' }}
            __windows_bootstrap_declared__: >-
              {{ windows_bootstrap_hostname | default(inventory_hostname)
              | string | trim | upper }}
          when: >-
            (windows_bootstrap_hostname | default(inventory_hostname)
            | string | trim | length) > 0

          ansible.builtin.assert:
            fail_msg: >-
              '{{ __windows_bootstrap_current__ }}' has already joined a directory, so it
              cannot be
              renamed to '{{ __windows_bootstrap_declared__ }}' from here -- that rename needs
              directory credentials this bootstrap does not hold. The name must be set BEFORE the
              join: run this bootstrap ahead of the role that joins, or rename the computer
              object
              in the directory and let the host follow it.
            quiet: true
            that:
              - not (__windows_bootstrap_joined__ | bool)
                or __windows_bootstrap_current__ == __windows_bootstrap_declared__

        - name: 'PROCESS | Set The Computer Name'
          when: >-
            (windows_bootstrap_hostname | default(inventory_hostname)
            | string | trim | length) > 0
          register: '__windows_server_2025_hostname__'
          ansible.windows.win_hostname:
            name: >-
              {{ windows_bootstrap_hostname | default(inventory_hostname)
              | string | trim }}

        - name: 'PROCESS | Restart To Apply The Computer Name'
          when: __windows_server_2025_hostname__.reboot_required | default(false) | bool
          ansible.windows.win_reboot:
            connect_timeout: 5
            msg: 'Restart requested by Ansible to apply the computer name'
            post_reboot_delay: 0
            pre_reboot_delay: 2
            reboot_timeout: 600

        # Proven from the machine, not from facts: the bootstrap gathers none it does not need,
        # and the name that matters is the one the host answers with after the restart.
        - name: 'END | Read The Computer Name Back'
          when: >-
            (windows_bootstrap_hostname | default(inventory_hostname)
            | string | trim | length) > 0
          register: '__windows_server_2025_hostname_now__'
          changed_when: false
          ansible.windows.win_shell: '$env:COMPUTERNAME'

        - name: 'END | Verify The Computer Name'
          when: >-
            (windows_bootstrap_hostname | default(inventory_hostname)
            | string | trim | length) > 0
          vars:
            __declared__: >-
              {{ windows_bootstrap_hostname | default(inventory_hostname)
              | string | trim | upper }}
            __actual__: >-
              {{ __windows_server_2025_hostname_now__.stdout | default('') | trim | upper }}
          ansible.builtin.assert:
            that: [ __actual__ == __declared__ ]
            fail_msg: >-
              The computer name is '{{ __actual__ }}' but the playbook declared
              '{{ __declared__ }}'.
            quiet: true
        #endregion --- [ Process: Set The Computer Name ] ------------------------------------- #

  #endregion --- [ Process: Converge The Host Identity ] -------------------------------------- #

#endregion --- [ Process: Bootstrap The Host ] ------------------------------------------------ #
