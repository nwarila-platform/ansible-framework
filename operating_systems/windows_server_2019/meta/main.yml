galaxy_info:

  role_name: 'windows_server_2019'
  namespace: 'ansible_framework'
  author: 'nwarila-platform'
  description: >-
    Minimum requirements for the ansible-framework suite on a new Windows Server 2019 host:
    serve PowerShell over the transport, require an elevated token, and set the computer name
    before any directory join.

  license: 'MIT'
  min_ansible_version: '2.21'

  platforms:
