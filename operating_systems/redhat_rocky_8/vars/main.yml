# =========================================================================================== #
# File: '{{ role_path }}/vars/main.yml'                                        | Version 1.0.0 #
# --- [ Description ] ----------------------------------------------------------------------- #
# Internal role constants - NOT intended to be overridden by users.                            #
#                                                                                             #
# These keys are the role's IDENTITY, consumed by the OS-validation assert in                  #
# 'tasks/bootstrap.yml'. They live here rather than in defaults/main.yml precisely BECAUSE     #
# role vars outrank play vars and group_vars: if a caller could override them, the OS check    #
# would become decorative and the role would happily run its RHEL-8 logic on anything.         #
# =========================================================================================== #

#region ------ [ Operating System Identity ] -------------------------------------------------- #

rhel8_bootstrap_os_family: 'RedHat'
rhel8_bootstrap_distributions:
  - 'RedHat'
  - 'Rocky'
rhel8_bootstrap_os_major: 8

#endregion --- [ Operating System Identity ] -------------------------------------------------- #
