# ============================================================================================= #
# File: 'applications/windows_disk_manager/tests/test.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
# Local cases for declared and host-reported platform selection.
# ============================================================================================= #
---

#region ------ [ Play: Detect AWS From Amazon EC2 ] ------------------------------------------- #

- name: 'TEST | Detect AWS From Amazon EC2'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_facts:
      system_vendor: 'Amazon EC2'
    config:
      disks: []
      platform: ''
    __expected_platform__: 'aws'
  tasks:

    - name: 'TEST | Accept An Empty Platform Declaration'
      ansible.builtin.include_role:
        name: 'windows_disk_manager'
        tasks_from: 'validate.yml'

    - name: 'TEST | Run The Windows Entry Point For Amazon EC2'
      register: '__entrypoint_result__'
      ansible.builtin.include_role:
        name: 'windows_disk_manager'
        public: true
        tasks_from: 'present_windows.yml'

    - name: 'TEST | Read The Effective Platform Dataflow'
      changed_when: false
      register: '__dataflow_metrics__'
      ansible.builtin.command:
        argv:
          - 'awk'
          - |-
            {
              if ($0 ~ /^[[:space:]]*#/) next
              if ($0 ~ /^    __platform__:.*__detected_platform__/) assignment++
              declaration += gsub(/config[.]platform/, "&")
              effective += gsub(/__platform__/, "&")
            }
            END { printf "%d:%d:%d", assignment, declaration, effective }
          - "{{ playbook_dir }}/../tasks/present_windows.yml"

    - name: 'TEST | Assert The Effective Platform Dataflow'
      ansible.builtin.assert:
        that:
          - (__dataflow_metrics__.stdout | default('')) == '1:1:6'
        fail_msg: >-
          The Windows entry point must derive its effective platform from detection and use only
          that effective value for every later platform decision.
        quiet: true

    - name: 'TEST | Assert Amazon EC2 Resolves To AWS'
      ansible.builtin.assert:
        that:
          - __entrypoint_result__ is succeeded
          - >-
            windows_disk_manager_vendor_platforms[ansible_facts.system_vendor]
            == __expected_platform__
        fail_msg: 'Amazon EC2 did not resolve to the expected platform.'
        quiet: true

#endregion --- [ Play: Detect AWS From Amazon EC2 ] ------------------------------------------- #

