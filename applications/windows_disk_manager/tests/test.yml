#region ------ [ Play: Normalize A Matching AWS Declaration ] --------------------------------- #

- name: 'TEST | Normalize A Matching AWS Declaration'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_facts:
      system_vendor: 'Amazon EC2'
    config:
      disks: []
      platform: 'AWS '
    __expected_platform__: 'aws'
  tasks:

    - name: 'TEST | Run The Windows Entry Point With A Matching Declaration'
      register: '__entrypoint_result__'
      ansible.builtin.include_role:
        name: 'windows_disk_manager'
        public: true
        tasks_from: 'present_windows.yml'

    - name: 'TEST | Assert The Matching Declaration Is Normalized'
      ansible.builtin.assert:
        that:
          - __entrypoint_result__ is succeeded
          - (config.platform | string | lower | trim) == __expected_platform__
          - >-
            windows_disk_manager_vendor_platforms[ansible_facts.system_vendor]
            == __expected_platform__
        fail_msg: 'The matching declaration did not normalize to the expected platform.'
        quiet: true

#endregion --- [ Play: Normalize A Matching AWS Declaration ] --------------------------------- #

#region ------ [ Play: Reject A Declaration That Conflicts With The Host ] -------------------- #

- name: 'TEST | Reject A Declaration That Conflicts With The Host'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_facts:
      system_vendor: 'VMware, Inc.'
    config:
      disks: []
      platform: 'aws'
  tasks:

    - name: 'TEST | Exercise The Conflicting Declaration'
      block:

        - name: 'TEST | Run The Windows Entry Point With A Conflicting Declaration'
          ansible.builtin.include_role:
            name: 'windows_disk_manager'
            tasks_from: 'present_windows.yml'

        - name: 'TEST | Fail On Unexpected Conflicting Declaration Success'
          ansible.builtin.fail:
            msg: 'The conflicting declaration case unexpectedly succeeded.'

      rescue:

        - name: 'TEST | Assert The Failure Names The Declaration And Reported Value'
          ansible.builtin.assert:
            that:
              - "'aws' in (ansible_failed_result.msg | default(''))"
              - "'VMware, Inc.' in (ansible_failed_result.msg | default(''))"
            fail_msg: 'The conflicting declaration failure did not name both values.'
            quiet: true

#endregion --- [ Play: Reject A Declaration That Conflicts With The Host ] -------------------- #

#region ------ [ Play: Reject QEMU On Windows ] ----------------------------------------------- #

- name: 'TEST | Reject QEMU On Windows'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_facts:
      system_vendor: 'QEMU'
    config:
      disks: []
      platform: ''
  tasks:

    - name: 'TEST | Exercise QEMU Detection On Windows'
      block:

        - name: 'TEST | Run The Windows Entry Point For QEMU'
          ansible.builtin.include_role:
            name: 'windows_disk_manager'
            tasks_from: 'present_windows.yml'

        - name: 'TEST | Fail On Unexpected QEMU Success'
          ansible.builtin.fail:
            msg: 'The QEMU case unexpectedly succeeded.'

      rescue:

        - name: 'TEST | Assert The Failure Names QEMU And Its Current Status'
          ansible.builtin.assert:
            that:
              - "'QEMU' in (ansible_failed_result.msg | default(''))"
              - "'Proxmox' in (ansible_failed_result.msg | default(''))"
            fail_msg: 'The QEMU failure did not explain its current Windows status.'
            quiet: true

#endregion --- [ Play: Reject QEMU On Windows ] ----------------------------------------------- #

