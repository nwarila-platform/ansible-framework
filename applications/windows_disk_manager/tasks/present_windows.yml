# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
# Windows / state=present provider. Receives merged configuration as 'config'. Resolves disk
# identities (literal unique_id, or on aws a declared `function` resolved via
# tasks/resolve_aws.yml + the Nitro serial==volume-id guarantee), prepares non-clustered disks,
# and treats disks already owned by Failover Clustering as converged and hands-off.
# ============================================================================================= #

#region ------ [ Process: Manage The Declared Disks On Windows ] ------------------------------ #

- name: 'PROCESS | Manage The Declared Disks On Windows'
  vars:
    # Derived here rather than latched with set_fact. FACT-01 keeps a role's working values out
    # of the host's fact namespace, where a set_fact outlives this play and can be read by the
    # next role to run. Both lists are pure functions of facts this file has already gathered, so
    # there is nothing to latch.
    #
    # Each reads a REGISTERED snapshot, not ansible_facts. That distinction is load-bearing: the
    # disk facts are deliberately re-read mid-block, after the online/writable fixup, and a block
    # var referring to ansible_facts would be evaluated lazily at each use and so would silently
    # mean the pre-fixup facts in one task and the post-fixup facts in the next. Reading the
    # register pins each list to the same snapshot the set_fact captured.
    #
    # The key is 'ansible_facts.ansible_disks', not 'ansible_facts.disks'. win_disk_facts returns
    # ansible_facts: { ansible_disks: [...] }, and ansible-core strips the 'ansible_' prefix when
    # it merges that into the ansible_facts dict -- which is why the tasks below read
    # ansible_facts.disks. A REGISTERED result keeps the raw key the module returned. Reading
    # .disks off the register yields undefined, the default([], true) turns it into an empty
    # list, and the role then provisions nothing while reporting success.

    # ONE declaration list in which every entry carries a unique_id -- literal entries verbatim,
    # function entries filled from the serial-matched disk's OBSERVED UniqueId (the same
    # storage-subsystem value every downstream Get-Disk/win_disk_facts comparison uses).
    # Everything below loops this, never config.disks, so the two identity modes converge here.
    # Built from the FIRST facts load, which is what the materialisation ran against.
    __declared_disks__: >-
      {%- set facts = (__windows_disk_manager_disk_facts__.ansible_facts.ansible_disks
        | default([], true)) -%}
      {%- set volumes = (__windows_disk_manager_attached_volumes__.volumes
        | default([], true)) -%}
      {%- set resolved = namespace(items=[]) -%}
      {%- for entry in config.disks -%}
        {%- set volume_id = volumes
          | selectattr('tags') | selectattr('tags.Function', 'defined')
          | selectattr('tags.Function', 'equalto', entry.function | default(''))
          | map(attribute='id') | first | default('') -%}
        {%- set expected_serial = volume_id | replace('-', '') -%}
        {%- set serial_matches = facts
          | selectattr('serial_number', 'defined')
          | selectattr('serial_number', 'match',
            '(?i)' ~ (expected_serial | default('\\A(?!x)x', true)))
          | list -%}
        {%- set resolved_id = entry.unique_id
          | default(serial_matches | map(attribute='unique_id') | first | default('')) -%}
        {%- set resolved.items = resolved.items
          + [entry | combine({'unique_id': resolved_id | trim})] -%}
      {%- endfor -%}
      {{ resolved.items }}

    # Physical-disk facts carry volumes below partitions, not at the disk's top level. Classify
    # each resolved disk from positively observed facts. Cluster ownership wins first because
    # attach identity is already proven above; all later disk state belongs to the cluster. Built
    # from the RELOADED facts, which is what the classification ran against.
    __resolved_disks__: >-
      {%- set facts = (__windows_disk_manager_disk_facts_reloaded__.ansible_facts.ansible_disks
        | default([], true)) -%}
      {%- set built = namespace(items=[]) -%}
      {%- for entry in __declared_disks__ -%}
        {%- set matches = facts
          | selectattr('unique_id', 'defined')
          | selectattr('unique_id', 'equalto', entry.unique_id)
          | list -%}
        {%- set matched = matches | first -%}
        {%- set enumerated = 'partitions' in matched -%} {%- set parts = namespace(items=[]) -%}
        {%- if enumerated -%}
        {%- for partition in matched.partitions | default([], true) -%}
        {%- if (partition.type | default('', true) | string) != 'Reserved' -%}
        {%- set parts.items = parts.items + [partition] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endif -%} {%- set vols = namespace(items=[]) -%}
        {%- set all_parts_have_volumes = namespace(value=true) -%}
        {%- for partition in parts.items -%}
        {%- if 'volumes' in partition -%}
        {%- set vols.items = vols.items + (partition.volumes | default([], true)) -%}
        {%- else -%}
        {%- set all_parts_have_volumes.value = false -%}
        {%- endif -%}
        {%- endfor -%} {%- set observed = namespace(items=[]) -%}
        {%- set all_vols_observed = namespace(value=true) -%} {%- for volume in vols.items -%}
        {%- if 'type' in volume and volume.type is not none -%}
        {%- set observed.items = observed.items + [volume] -%}
        {%- else -%}
        {%- set all_vols_observed.value = false -%}
        {%- endif -%}
        {%- endfor -%} {%- set fsvols = namespace(items=[]) -%}
        {%- set ours = namespace(value=false) -%} {%- for volume in observed.items -%}
        {%- if (volume.type | string | trim | length) > 0 -%}
        {%- set fsvols.items = fsvols.items + [volume] -%}
        {%- if (volume.type | string | upper) == 'NTFS'
        and (volume.label | default('', true) | string | lower)
        == (entry.label | string | lower) -%}
        {%- set ours.value = true -%}
        {%- endif -%}
        {%- endif -%}
        {%- endfor -%} {%- set classification = namespace(value='foreign') -%}
        {%- if matched.clustered | default(false) | bool -%}
        {%- set classification.value = 'clustered' -%}
        {%- elif ours.value -%}
        {%- set classification.value = 'ours' -%}
        {%- elif (matched.partition_style | default('', true) | string | upper)
        == 'RAW' -%}
        {%- set classification.value = 'blank' -%}
        {%- elif (matched.partition_style | default('', true) | string | upper)
        == 'GPT'
        and enumerated
        and (fsvols.items | length) == 0
        and (
        (parts.items | length) == 0
        or (
        all_parts_have_volumes.value
        and all_vols_observed.value
        and (observed.items | length) > 0
        )
        ) -%}
        {%- set classification.value = 'unfmtd' -%}
        {%- endif -%}
        {%- set built.items = built.items + [{
          'disk': entry,
          'matched_disk': matched,
          'classification': classification.value,
          'drive_letter': (entry.drive_letter | regex_search('^[A-Za-z]') | upper)
        }] -%}
      {%- endfor -%}
      {{ built.items }}
  block:

    # The role pulls the facts it needs itself (plays run gather_facts: false): the vendor
    # assertion below reads ansible_facts.system_vendor, which the loader's OS-facts pass does
    # not carry — and the Windows setup module's named subsets do not map it either (proven live:
    # the 'hardware' subset still left it '<missing>'), so gather the full set once, guarded.
    - name: 'BEGIN | Load Facts For The Vendor Assertion'
      when: ansible_facts.system_vendor is not defined
      ansible.windows.setup:

    - name: 'BEGIN | Assert Detected Vendor Matches Declared Platform'
      vars:
        __platform__: "{{ config.platform | string | lower | trim }}"
        __expected_vendors__:
          vmware: 'VMware, Inc.'
          aws: 'Amazon EC2'
      ansible.builtin.assert:
        that:
          - (ansible_facts.system_vendor | default('')) == __expected_vendors__[__platform__]
        fail_msg: >-
          windows_disk_manager platform '{{ __platform__ }}' expects system vendor
          '{{ __expected_vendors__[__platform__] }}', but detected
          '{{ ansible_facts.system_vendor | default('<missing>') }}'.
        quiet: true

    # Identity-mode guard, before any facts or mutation: a disk with NO resolvable identity must
    # fail here, so an absent ID can never become an empty Get-Disk match. On non-aws platforms
    # the only identity is a literal unique_id (mirrors linux_disk_manager: the non-AWS path
    # fails loudly without one); on aws a `function` declaration is resolved by the include
    # below. The both-declared and duplicate cases are already rejected at loader
    # INIT by tasks/validate.yml.
    - name: 'BEGIN | Assert Every Disk Declares A Resolvable Identity'
      when: (config.disks | length) > 0
      loop: "{{ config.disks }}"
      loop_control:
        loop_var: '__disk__'
        label: "{{ __disk__.unique_id | default(__disk__.function | default('<missing>')) }}"
      vars:
        __is_aws__: "{{ (config.platform | string | lower | trim) == 'aws' }}"
        __has_unique_id__: >-
          {{ __disk__.unique_id is defined
          and (__disk__.unique_id | string | trim | length) > 0 }}
        __has_function__: >-
          {{ __disk__.function is defined
          and (__disk__.function | string | trim | length) > 0 }}
      ansible.builtin.assert:
        that:
          - (__has_unique_id__ | bool) or ((__is_aws__ | bool) and (__has_function__ | bool))
        fail_msg: >-
          windows_disk_manager.disks entry '{{ __disk__.unique_id | default(__disk__.function |
          default('<missing>')) }}' declares no resolvable identity. Platform '{{ config.platform
          }}' requires a literal `unique_id` {{ '(or an EBS `function` tag value)' if (__is_aws__
          | bool) else '(`function` is AWS-only)' }}.
        quiet: true

    # AWS `function` resolution: one controller-side describe for the whole host maps each
    # declared Function tag to its attached volume-id (see resolve_aws.yml). The volume-id is
    # matched to a physical disk AFTER facts load, via the Nitro serial==volume-id guarantee.
    - name: 'BEGIN | Resolve Declared Function Tags To Attached Volumes'
      when: >-
        (config.platform | string | lower | trim) == 'aws'
        and (config.disks | selectattr('unique_id', 'undefined') | list | length) > 0
      ansible.builtin.include_tasks: 'resolve_aws.yml'

    - name: 'BEGIN | Load Disk, Partition And Volume Facts'
      when: (config.disks | length) > 0
      register: '__windows_disk_manager_disk_facts__'

      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    # NEGATIVE PROOF, per function-declared entry: exactly one physical disk may carry the
    # resolved volume's serial (Nitro: NVMe serial == volume-id without its hyphen, sometimes
    # with a padded suffix — hence the anchored prefix match). Runs before materialization so a
    # zero or multiple match names the function and the observed serials, not a
    # downstream empty-unique_id symptom.
    - name: 'BEGIN | Assert Exactly One Attached Disk Serial Per Resolved Function'
      when: (config.platform | string | lower | trim) == 'aws'
      loop: "{{ config.disks | selectattr('unique_id', 'undefined') | list }}"
      loop_control:
        loop_var: '__disk__'
        label: "{{ __disk__.function }}"
      vars:
        __volume_id__: >-
          {{ (__windows_disk_manager_attached_volumes__.volumes | selectattr('tags')
          | selectattr('tags.Function', 'defined')
          | selectattr('tags.Function', 'equalto', __disk__.function)
          | map(attribute='id') | first) }}
        __expected_serial__: "{{ __volume_id__ | replace('-', '') }}"
        __serial_matches__: >-
          {{ ansible_facts.disks
          | selectattr('serial_number', 'defined')
          | selectattr('serial_number', 'match', '(?i)' ~ __expected_serial__)
          | list }}
      ansible.builtin.assert:
        that:
          - __serial_matches__ | length == 1
        fail_msg: >-
          Expected exactly one attached disk whose serial starts with
          '{{ __expected_serial__ }}' (volume {{ __volume_id__ }},
          Function={{ __disk__.function }}), found {{ __serial_matches__ | length }}. Observed
          disks: {% for attached in ansible_facts.disks %}number={{ attached.number
          | default('unknown') }}, serial={{ attached.serial_number | default('unknown')
          }}{%- if not loop.last %}; {% endif %}{% endfor %}.
        quiet: true

    - name: 'BEGIN | Assert Declared Disks Are Attached'
      when: (config.disks | length) > 0
      loop: "{{ __declared_disks__ | default([]) }}"
      loop_control:
        loop_var: '__disk__'
        label: "{{ __disk__.unique_id }}"
      vars:
        __matches__: >-
          {{ ansible_facts.disks
          | selectattr('unique_id', 'defined')
          | selectattr('unique_id', 'equalto', __disk__.unique_id)
          | list }}
      ansible.builtin.assert:
        that:
          - __matches__ | length == 1
        fail_msg: >-
          Expected exactly one attached disk matching unique_id '{{ __disk__.unique_id }}', but
          found {{ __matches__ | length }}. Attached disks:
          {% for attached in ansible_facts.disks %}
          number={{ attached.number | default('unknown') }},
          unique_id={{ attached.unique_id | default('unknown') }}{%- if not loop.last %};
          {% endif %}
          {% endfor %}
        quiet: true

    # An offline disk may expose no partitions. Clear read-only first, then offline, and emit the
    # changed sentinel only after every requested transition has completed successfully. Cluster
    # ownership completes this role's preparation contract; its disk state is hands-off.
    - name: 'BEGIN | Bring Declared Disks Online And Writable'
      when: (config.disks | length) > 0
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $changed = $false
        foreach ($id in ($env:DISK_IDS -split ';' | Where-Object { $_ })) {
            $disk = Get-Disk -ErrorAction Stop | Where-Object { $_.UniqueId -eq $id }
            if ($disk.IsClustered) {
                continue
            }
            if ($disk.IsReadOnly) {
                Set-Disk -Number $disk.Number -IsReadOnly $false -ErrorAction Stop
                $changed = $true
            }
            if ($disk.IsOffline) {
                Set-Disk -Number $disk.Number -IsOffline $false -ErrorAction Stop
                $changed = $true
            }
        }
        if ($changed) {
            Write-Output 'changed'
        } else {
            Write-Output 'nochange'
        }
      environment:
        DISK_IDS: >-
          {{ __declared_disks__ | default([]) | map(attribute='unique_id') | join(';') }}
      register: '__windows_disk_manager_online_fixup__'
      changed_when: (__windows_disk_manager_online_fixup__.stdout | trim) == 'changed'

    - name: 'BEGIN | Re-load Disk Facts After Online/Writable Fixup'
      when: (config.disks | length) > 0
      register: '__windows_disk_manager_disk_facts_reloaded__'

      community.windows.win_disk_facts:
        filter:
          - 'physical_disk'
          - 'partitions'
          - 'volumes'

    #region ------ [ Process: Classify Disk State And Guard Against Foreign Layouts ] --------- #

    # A failure in this read-only loop stops the play before any provisioning task is entered, so
    # one foreign declared disk refuses provisioning for the entire declaration set.
    - name: 'BEGIN | Assert No Foreign Disk Layout Before Provisioning'
      loop: "{{ __resolved_disks__ | default([]) }}"
      loop_control:
        loop_var: '__managed_disk__'
        label: "{{ __managed_disk__.disk.unique_id }}"
      ansible.builtin.assert:
        that:
          - __managed_disk__.classification != 'foreign'
        fail_msg: >-
          Refusing to provision declared disk unique_id '{{ __managed_disk__.disk.unique_id }}'
          with label '{{ __managed_disk__.disk.label }}': its observed layout classified as
          'foreign'. Observed on-disk signature: partition_style={{
          __managed_disk__.matched_disk.partition_style | default('<missing>', true) | to_json
          }}, partitions={% if 'partitions' in __managed_disk__.matched_disk %}{{
          __managed_disk__.matched_disk.partitions | to_json }}{% else %}<not enumerated>{% endif
          %}. Verify that this declaration's unique_id identifies the intended disk. Point it
          only at a RAW disk, a positively recognized unformatted GPT disk, or a disk already
          carrying an NTFS volume labeled '{{ __managed_disk__.disk.label }}'. If this foreign
          layout is on the intended disk, preserve any required data before clearing it and
          re-running.
        quiet: true

    #endregion --- [ Process: Classify Disk State And Guard Against Foreign Layouts ] --------- #

    #region ------ [ Process: Move Kept Disks To Their Declared Drive Letters ] --------------- #

    # A blank disk's declared letter can sit on a kept disk after a reattach, so move kept disks
    # before the partition and format modules can act through that letter. Remove every wrong
    # letter before assigning targets so swaps and rotations converge without collisions.
    - name: 'PROCESS | Move Each Kept Disk To Its Declared Drive Letter'
      changed_when: (__windows_disk_manager_drive_letters__.stdout | trim) == 'changed'
      environment:
        DISK_IDS: >-
          {{ __kept_disks__ | map(attribute='disk.unique_id') | join(';') }}
        DISK_LETTERS: >-
          {{ __kept_disks__ | map(attribute='drive_letter') | join(';') }}
      register: '__windows_disk_manager_drive_letters__'
      vars:
        __kept_disks__: >-
          {{ __resolved_disks__ | default([])
          | selectattr('classification', 'equalto', 'ours') | list }}
      when: (__kept_disks__ | length) > 0

      ansible.windows.win_shell:
        cmd: |
          $ErrorActionPreference = 'Stop'
          # A single pipeline result unwraps to a scalar string, whose index is a character.
          $ids = @($env:DISK_IDS -split ';' | Where-Object { $_ })
          $letters = $env:DISK_LETTERS -split ';'
          $items = @()
          for ($i = 0; $i -lt $ids.Count; $i++) {
              $wantId = $ids[$i]
              $disk = Get-Disk -ErrorAction Stop | Where-Object { $_.UniqueId -eq $wantId }
              if (-not $disk) {
                  throw ('No disk found with unique id ' + $wantId)
              }
              $part = Get-Partition -DiskNumber $disk.Number -ErrorAction Stop |
                  Where-Object { $_.Type -ne 'Reserved' -and $_.Size -gt 1GB } |
                  Sort-Object Size -Descending | Select-Object -First 1
              if (-not $part) {
                  throw ('No data partition found on disk ' + $wantId)
              }
              $currentLetter = if ([bool]$part.DriveLetter) {
                  [string]$part.DriveLetter
              } else {
                  $null
              }
              $items += [pscustomobject]@{
                  Disk = $disk.Number
                  Part = $part.PartitionNumber
                  Cur = $currentLetter
                  Target = $letters[$i]
              }
          }
          $changed = $false
          foreach ($it in ($items | Where-Object { $_.Cur -and $_.Cur -ne $_.Target })) {
              Remove-PartitionAccessPath -DiskNumber $it.Disk -PartitionNumber $it.Part `
                  -AccessPath ($it.Cur + ':' + [char]92) -ErrorAction Stop
              if (-not $changed) {
                  Write-Output 'changed'
                  $changed = $true
              }
          }
          foreach ($it in ($items | Where-Object { $_.Cur -ne $_.Target })) {
              Set-Partition -DiskNumber $it.Disk -PartitionNumber $it.Part `
                  -NewDriveLetter $it.Target -ErrorAction Stop
              if (-not $changed) {
                  Write-Output 'changed'
                  $changed = $true
              }
          }
          if (-not $changed) {
              Write-Output 'nochange'
          }
        no_profile: false

    #endregion --- [ Process: Move Kept Disks To Their Declared Drive Letters ] --------------- #

    # The clustered classification is already converged and falls through this entire pipeline.
    - name: 'PROCESS | Initialize The Declared Disk As GPT Online And Writable'
      when: __managed_disk__.classification in ['blank', 'unfmtd']
      loop: "{{ __resolved_disks__ | default([]) }}"
      loop_control:
        loop_var: '__managed_disk__'
        label: "{{ __managed_disk__.disk.unique_id }}"
      community.windows.win_initialize_disk:
        uniqueid: "{{ __managed_disk__.disk.unique_id }}"
        style: 'gpt'
        online: true
        force: false

    # On this role's GPT layout Windows creates the reserved partition first, so its data
    # partition is 2. The module looks it up by disk and partition number and, if absent, creates
    # it only on the declared disk; it never locates a partition by letter. A taken letter makes
    # Windows refuse the partition before anything is formatted.
    - name: 'PROCESS | Create The Full Declared Disk Partition'
      when: __managed_disk__.classification in ['blank', 'unfmtd']
      loop: "{{ __resolved_disks__ | default([]) }}"
      loop_control:
        loop_var: '__managed_disk__'
        label: "{{ __managed_disk__.disk.unique_id }}"
      community.windows.win_partition:
        disk_number: "{{ __managed_disk__.matched_disk.number }}"
        drive_letter: "{{ __managed_disk__.drive_letter }}"
        gpt_type: 'basic_data'
        partition_number: 2
        partition_size: -1
        state: 'present'

    - name: 'PROCESS | Format The Declared Disk Volume As NTFS'
      when: __managed_disk__.classification in ['blank', 'unfmtd']
      loop: "{{ __resolved_disks__ | default([]) }}"
      loop_control:
        loop_var: '__managed_disk__'
        label: "{{ __managed_disk__.disk.unique_id }}"
      community.windows.win_format:
        drive_letter: "{{ __managed_disk__.drive_letter }}"
        file_system: 'ntfs'
        new_label: "{{ __managed_disk__.disk.label }}"
        allocation_unit_size: "{{ __managed_disk__.disk.allocation_unit | default(4096) }}"
        full: false
        force: false

#endregion --- [ Process: Manage The Declared Disks On Windows ] ------------------------------ #
