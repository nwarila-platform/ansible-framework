# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_redhat.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# RHEL 8 / state=present - installs the Wazuh agent from a standalone RPM in S3 and enrolls
# it to the Wazuh manager.
#
# Agent vs. central-stack source: the central indexer/server/dashboard roles consume the
# wazuh-offline.tar.gz bundle. The agent role does NOT; it downloads exactly one file
# (`s3://<bucket>/applications/wazuh-agent/wazuh-agent-<ver>-1.x86_64.rpm`) and dnf-installs
# it. The bundle is unnecessary on endpoint hosts and decoupling the agent from it lets the
# bundle and the agent ship on independent cadences.
#
# This role is for endpoint hosts only. Do not install wazuh-agent on a host that also runs
# wazuh-manager; the manager owns /var/ossec and provides local monitoring behavior.
# =========================================================================================== #

#region ------ [ Script ] -------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (present_redhat - wazuh_agent)'
  vars:
    __manager_inventory_host__: "{{ groups['wazuh_servers'][0] | default('') }}"
    # Self-correcting AWS fallback: prefer the dynamic inventory's private_ip_address (the
    # manager's real, routable IP) over ansible_host, which aws_ec2.yml deliberately sets to
    # the EC2 instance-id for SSH-over-SSM (same treatment as wazuh_server's __endpoint_host__,
    # see group_vars/aws/wazuh_servers.yml). On Proxmox's static inventory private_ip_address is
    # never set, so this falls through to ansible_host, which IS the manager's real IP there --
    # the same expression is therefore correct on both platforms with no per-inventory override
    # required. The BEGIN guard below catches the residual case (an explicit
    # wazuh_agent.manager.host override that is itself an instance-id).
    __manager_host__: >-
      {{
        (config.manager.host | default('') | string | trim)
        if (config.manager.host | default('') | string | trim | length) > 0
        else (hostvars[__manager_inventory_host__].private_ip_address
              | default(hostvars[__manager_inventory_host__].ansible_host, true)
              | default(__manager_inventory_host__))
      }}
    __agent_name__: >-
      {{
        (config.agent_name | default('') | string | trim)
        if (config.agent_name | default('') | string | trim | length) > 0
        else inventory_hostname
      }}
    # The IPv4 address passed to `agent-auth -I`. Wazuh documents this as an IP address,
    # not an arbitrary host label, so the BEGIN stage rejects DNS names before enrollment.
    __agent_ip__: >-
      {{
        (config.agent_ip | default('') | string | trim)
        if (config.agent_ip | default('') | string | trim | length) > 0
        else (ansible_host | default('') | string | trim)
      }}
    __agent_rpm_basename__: "{{ config.s3.agent_rpm_key | basename }}"
    __agent_rpm_path__: "{{ __temp_dir__.path }}/{{ __agent_rpm_basename__ }}"
  become: true
  block:

    #region ------ [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Initialization: Input Guards ] ------------------------------------------ #

    - name: 'BEGIN | Assert Agent Role Is Not Running On A Manager Host'
      ansible.builtin.assert:
        that:
          - inventory_hostname not in (groups['wazuh_servers'] | default([]))
        fail_msg: >-
          Refusing to install the standalone wazuh-agent package on '{{ inventory_hostname }}'
          because this host is also in the wazuh_servers group. Use a separate endpoint host
          for standalone agent validation.
        quiet: true

    - name: 'BEGIN | Assert Manager Endpoint Is Known'
      ansible.builtin.assert:
        that:
          - __manager_host__ | string | trim | length > 0
        fail_msg: >-
          No Wazuh manager host could be resolved. Set wazuh_agent.manager.host or define
          at least one host in the wazuh_servers inventory group.
        quiet: true

    # SSM inventory IDs are not agent-routable.
    - name: 'BEGIN | Assert Manager Endpoint Is Not An EC2 Instance-ID'
      ansible.builtin.assert:
        that:
          - not (__manager_host__ is match('^i-[0-9a-fA-F]{8}([0-9a-fA-F]{9})?$'))
        fail_msg: >-
          wazuh_agent.manager.host resolved to '{{ __manager_host__ }}', which looks like an
          EC2 instance-id, not a routable address. This happens when ansible_host is an
          instance-id (aws_ec2.yml, for SSH-over-SSM) and no private_ip_address hostvar or
          explicit wazuh_agent.manager.host override is available for that host. Set
          wazuh_agent.manager.host to the manager's real IP or DNS name.
        quiet: true

    # s3.bucket / s3.agent_rpm_key / s3.agent_rpm_sha256 shape is now validated once, at loader
    # INIT, by tasks/validate.yml (CC5) -- by the time this BEGIN stage runs the merged config
    # has already passed that check.

    - name: 'BEGIN | Assert Agent Enrollment IP Is An IPv4 Address'
      ansible.builtin.assert:
        that:
          - __agent_ip__ is match('^((25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$')
        fail_msg: >-
          agent-auth -I requires an endpoint IPv4 address. Set wazuh_agent.agent_ip,
          or set ansible_host to the endpoint's IPv4 address; DNS names are not safe
          for the manager's anti-impersonation binding.
        quiet: true

    # Cross-host collision check: if two endpoints across the Linux (wazuh_agents) and
    # Windows (wazuh_agents_windows) groups end up resolving to the same effective agent_name
    # (both defaulted to a duplicated inventory_hostname, or an overlay/override sets
    # wazuh_agent.agent_name identically for more than one host), the second enrollment
    # overwrites the first in the manager's shared client.keys -- Wazuh keys it by name only,
    # not by OS. Catch it here instead of silently re-keying one of the agents.
    #
    # Reads the LOADER-MERGED config (wazuh_agent_running), not the raw wazuh_agent override
    # dict: an agent_name set at the OVERLAY layer (vars/redhat_<env>.yml / vars/windows_<env>.yml)
    # is invisible to a raw-dict read but fully present in the merged config, and enrollment
    # itself (__agent_name__ above) already resolves from merged config -- the guard has to
    # match what enrollment actually does or it can wrongly call a real collision "unique".
    #
    # Windows hosts persist the merged config as wazuh_agent_running. The `config` fallback is
    # retained only as a defensive read for legacy hostvars; it is not written by main_windows.yml.
    - name: 'BEGIN | Assert Agent Name Is Unique Across wazuh_agents + wazuh_agents_windows'
      run_once: true
      vars:
        __effective_names__: >-
          {%- set out = [] -%}
          {%- for h in ((groups['wazuh_agents'] | default([])) + (groups['wazuh_agents_windows'] | default([]))) -%}
            {%- set merged = hostvars[h].wazuh_agent_running | default(hostvars[h].config | default({}, true), true) -%}
            {%- set explicit = merged.agent_name | default('') | string | trim -%}
            {%- set _ = out.append(explicit if explicit | length > 0 else h) -%}
          {%- endfor -%}
          {{ out }}
      ansible.builtin.assert:
        that:
          - (__effective_names__ | length) == (__effective_names__ | unique | length)
        fail_msg: >-
          Two or more hosts across `wazuh_agents`/`wazuh_agents_windows` resolve to the same
          wazuh_agent.agent_name. Each endpoint must produce a unique agent name because the
          manager keys client.keys by name. Effective names: {{ __effective_names__ }}.
        quiet: true

    #endregion --- [ Initialization: Input Guards ] ------------------------------------------ #

    #endregion --- [ Initialization ] -------------------------------------------------------- #

    #region ------ [ Main ] ------------------------------------------------------------------ #

    #region ------ [ Main: Host Preparation ] ------------------------------------------------ #

    - name: 'PROCESS | Install Side-Deps'
      when: (config.side_deps | default([]) | length) > 0
      ansible.builtin.dnf:
        name: "{{ config.side_deps }}"
        state: 'present'
        disablerepo: 'epel'

    #endregion --- [ Main: Host Preparation ] ------------------------------------------------ #

    #region ------ [ Main: S3 Staging ] ------------------------------------------------------ #

    # AWS creds and region are passed as module-args (access_key/secret_key/region)
    # to amazon.aws.s3_object so they never enter the target's shell environment; this
    # prevents sudo/audit/Wazuh-alert logs from capturing them.
    #
    # Task-level `ansible_python_interpreter` override forces this task onto the
    # bootstrap venv (Python 3.12) because the current amazon.aws collection's boto3
    # floor is above what RHEL 8 platform-python (3.6) can install. Every other task
    # in the role uses platform-python — see ansible.cfg's interpreter_python note.
    - name: 'S3 | Fetch Wazuh Agent RPM From S3 To Target Temp Dir'
      no_log: true
      changed_when: false
      vars:
        ansible_python_interpreter: '/opt/ansible/venv/bin/python'
      amazon.aws.s3_object:
        bucket: "{{ config.s3.bucket }}"
        region: "{{ AWS_DEFAULT_REGION | default(config.s3.region | default(omit), true) }}"
        access_key: "{{ AWS_ACCESS_KEY_ID | default(omit, true) }}"
        secret_key: "{{ AWS_SECRET_ACCESS_KEY | default(omit, true) }}"
        session_token: "{{ AWS_SESSION_TOKEN | default(omit, true) }}"
        object: "{{ config.s3.agent_rpm_key }}"
        dest: "{{ __agent_rpm_path__ }}"
        mode: 'get'
        overwrite: 'different'
        # Least-privilege deploy identity: s3:GetObject on the pinned key only. s3_object's
        # default HeadBucket existence precheck needs unconditional s3:ListBucket and 403s
        # under our prefix-scoped grant — skip it (this flag exists for GetObject-only identities)
        # rather than widen IAM to list the whole shared artifact bucket.
        ignore_nonexistent_bucket: true

    # Trust-on-first-use: the SHA256 in the per-env overlay is the operator's
    # PR-reviewed known-good hash. Mismatch = S3 object was tampered with, so abort install.
    - name: 'S3 | Verify Downloaded Agent RPM Matches Trusted SHA256'
      register: '__agent_rpm_verify__'
      failed_when: (__agent_rpm_verify__.stat.checksum | lower) != (config.s3.agent_rpm_sha256 | lower)
      ansible.builtin.stat:
        path: "{{ __agent_rpm_path__ }}"
        checksum_algorithm: 'sha256'

    #endregion --- [ Main: S3 Staging ] ------------------------------------------------------ #

    #region ------ [ Main: Package Installation ] ------------------------------------------- #

    - name: 'PROCESS | Install Wazuh RPM Signing Key'
      ansible.builtin.copy:
        src: 'GPG-KEY-WAZUH'
        dest: '/etc/pki/rpm-gpg/GPG-KEY-WAZUH'
        owner: 'root'
        group: 'root'
        mode: '0644'

    - name: 'PROCESS | Import Wazuh GPG Signing Key Into rpmdb'
      ansible.builtin.rpm_key:
        key: '/etc/pki/rpm-gpg/GPG-KEY-WAZUH'
        state: 'present'

    - name: 'PROCESS | Install wazuh-agent RPM'
      environment:
        WAZUH_MANAGER: "{{ __manager_host__ }}"
        WAZUH_AGENT_NAME: "{{ __agent_name__ }}"
      ansible.builtin.dnf:
        name: "{{ __agent_rpm_path__ }}"
        state: 'present'
        allow_downgrade: true
        disable_gpg_check: false

    - name: 'PROCESS | Lock Wazuh Service Accounts (Non-Interactive Per Nessus Allowlist)'
      loop: "{{ config.stig.local_users }}"
      ansible.builtin.user:
        name: "{{ item }}"
        shell: '/sbin/nologin'
        password_lock: true

    #endregion --- [ Main: Package Installation ] ------------------------------------------- #

    #region ------ [ Main: Agent Configuration ] -------------------------------------------- #

    - name: 'PROCESS | Record Whether wazuh-agent Was Running Before Config Ownership'
      register: '__agent_svc_pre__'
      changed_when: false
      ansible.builtin.systemd:
        name: 'wazuh-agent'

    # JUSTIFIED R3 set_fact exception: a handler consumes this latch, and handlers cannot see
    # block/task vars.
    - name: 'PROCESS | Latch Pre-Config Service State For The Restart Handler'
      ansible.builtin.set_fact:
        wazuh_agent_svc_was_running: >-
          {{ (__agent_svc_pre__.status.ActiveState | default('inactive')) == 'active' }}

    # Scope this edit to the first <client><server> block. Other single-line tags, such
    # as <client><enrollment><port>1515</port>, must not be touched during config drift.
    # Reconnect runway invariant: 12 * 10s = 120s exceeds remoted's 60s connection-overtake
    # refusal plus its <=10s key-reload lag. Verified at wazuh/wazuh v4.14.5:
    # src/client-agent/start_agent.c:131-183, src/remoted/secure.c:488-497,647-663; the knobs are
    # parsed as <server> children by src/config/client-config.c:262-280.
    - name: 'BEGIN | Read Agent ossec.conf For Manager Block Ownership Guard'
      register: '__ossec_conf_pre__'
      ansible.builtin.slurp:
        src: '/var/ossec/etc/ossec.conf'

    - name: 'BEGIN | Assert Exactly One <client><server> Block In ossec.conf'
      vars:
        __server_block_count__: "{{ (__ossec_conf_pre__.content | b64decode) | regex_findall('(?ms)^\\s*<client>\\s*<server>.*?</server>') | length }}"
      ansible.builtin.assert:
        that:
          - __server_block_count__ | int == 1
        fail_msg: >-
          Expected exactly one <client><server>...</server> block in /var/ossec/etc/ossec.conf so
          ownership replaces an unambiguous location, but found {{ __server_block_count__ }}.
        quiet: true

    - name: 'PROCESS | Configure Agent Manager Server Block'
      notify: 'wazuh-agent-config-changed'
      ansible.builtin.replace:
        path: '/var/ossec/etc/ossec.conf'
        regexp: '(?ms)^(\s*<client>\s*)<server>.*?</server>\s*'
        replace: |
          \1<server>
                <address>{{ __manager_host__ }}</address>
                <port>{{ config.manager.port }}</port>
                <protocol>{{ config.manager.protocol }}</protocol>
                <max_retries>12</max_retries>
                <retry_interval>10</retry_interval>
              </server>

    # blockinfile's per-line insertbefore search silently lands on the LAST </syscheck> match.
    # Guard the first insertion against duplicate or commented-out vendor stanzas; once markers
    # exist, blockinfile locates them directly and ignores insertbefore.
    - name: 'BEGIN | Read Agent ossec.conf For FIM Insertion-Point Guard'
      register: '__ossec_conf__'
      ansible.builtin.slurp:
        src: '/var/ossec/etc/ossec.conf'

    - name: 'BEGIN | Assert Exactly One </syscheck> Closing Tag In ossec.conf'
      vars:
        __syscheck_close_count__: "{{ (__ossec_conf__.content | b64decode) | regex_findall('(?m)^\\s*</syscheck>') | length }}"
      ansible.builtin.assert:
        that:
          - __syscheck_close_count__ | int == 1
        fail_msg: >-
          Expected exactly one </syscheck> closing tag in /var/ossec/etc/ossec.conf so the FIM
          realtime-paths blockinfile inserts at an unambiguous location, but found
          {{ __syscheck_close_count__ }}. Investigate the installed ossec.conf for a duplicate
          or commented-out <syscheck> stanza before continuing.
        quiet: true

    - name: 'PROCESS | Ensure Real-Time Watched Directories Exist'
      loop: "{{ config.fim.realtime_paths | default([]) }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: 'directory'

    # No `when:` gate -- this must run even when realtime_paths is empty so an emptied list
    # actually removes the managed block. ansible.builtin.blockinfile treats a missing/empty
    # `block` as state=absent ("If it is missing or an empty string, the block will be removed
    # as if state were specified to absent" -- module docs, confirmed against source), so
    # gating this task on length>0 made the managed region ADD-ONLY: emptying
    # wazuh_agent.fim.realtime_paths would silently strand the old block (and its live FIM
    # watches) forever instead of the role retracting what it added. The `|-` (strip) chomping
    # indicator matters here: with the default `|` (clip) indicator the rendered block for an
    # empty list is a single leftover newline, not a true empty string, and blockinfile treats
    # that as non-empty content (verified empirically) -- the managed markers would survive
    # with nothing between them instead of being removed.
    - name: 'PROCESS | Configure Agent Realtime FIM Paths'
      notify: 'wazuh-agent-config-changed'
      ansible.builtin.blockinfile:
        path: '/var/ossec/etc/ossec.conf'
        marker: '    <!-- {mark} ANSIBLE MANAGED WAZUH AGENT REALTIME FIM -->'
        insertbefore: '^\s*</syscheck>'
        block: |-
          {% for path in config.fim.realtime_paths | default([]) %}
              <directories realtime="yes" check_all="yes">{{ path }}</directories>
          {% endfor %}

    #endregion --- [ Main: Agent Configuration ] -------------------------------------------- #

    #region ------ [ Main: Enrollment ] ------------------------------------------------------ #

    - name: 'PROCESS | Check Agent Enrollment Key'
      register: '__client_keys__'
      ansible.builtin.stat:
        path: '/var/ossec/etc/client.keys'

    # agent-auth -I <ip> binds the client.keys entry to this endpoint's IP so the
    # manager's anti-impersonation check rejects a re-enrollment of the same name
    # from a different address.
    #
    # The enrollment password is NEVER passed as `-P <pass>` on the argv: on a STIG host
    # auditd's execve rule (and ps/proc, which Wazuh forwards) would capture the plaintext
    # into wazuh-alerts-*. Instead it is staged to /var/ossec/etc/authd.pass, which
    # agent-auth reads automatically when -P is absent (per the agent-auth reference:
    # "-P: use the specified password instead of searching for it at authd.pass"). The
    # `always` block removes the file afterward so no shared enrollment secret is stranded
    # on the endpoint, whether enrollment succeeded or failed.
    - name: 'PROCESS | Enroll Agent With Manager (authd.pass, no argv secret)'
      when: not (__client_keys__.stat.exists | default(false)) or (__client_keys__.stat.size | default(0) | int) == 0
      block:

        - name: 'PROCESS | Stage Enrollment Password File (authd.pass)'
          when: (config.manager.enrollment_password | default('') | length) > 0
          no_log: true
          ansible.builtin.copy:
            dest: '/var/ossec/etc/authd.pass'
            content: "{{ config.manager.enrollment_password }}"
            owner: 'root'
            group: 'wazuh'
            mode: '0640'

        - name: 'PROCESS | Run agent-auth (reads authd.pass; no -P on argv)'
          changed_when: true
          ansible.builtin.command:
            argv:
              - '/var/ossec/bin/agent-auth'
              - '-m'
              - "{{ __manager_host__ }}"
              - '-p'
              - "{{ config.manager.enrollment_port | string }}"
              - '-A'
              - "{{ __agent_name__ }}"
              - '-I'
              - "{{ __agent_ip__ }}"

      always:

        - name: 'PROCESS | Remove Staged authd.pass (no stranded enrollment secret)'
          when: (config.manager.enrollment_password | default('') | length) > 0
          ansible.builtin.file:
            path: '/var/ossec/etc/authd.pass'
            state: 'absent'

    - name: 'PROCESS | Remove Any Stranded authd.pass (Cross-Run Cleanup, Unconditional)'
      ansible.builtin.file:
        path: '/var/ossec/etc/authd.pass'
        state: 'absent'

    #endregion --- [ Main: Enrollment ] ------------------------------------------------------ #

    #endregion --- [ Main ] ------------------------------------------------------------------ #

    #region ------ [ Validation ] ------------------------------------------------------------ #

    - name: 'END | Enable And Start Agent Service'
      loop: "{{ config.services }}"
      loop_control:
        label: '{{ item.name }}'
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: "{{ item.enabled }}"
        state: "{{ item.state }}"

    - name: 'END | Flush Handlers'
      ansible.builtin.meta: 'flush_handlers'

    # Retry while the service is briefly in "activating" — the wazuh-agent-config-changed
    # handler (handlers/main.yml) issues `systemctl restart`, not a reload, so the transient
    # state observed right after a fresh install/restart is systemd's normal start-up state,
    # not "reloading". Without the retry this races with restart completion and fails on that
    # transient state.
    - name: 'END | Verify Agent Service Is Active'
      register: '__agent_active__'
      changed_when: false
      retries: 15
      delay: 2
      until: (__agent_active__.status.ActiveState | default('')) == 'active'
      ansible.builtin.systemd:
        name: 'wazuh-agent'

    # Service-up does not prove manager connectivity; the agent's own state file is the contract.
    # Linux's wazuh-agentd.state filename differs from Windows by design, not by typo.
    # This CONNECTED gate is proven live; see converge-reconnect.md for the full rationale.
    - name: 'END | Read Agent Connection State File'
      become: true
      register: '__agent_state__'
      changed_when: false
      ignore_errors: true
      retries: 30
      delay: 10
      until: (__agent_state__.stdout | default('') | trim) == 'connected'
      args:
        executable: '/bin/bash'
      ansible.builtin.shell: |
        set -uo pipefail
        f='/var/ossec/var/run/wazuh-agentd.state'
        if [ ! -f "${f}" ]; then
          echo 'missing'
          exit 0
        fi
        status="$(sed -n "s/^status='\(.*\)'\$/\1/p" "${f}" | tail -n1)"
        if [ -z "${status}" ]; then
          echo 'unknown'
        else
          echo "${status}"
        fi

    - name: 'END | Verify Agent Is CONNECTED To The Manager'
      ansible.builtin.assert:
        that:
          - (__agent_state__.stdout | default('') | trim) == 'connected'
        quiet: true
        fail_msg: >-
          Agent service is active (previous task) but never reached status='connected' in
          /var/ossec/var/run/wazuh-agentd.state (last read:
          '{{ (__agent_state__.stdout | default('')) | trim }}'). Diagnose the reconnect path on
          the manager in /var/ossec/logs/ossec.log: discriminate "Agent key already in use" from
          "Decrypt the message fail" and ENC_IP_ERROR. A transient connection-overtake/key-reload
          refusal should self-heal in <= ~90s inside this agent's 120s retry runway. If it does
          not, check for a restart-within-runway regression and verify the persisted manager/agent
          keys and enrolled source IP still agree. Keep this CONNECTED gate load-bearing; do not
          weaken authd force-replacement policy to make a duplicate enrollment pass.
        success_msg: 'Agent is connected to the manager (status=connected).'

    #endregion --- [ Validation ] ------------------------------------------------------------ #

#endregion --- [ Script ] -------------------------------------------------------------------- #
