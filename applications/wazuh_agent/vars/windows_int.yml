---
# =========================================================================================== #
# File: '{{ role_path }}/vars/windows_int.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Per-env overlay for the WINDOWS agent path (tasks/main_windows.yml), ENV=int. Same S3 source
# of truth as the Linux RPM overlay (vars/redhat_int.yml).
#
# Operator action when bumping the agent version: upload the new MSI to
# s3://<bucket>/applications/wazuh-agent/wazuh-agent-<ver>.msi, then update s3.agent_msi_key and
# s3.agent_msi_sha256 below. Compute the SHA with:  sha256sum wazuh-agent-<ver>.msi
# Current int SHA is for the official Wazuh 4.14.5-1 Windows agent MSI.
# =========================================================================================== #

s3:
  bucket: '<account-id>-ansible'
  agent_msi_key: 'applications/wazuh-agent/wazuh-agent-4.14.5-1.msi'
  agent_msi_sha256: 'bf35197fee30092d78aad648299e8fd3aba8a0f9bc7d5edebce483a0b2c8e38e'
