---
# =========================================================================================== #
# File: '{{ role_path }}/vars/redhat_test.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Per-env overlay loaded by the generic role loader when os_family=redhat AND ENV=test.
# Replace every remaining CHANGE_ME placeholder with the real test-env value before selecting
# this overlay with `ENV=test`.
#
# s3.bucket is the EXCEPTION: the consuming deployment reads the controller's required
# ANSIBLE_S3_BUCKET environment value and injects it through the wazuh_agent override dict, so
# this literal is never actually used. Workflows derive and export that value; local operators
# export the bucket name explicitly. Do NOT replace it with CHANGE_ME-style text or a real bucket
# name: it is a deliberate fail-fast TRIPWIRE that role validation rejects before any AWS call.
# (Previously this and prod carried an env-suffixed `CHANGE_ME-ansible-test`/`-prod` shape that
# contradicted dev's non-suffixed `<account-id>-ansible` and the IAM `*-ansible` wildcard;
# normalized to the one convention.)
# =========================================================================================== #

s3:
  bucket: '<account-id>-ansible'
  agent_rpm_key: 'applications/wazuh-agent/wazuh-agent-4.14.5-1.x86_64.rpm'
  agent_rpm_sha256: 'CHANGE_ME-64-character-sha256-of-the-test-agent-rpm'
