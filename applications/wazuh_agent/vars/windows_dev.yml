---
# =========================================================================================== #
# File: '{{ role_path }}/vars/windows_dev.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Per-env overlay loaded by the normal tasks/main.yml route when os_family=windows AND ENV=dev;
# the shared loader dispatches to tasks/present_windows.yml. Same S3 source of truth as the Linux
# RPM overlay (vars/redhat_dev.yml).
#
# Operator action when bumping the agent version: upload the new MSI to
# s3://<bucket>/applications/wazuh-agent/wazuh-agent-<ver>.msi, then update s3.agent_msi_key and
# s3.agent_msi_sha256 below. Compute the SHA with:  sha256sum wazuh-agent-<ver>.msi
# Current dev SHA is for the official Wazuh 4.14.5-1 Windows agent MSI.
#
# s3.bucket is RUNTIME-SUBSTITUTED (secure-wazuh ADR-0004), not operator-filled. The consuming
# deployment reads the controller's required ANSIBLE_S3_BUCKET environment value and injects it
# through the wazuh_agent override dict. Workflows derive and export that value; local operators
# export the bucket name explicitly. Do NOT hand-edit this literal: it is a deliberate fail-fast
# TRIPWIRE that role validation rejects before any AWS call. The real account id is never
# committed to any repo.
# =========================================================================================== #

s3:
  bucket: '<account-id>-ansible'
  agent_msi_key: 'applications/wazuh-agent/wazuh-agent-4.14.5-1.msi'
  agent_msi_sha256: 'bf35197fee30092d78aad648299e8fd3aba8a0f9bc7d5edebce483a0b2c8e38e'
