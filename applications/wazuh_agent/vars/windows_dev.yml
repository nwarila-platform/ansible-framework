---
# =========================================================================================== #
# File: '{{ role_path }}/vars/windows_dev.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Per-env overlay for the WINDOWS agent path (tasks/main_windows.yml), ENV=dev. Same S3 source
# of truth as the Linux RPM overlay (vars/redhat_dev.yml).
#
# Operator action when bumping the agent version: upload the new MSI to
# s3://<bucket>/applications/wazuh-agent/wazuh-agent-<ver>.msi, then update s3.agent_msi_key and
# s3.agent_msi_sha256 below. Compute the SHA with:  sha256sum wazuh-agent-<ver>.msi
# Current dev SHA is for the official Wazuh 4.14.5-1 Windows agent MSI.
#
# s3.bucket is RUNTIME-SUBSTITUTED (secure-wazuh ADR-0004), not operator-filled: the consuming
# playbook (secure-wazuh/ansible/playbooks/site.yml) derives the caller's AWS account id
# (amazon.aws.aws_caller_info, controller-side) and injects the account-scoped
# `<account-id>-ansible` bucket as a fallback default via the wazuh_agent override dict, so this
# literal is never actually used. Do NOT hand-edit it: it is a deliberate fail-fast TRIPWIRE — if
# it ever reaches a real AWS call, that call fails immediately instead of silently
# reading/writing the wrong account. The real account id is never committed to any repo.
# =========================================================================================== #

s3:
  bucket: '<account-id>-ansible'
  agent_msi_key: 'applications/wazuh-agent/wazuh-agent-4.14.5-1.msi'
  agent_msi_sha256: 'bf35197fee30092d78aad648299e8fd3aba8a0f9bc7d5edebce483a0b2c8e38e'
