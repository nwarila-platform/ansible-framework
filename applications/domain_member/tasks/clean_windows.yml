# ============================================================================================= #
# File: '{{ role_path }}/tasks/clean_windows.yml'
# --- [ Description ] ------------------------------------------------------------------------ #
#
# state=clean is a supported no-op. The role stages nothing on the guest: the join is performed by
# a module, the password is fetched by the controller and handed over as an argument, and nothing
# is downloaded to the target. There is therefore nothing to remove, and this path says so rather
# than inventing work.
#
# Leaving a domain is NOT what clean means here, and is deliberately not implemented under any
# state: removing a machine from a domain abandons a directory object and every access granted
# through it, which belongs to a decommission a person decides on, not to a converge. An operator
# who wants the membership rebuilt sets force_rejoin on the present path, where the leave and the
# join happen together and the host is never left without one.
#
# ============================================================================================= #
---

#region ------ [ Clean: Report There Is Nothing To Remove ] ----------------------------------- #

- name: 'CLEAN | Report There Is Nothing To Remove'
  ansible.builtin.debug:
    msg: >-
      domain_member: the role stages nothing on the guest, so clean is a supported no-op. Domain
      membership itself is left untouched.
    verbosity: 0

#endregion --- [ Clean: Report There Is Nothing To Remove ] ----------------------------------- #
