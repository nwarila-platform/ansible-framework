# ============================================================================================= #
# File: '{{ role_path }}/tasks/clean_windows.yml'
# --- [ Description ] ------------------------------------------------------------------------ #
# Supported no-op cleanup path for the domain_member role on Windows.
#
# The role stages nothing on the guest: the join is performed by a module, the password is fetched
# by the controller and handed over as an argument, and nothing is downloaded to the target. There
# is therefore nothing for a clean to remove, and this path says so rather than inventing work.
#
# Leaving a domain is NOT what clean means here, and is deliberately not implemented under any
# state: removing a machine from a domain abandons a directory object and every access granted
# through it, which belongs to a decommission that a person decides on, not to a converge. An
# operator who wants the membership rebuilt sets force_rejoin on the present path, where the leave
# and the join happen together and the host is never left without one.
#
# ============================================================================================= #
---
- name: 'INFO | Nothing To Clean (no role-owned state on the guest)'
  ansible.builtin.debug:
    msg: >-
      domain_member: the role stages nothing on the guest, so clean is a supported no-op.
      Domain membership itself is left untouched.
    verbosity: 0
