python3_pip_defaults:

  #region ------ [ Package Manager ] ------------------------------------------------------------- #
  package_manager:

    'RedHat':
      allow_downgrade: false
      allowerases: false
      autoremove: false
      best: true
      bugfix: false
      cacheonly: false
    # conf_file:
    # disable_excludes:
      disable_gpg_check: false
      disable_plugin: []
      disablerepo: []
    # download_dir:
      download_only: false
      enable_plugin: []
      enablerepo: []
      exclude: []
      install_weak_deps: true
      installroot: '/'
      lock_timeout: 30
      name: 'python3-pip'
    # releasever:
      security: false
      skip_broken: false
      sslverify: true
      state: 'present'
      update_cache: false
      update_only: false
      validate_certs: true

    'Debian':
      allow_change_held_packages: false
      allow_downgrade: false
      allow_unauthenticated: false
      autoclean: false
      autoremove: false
      cache_valid_time: 0
      clean: false
    # default_release:
      dpkg_options: ['force-confold', 'force-confdef']
      fail_on_autoremove: false
      force: false
      force_apt_get: false
      install_recommends: true
      lock_timeout: 60
      name: 'python3-pip'
      only_upgrade: false
    # policy_rc_d:
      purge: false
      state: 'present'
      update_cache: false
      update_cache_retries: 5
      update_cache_retry_max_delay: 12
      upgrade: 'no'

  #endregion --- [ Package Manager ] ------------------------------------------------------------- #

  #region ------ [ Self Upgrade ] ---------------------------------------------------------------- #

  self_upgrade:
    enabled: true
    version: 'latest'

  #endregion --- [ Self Upgrade ] ---------------------------------------------------------------- #

  #region ------ [ Templates ] ------------------------------------------------------------------- #
  templates:

    '/etc/pip.conf':
      template: 'pip.conf.j2'
      file:
        path: '/etc/pip.conf'
        owner: 'root'
        group: 'root'
        mode: '0644'
        selinux:
          level: 's0'
          role: 'object_r'
          type: 'etc_t'
          user: 'system_u'

      settings:

        global:
        # cache_dir:
        # cert:
        # client_cert:
          disable_pip_version_check: true       # Deviates from pip default (false) — managed by Ansible; prevents version info leak to PyPI
          exists_action: 'abort'                # Deviates from pip default (switch) — safest; never silently overwrite existing paths
          keyring_provider: 'subprocess'        # Deviates from pip default (auto) — process isolation for credential lookups
        # log:
          no_cache_dir: false
          no_color: true                        # Deviates from pip default (false) — prevents terminal escape sequence injection in logs
          no_input: true                        # Deviates from pip default (false) — prevents hanging on prompts in automated environments
        # proxy:
          require_virtualenv: false             # Cannot be true — Ansible pip tasks run system-wide
          resume_retries: 3                     # Deviates from pip default (5) — limits repeated connections to potentially compromised endpoints
          retries: 3                            # Deviates from pip default (5) — fewer retries reduces exposure window
          timeout: 30                           # Deviates from pip default (15) — generous enough to avoid SSL-bypass workarounds
        # trusted_host: []
        # use_deprecated: []
        # use_feature: []

        install:
          break_system_packages: false          # NEVER enable — protects system Python (PEP 668)
          check_build_dependencies: true
          compile: true
        # extra_index_url: []
        # find_links: []
          force_reinstall: false
          ignore_installed: false
          ignore_requires_python: false
        # index_url: 'https://pypi.org/simple'
        # no_binary: []
          no_build_isolation: false
          no_clean: false
          no_deps: false
          no_index: false
          no_warn_conflicts: false
          no_warn_script_location: false
          only_binary: ':all:'                  # Deviates from pip default (empty) — CRITICAL; prevents setup.py code execution during install
          pre: false
          prefer_binary: true                   # Deviates from pip default (false) — defense-in-depth; prefer wheels over source distributions
        # prefix:
          progress_bar: 'auto'
        # report:
          require_hashes: false
          root_user_action: 'warn'
        # root:
        # src:
        # target:
          upgrade_strategy: 'only-if-needed'
          upgrade: false

        download:
        # abi: []
          check_build_dependencies: true
        # dest:
        # implementation:
        # no_binary: []
          no_build_isolation: false
          no_clean: false
          no_deps: false
        # only_binary: []
        # platform: []
          pre: false
          prefer_binary: true                   # Deviates from pip default (false) — prefer wheels over source distributions
          progress_bar: 'auto'
        # python_version:
          require_hashes: false
        # src:

        freeze:
          all: true                             # Deviates from pip default (false) — pin bootstrap packages (pip/setuptools) for reproducibility
        # exclude: []
        # exclude_editable: false
        # requirement: []

        list:
          editable: false
        # exclude: []
        # exclude_editable: false
        # format: 'columns'
        # include_editable: true
          not_required: false
          outdated: false
          uptodate: false

        uninstall:
          break_system_packages: false          # NEVER enable — protects system Python (PEP 668)
          require_virtualenv: false             # Cannot be true — Ansible operates system-wide
          'yes': false

        wheel:
          check_build_dependencies: true
          no_build_isolation: false
        # no_binary: []
          no_clean: false
          no_deps: false
        # only_binary: []
          pre: false
          prefer_binary: true                   # Deviates from pip default (false) — prefer wheels over source distributions
          progress_bar: 'auto'
          require_hashes: false
        # src:
        # wheel_dir:

  #endregion --- [ Templates ] ------------------------------------------------------------------- #
