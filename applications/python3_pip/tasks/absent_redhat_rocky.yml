# =========================================================================================== #
# File: '{{ role_path }}/tasks/absent_redhat_rocky.yml'                                      #
# --- [ Description ] ----------------------------------------------------------------------- #
# OS-specific task file for Rocky Linux / RHEL (all versions) — state: absent.              #
#                                                                                             #
# Execution order:                                                                            #
#   0. Preflight: verify ansible.builtin.dnf prerequisites are met                           #
#   1. Remove the python3-pip package via dnf                                                 #
#   2. Remove configuration files deployed by state: present                                  #
#                                                                                             #
# This file is included by the shared role loader (tasks/main.yml) which passes the          #
# merged running configuration as 'config'.                                                   #
# =========================================================================================== #

#region ------ [ Script ] ------------------------------------------------------------------- #

- name: 'INFO | Entering OS Tasks (absent_redhat_rocky)'

  block:

    #region ------ [ Preflight ] --------------------------------------------------------------- #

    - name: 'INFO | Entering Preflight Stage'
      block:

        #region ------ [ Preflight: Checking Installed Packages ] --------------------------------- #

        # ansible.builtin.dnf requires python3-dnf Python bindings even for removal.
        # ansible_facts.packages is populated by the shared loader before this file is included.
        - name: 'PREFLIGHT | Verify Required Packages Are Installed'
          ansible.builtin.assert:
            that:
              - "'python3-dnf' in ansible_facts.packages"
            fail_msg: >-
              The 'python3-dnf' package is required by ansible.builtin.dnf but is not
              installed on this host. Install it before running this role:
                dnf install -y python3-dnf
            quiet: true

        #endregion --- [ Preflight: Checking Installed Packages ] --------------------------------- #

    #endregion --- [ Preflight ] --------------------------------------------------------------- #

    #region ------ [ Main ] -------------------------------------------------------------------- #

    - name: 'INFO | Entering Main Stage'
      become: true
      block:

      #region ------ [ MAIN: Removing the 'Python3-pip' Package ] --------------------------------- #

      # Remove python3-pip via dnf. Only parameters relevant to removal are passed;
      # install-only parameters (best, bugfix, cacheonly, security, etc.) are omitted.
      # autoremove is respected from config to optionally remove orphaned dependencies.
      - name: "MAIN | Removing the 'Python3-pip' Package"
        when: ansible_facts.os_family in config.package_manager
        vars:
          __package__: "{{ config.package_manager[ansible_facts.os_family] }}"

        ansible.builtin.dnf:
          autoremove: "{{ __package__.autoremove | default(false) }}"
          conf_file: "{{ __package__.conf_file | default(omit) }}"
          disable_gpg_check: "{{ __package__.disable_gpg_check | default(false) }}"
          disablerepo: "{{ __package__.disablerepo | default([]) }}"
          enablerepo: "{{ __package__.enablerepo | default([]) }}"
          installroot: "{{ __package__.installroot | default('/') }}"
          lock_timeout: "{{ __package__.lock_timeout | default(30) }}"
          name: "{{ __package__.name }}"
          state: 'absent'

      #endregion --- [ MAIN: Removing the 'Python3-pip' Package ] --------------------------------- #

      #region ------ [ MAIN: Removing Configuration Files ] --------------------------------------- #

      # Remove all configuration files deployed by state: present. Loops over the same
      # config.templates dict used during installation so the set of files removed matches
      # exactly what was deployed. Idempotent — missing files are silently skipped.
      - name: 'MAIN | Remove Configuration Files'
        loop: "{{ config.templates | default({}) | dict2items | map(attribute='value') | list }}"
        loop_control: { loop_var: '__template__' }

        ansible.builtin.file:
          path: "{{ __template__.file.path }}"
          state: 'absent'

      #endregion --- [ MAIN: Removing Configuration Files ] --------------------------------------- #

    #endregion --- [ Main ] -------------------------------------------------------------------- #

#endregion --- [ Script ] -------------------------------------------------------------------- #
