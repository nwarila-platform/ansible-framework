# ============================================================================================= #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
# Config-contract validation, auto-discovered and run ONCE by the shared loader's 'INIT |
# Validating Merged Configuration' hook — immediately after defaults -> overlays -> overrides are
# merged, and BEFORE any OS-specific task file runs. Receives the fully merged config as 'config'
# (see tasks/main.yml INIT stage).
#
# WHY THIS EXISTS: a non-empty declaration is caller input and must be one of the supported
# values before present_redhat.yml uses it. An empty declaration is valid and tells that task
# file to detect the platform from the host before the disk pipeline starts.
#
# STATE SCOPE: the loader runs this file for EVERY state (present/absent/clean), but only
# present_redhat.yml reads `platform` — clean_redhat.yml is a declared no-op and there is no
# absent_redhat.yml — so the assert below is scoped to state=present and is a deliberate no-op
# otherwise (a bare `-e state=clean` run must not be blocked on an unrelated input it never
# reads).
# ============================================================================================= #

#region ------ [ Begin: Guard The Platform Declaration ] -------------------------------------- #

- name: 'VALIDATE | Assert Platform Is Empty Or Supported'
  vars:
    __platform__: "{{ config.platform | default('') | string | lower | trim }}"
  when: (state | default('present') | string | lower | trim) == 'present'

  ansible.builtin.assert:
    fail_msg: >-
      linux_disk_manager.platform is
      {{ 'unset/empty' if (__platform__ | length) == 0 else ("'" ~ __platform__ ~ "'") }}.
      Leave 'platform' empty to read it from the host, or set it in the linux_disk_manager
      override dict to vmware, proxmox, or aws.
    quiet: true
    that:
      - (__platform__ | length) == 0 or __platform__ in ['vmware', 'proxmox', 'aws']

#endregion --- [ Begin: Guard The Platform Declaration ] -------------------------------------- #

#region ------ [ Begin: Guard The Disk Identity Contract ] ------------------------------------ #

# Declaring both identities is SILENT-WRONG: the provider treats `unique_id` as authoritative and
# silently ignores `function`, so a stale literal can target a different disk than the tag names.
# Missing identities and AWS-only misuse already fail loudly in the resolver/device tasks and are
# intentionally not pre-asserted (§4b(a)).
- name: 'VALIDATE | Reject Ambiguous Disk Identity Declarations'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __disks__: "{{ config.disks | default([], true) }}"
    __ambiguous_identity__: >-
      {{ __disks__ | selectattr('unique_id', 'defined') | selectattr('function', 'defined')
      | map(attribute='mount_point', default='<no mount_point>') | list }}
  ansible.builtin.assert:
    that:
      - __ambiguous_identity__ | length == 0
    fail_msg: >-
      {{ __ambiguous_identity__ | length }} entry(ies) in linux_disk_manager.disks declare BOTH
      `unique_id` and `function` (mount_point(s): {{ __ambiguous_identity__ | join(', ') }}).
      Declare exactly one identity per disk. On AWS, use `function` for an EBS Function-tag
      lookup or `unique_id` for a literal NVMe/EBS by-id name; do not supply both because the
      literal would silently win.
    quiet: true

# Duplicate declared identities/mount_points are SILENT-WRONG: both entries' preflight probes see
# the same blank disk, parted/mkfs run twice idempotently (mkfs #2 no-ops onto mkfs #1's already-
# matching filesystem), and fstab gains two mount_point rows for ONE physical volume — the role
# exits green while data silently intermingles (§4b canonical retained-assert example; the
# Windows sibling role's C01/C01r guard is the same class).
- name: 'VALIDATE | Reject Duplicate Disk Identities And Mount Points'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __disks__: "{{ config.disks | default([], true) }}"
    __unique_ids__: >-
      {{ __disks__ | selectattr('unique_id', 'defined') | map(attribute='unique_id') | list }}
    __functions__: >-
      {{ __disks__ | selectattr('function', 'defined') | map(attribute='function') | list }}
    __mount_points__: >-
      {{ __disks__ | map(attribute='mount_point', default='<no mount_point>') | list }}
  ansible.builtin.assert:
    that:
      - (__unique_ids__ | unique | length) == (__unique_ids__ | length)
      - (__functions__ | unique | length) == (__functions__ | length)
      - (__mount_points__ | unique | length) == (__mount_points__ | length)
    fail_msg: >-
      linux_disk_manager.disks declares a duplicate unique_id, function, or mount_point — every
      entry must target a distinct disk and a distinct mount_point, or two entries silently
      intermingle data on one volume. unique_id values: {{ __unique_ids__ }}; function values:
      {{ __functions__ }}; mount_point values: {{ __mount_points__ }}.
    quiet: true

#endregion --- [ Begin: Guard The Disk Identity Contract ] ------------------------------------ #
