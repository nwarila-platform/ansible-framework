#region ------ [ Play: Use A Declared Platform Without Gathering ] ---------------------------- #

- name: 'TEST | Use A Declared Platform Without Gathering'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_python_interpreter: '/nonexistent/python3'
    config:
      disks: []
      platform: 'AWS '
    __expected_platform__: 'aws'
  tasks:

    - name: 'TEST | Accept The Padded Upper-Case Declaration'
      ansible.builtin.include_role:
        name: 'linux_disk_manager'
        tasks_from: 'validate.yml'

    - name: 'TEST | Run The Linux Entry Point With A Declaration'
      register: '__entrypoint_result__'

      ansible.builtin.include_role:
        name: 'linux_disk_manager'
        public: true
        tasks_from: 'present_redhat.yml'

    - name: 'TEST | Assert The Declaration Is Used Without Gathering'
      ansible.builtin.assert:
        fail_msg: 'The declared platform was not used as the expected supported value.'
        quiet: true
        that:
          - __entrypoint_result__ is succeeded
          - (config.platform | string | lower | trim) == __expected_platform__
          - >-
            linux_disk_manager_vendor_platforms.values()
            | select('equalto', __expected_platform__) | list | length == 1

#endregion --- [ Play: Use A Declared Platform Without Gathering ] ---------------------------- #

#region ------ [ Play: Reject An Unknown Reported Value ] ------------------------------------- #

- name: 'TEST | Reject An Unknown Reported Value'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_facts:
      system_vendor: 'Unknown Compute'
    config:
      disks: []
      platform: ''
  tasks:

    - name: 'TEST | Exercise Unknown Platform Detection'
      block:

        - name: 'TEST | Run The Linux Entry Point For An Unknown Value'
          ansible.builtin.include_role:
            name: 'linux_disk_manager'
            tasks_from: 'present_redhat.yml'

        - name: 'TEST | Fail On Unexpected Unknown Value Success'
          ansible.builtin.fail:
            msg: 'The unknown-value case unexpectedly succeeded.'

      rescue:

        - name: 'TEST | Assert The Failure Names The Unknown Value'
          ansible.builtin.assert:
            fail_msg: 'The detection failure did not name the unknown reported value.'
            quiet: true
            that:
              - "'Unknown Compute' in (ansible_failed_result.msg | default(''))"

#endregion --- [ Play: Reject An Unknown Reported Value ] ------------------------------------- #

#region ------ [ Play: Reject An Unsupported Declaration ] ------------------------------------ #

- name: 'TEST | Reject An Unsupported Declaration'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    ansible_facts:
      system_vendor: 'Amazon EC2'
    config:
      disks: []
      platform: 'hyperv'
  tasks:

    - name: 'TEST | Exercise Unsupported Platform Validation'
      block:

        - name: 'TEST | Validate The Unsupported Linux Declaration'
          ansible.builtin.include_role:
            name: 'linux_disk_manager'
            tasks_from: 'validate.yml'

        - name: 'TEST | Fail On Unexpected Unsupported Declaration Success'
          ansible.builtin.fail:
            msg: 'The unsupported declaration case unexpectedly succeeded.'

      rescue:

        - name: 'TEST | Assert The Failure Names The Unsupported Declaration'
          ansible.builtin.assert:
            fail_msg: 'Validation did not name the unsupported declaration.'
            quiet: true
            that:
              - "'hyperv' in (ansible_failed_result.msg | default(''))"

#endregion --- [ Play: Reject An Unsupported Declaration ] ------------------------------------ #
