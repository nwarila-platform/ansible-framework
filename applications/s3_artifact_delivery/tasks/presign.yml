---
# Sign exactly one GetObject request beside its target fetch. Delegated controller work remains
# registered on the current inventory host so signatures cannot cross host boundaries.

- name: 'S3 SIGN | Generate One Short-Lived HTTPS URL On The Controller'
  delegate_to: 'localhost'
  become: false
  no_log: true
  register: '__s3_artifact_delivery_presign_result__'
  environment:
    TMPDIR: "{{ lookup('ansible.builtin.env', 'ANSIBLE_LOCAL_TEMP') }}"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  s3_artifact:
    mode: 'presign'
    bucket: "{{ s3_artifact_delivery_bucket }}"
    object_key: "{{ s3_artifact_delivery_object_key }}"
    region: "{{ s3_artifact_delivery_region }}"
    access_key: "{{ __s3_artifact_delivery_access_key__ }}"
    secret_key: "{{ __s3_artifact_delivery_secret_key__ }}"
    session_token: "{{ __s3_artifact_delivery_session_token__ }}"
    expires_in: "{{ s3_artifact_delivery_url_expiry_seconds }}"

- name: 'S3 SIGN | Record Whether Signer Output Is Redacted Or Empty'
  no_log: true
  vars:
    __s3_artifact_delivery_candidate_url__: >-
      {{ __s3_artifact_delivery_presign_result__.url | default('') }}
  ansible.builtin.set_fact:
    __s3_artifact_delivery_redaction_detected__: >-
      {{
        (__s3_artifact_delivery_candidate_url__ is not string)
        or (__s3_artifact_delivery_candidate_url__ | length == 0)
        or ('*' in __s3_artifact_delivery_candidate_url__)
        or ('VALUE_SPECIFIED_IN_NO_LOG_PARAMETER' in __s3_artifact_delivery_candidate_url__)
      }}

- name: 'S3 SIGN | Reject A Redacted Or Empty Bearer URL'
  no_log: true
  ansible.builtin.assert:
    that:
      - not (__s3_artifact_delivery_redaction_detected__ | bool)
    quiet: true
    fail_msg: >-
      The generated artifact URL is empty or contains an Ansible redaction marker.

- name: 'S3 SIGN | Hold The Bearer URL On The Controller'
  no_log: true
  ansible.builtin.set_fact:
    __s3_artifact_delivery_url__: "{{ __s3_artifact_delivery_presign_result__.url }}"
    cacheable: false
