---
# Destroy the temporary credential values as soon as the current artifact consumer completes.

- name: 'S3 SESSION | Scrub The Scoped Credential Facts'
  no_log: true
  ansible.builtin.set_fact:
    __s3_artifact_delivery_access_key__: ''
    __s3_artifact_delivery_secret_key__: ''
    __s3_artifact_delivery_session_token__: ''
    cacheable: false

- name: 'S3 SESSION | Scrub The Assume-Role Register'
  no_log: true
  ansible.builtin.set_fact:
    __s3_artifact_delivery_session_result__: ''
