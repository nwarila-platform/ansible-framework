---
# Mint a new artifact-only session on the controller for the current inventory host at the point
# of use. The caller supplies a fixed session name so audit records can distinguish read groups.

- name: 'S3 SESSION | Mint A Fresh Scoped Artifact-Read Credential'
  delegate_to: 'localhost'
  become: false
  no_log: true
  register: '__s3_artifact_delivery_session_result__'
  environment:
    TMPDIR: "{{ lookup('ansible.builtin.env', 'ANSIBLE_LOCAL_TEMP') }}"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  amazon.aws.sts_assume_role:
    role_arn: "{{ s3_artifact_delivery_reader_role_arn }}"
    role_session_name: "{{ s3_artifact_delivery_session_name }}"
    region: "{{ s3_artifact_delivery_region }}"
    duration_seconds: 3600

- name: 'S3 SESSION | Hold The Fresh Scoped Credential On The Controller'
  no_log: true
  ansible.builtin.set_fact:
    __s3_artifact_delivery_access_key__: >-
      {{ __s3_artifact_delivery_session_result__.sts_creds.access_key }}
    __s3_artifact_delivery_secret_key__: >-
      {{ __s3_artifact_delivery_session_result__.sts_creds.secret_key }}
    __s3_artifact_delivery_session_token__: >-
      {{ __s3_artifact_delivery_session_result__.sts_creds.session_token }}
    cacheable: false

- name: 'S3 SESSION | Require A Complete Fresh Scoped Credential'
  no_log: true
  ansible.builtin.assert:
    that:
      - __s3_artifact_delivery_access_key__ | trim | length > 0
      - __s3_artifact_delivery_secret_key__ | trim | length > 0
      - __s3_artifact_delivery_session_token__ | trim | length > 0
    quiet: true
    fail_msg: >-
      The scoped artifact-reader role returned an incomplete credential for the requested
      artifact read group.

- name: 'S3 SESSION | Scrub The Assume-Role Module Result'
  no_log: true
  ansible.builtin.set_fact:
    __s3_artifact_delivery_session_result__: ''
