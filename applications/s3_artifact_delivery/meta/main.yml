---
galaxy_info:
  role_name: 's3_artifact_delivery'
  namespace: 'ansible_framework'
  author: 'HellBomb'
  description: >-
    Delivers checksum-pinned S3 artifacts through fresh controller-generated presigned URLs
    without distributing reusable AWS credential sets to targets.

  license: 'MIT'
  min_ansible_version: '2.16'

  platforms:
    - name: 'EL'
      versions:
        - 'all'
    - name: 'Windows'
      versions:
        - 'all'

  galaxy_tags:
    - 'aws'
    - 's3'
    - 'artifact'
    - 'download'
    - 'security'

allow_duplicates: true

dependencies: []
