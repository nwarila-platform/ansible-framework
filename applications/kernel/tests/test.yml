- name: 'PLAY | Refuse A Template Key That Differs From Its Path'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    state: 'present'
    ansible_become: false
    ansible_facts:
      os_family: 'RedHat'
    kernel_running:
      package_manager:
        'RedHat':
          name: ['kernel']
      sysctl:
        conflicts: 'etc'
      modules:
        unload: true
      templates:
        '/etc/sysctl.d/91-other.conf':
          template: 'sysctl.conf.j2'
          file:
            path: '/etc/sysctl.d/90-example.conf'
            owner: 'root'
            group: 'root'
            mode: '0644'
          settings:
            net.example.beta: 'sample'
            kernel.example_alpha: 7
        '/etc/modprobe.d/example.conf':
          template: 'modprobe.conf.j2'
          file:
            path: '/etc/modprobe.d/example.conf'
            owner: 'root'
            group: 'root'
            mode: '0644'
          settings:
            disabled: ['example_two', 'example-one']
  tasks:

    - name: 'PROCESS | Run The Contract Against A Configuration That Must Be Refused'
      block:

        - name: 'PROCESS | Validate The Configuration'

          ansible.builtin.include_role:
            allow_duplicates: true
            defaults_from: 'main'
            handlers_from: 'main'
            name: 'kernel'
            public: false
            rescuable: true
            rolespec_validate: false
            tasks_from: 'validate.yml'

        - name: 'END | Fail Because The Contract Accepted The Configuration'

          ansible.builtin.fail:
            msg: >-
              The contract accepted a configuration it must refuse: A Template Key That Differs
              From Its Path.

      rescue:

        - name: 'END | Assert The Refusal Names Its Cause'

          ansible.builtin.assert:
            fail_msg: >-
              The refusal did not name its cause; observed {{ ansible_failed_result.msg |
              default('kernel operation failed', true) }}.
            quiet: true
            that:
              - >-
                'must equal its entry' in (ansible_failed_result.msg | default('kernel operation
                failed', true))

