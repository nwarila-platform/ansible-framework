                  'match', __conf_re__) | rejectattr('0', 'match', __d_re__) | list) + (__lines__
                  | select('sequence') | reject('string') | reject('mapping') | selectattr('0',
                  'string') | selectattr('1', 'string') | selectattr('1', 'search', '[\r\n\x00]')
