- name: 'PLAY | Render Both Templates To The Expected Bytes'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    __sysctl_expected__: |
      # ansible-framework kernel role: managed file; manual edits are overwritten on the next run
      kernel.example_alpha = 7
      net.example.beta = sample
    __modprobe_expected__: |
      # ansible-framework kernel role: managed file; manual edits are overwritten on the next run
      install example-one /bin/false
      blacklist example-one
      install example_two /bin/false
      blacklist example_two
  tasks:

    - name: 'PROCESS | Render And Compare The Templates'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_test_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_test_'
            state: 'directory'
            suffix: ''

        - name: 'PROCESS | Render The Sysctl Template'
          changed_when: false
          vars:
            __template__:
              settings:
                net.example.beta: 'sample'
                kernel.example_alpha: 7

          ansible.builtin.template:
            backup: false
            dest: "{{ __kernel_test_dir__.path }}/sysctl.conf"
            follow: false
            force: true
            lstrip_blocks: false
            mode: '0600'
            newline_sequence: '\n'
            output_encoding: 'utf-8'
            src: "{{ playbook_dir | dirname }}/templates/sysctl.conf.j2"
            trim_blocks: true
            unsafe_writes: false

        - name: 'PROCESS | Render The Modprobe Template'
          changed_when: false
          vars:
            __template__:
              settings:
                disabled: ['example_two', 'example-one']

          ansible.builtin.template:
            backup: false
            dest: "{{ __kernel_test_dir__.path }}/modprobe.conf"
            follow: false
            force: true
            lstrip_blocks: false
            mode: '0600'
            newline_sequence: '\n'
            output_encoding: 'utf-8'
            src: "{{ playbook_dir | dirname }}/templates/modprobe.conf.j2"
            trim_blocks: true
            unsafe_writes: false

        - name: 'END | Read The Rendered Files'
          check_mode: false
          loop: ['sysctl.conf', 'modprobe.conf']
          loop_control: { label: "{{ item }}" }
          register: '__kernel_rendered__'

          ansible.builtin.slurp:
            armor: true
            src: "{{ __kernel_test_dir__.path }}/{{ item }}"

        # Keep the four rendering variables equal to the reload task's as parsed: what they
        # render for a settings mapping must be what the template writes, or the gate reloads
        # every run.
        - name: 'END | Assert The Rendered Bytes And The Gate Rendering Equal The Expected Bytes'
          vars:
            __settings__:
              - net.example.beta: 'sample'
                kernel.example_alpha: 7
              - {}
            __nl__: "\n"
            __header__: >-
              # ansible-framework kernel role: managed file; manual edits are overwritten on the
              next run
            __setting_pairs__: >-
              {{ __settings__ | map('dictsort') | map('map', 'join', ' = ') | map('list') | list
              }}
            __rendered__: >-
              {{ ([__header__] * (__settings__ | length)) | zip(__setting_pairs__) |
              map('flatten') | map('join', __nl__) | map('regex_replace', '$', __nl__) | list }}

          ansible.builtin.assert:
            fail_msg: >-
              A template rendered unexpected bytes; sysctl.conf {{
              __kernel_rendered__.results[0].content | b64decode }} and modprobe.conf {{
              __kernel_rendered__.results[1].content | b64decode }}; the gate expression rendered
              {{ __rendered__ }}.
            quiet: true
            that:
              - >-
                (__kernel_rendered__.results[0].content | b64decode) == __sysctl_expected__
              - >-
                (__kernel_rendered__.results[1].content | b64decode) == __modprobe_expected__
              - __rendered__[0] == __sysctl_expected__
              - __rendered__[1] == __header__ ~ __nl__

      always:

        - name: 'PROCESS | Remove The Scratch Directory'
          changed_when: false
          when: (__kernel_test_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_test_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | List Symlinks Only Under The Link File Type'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
  tasks:

    - name: 'PROCESS | Create A Scratch Tree With A File And A Symlink'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_find_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_find_'
            state: 'directory'
            suffix: ''

        - name: 'PROCESS | Write A Regular File And A Hidden One'
          changed_when: false
          loop: ['real.conf', '.hidden.conf']
          loop_control: { label: "{{ item }}" }

          ansible.builtin.copy:
            backup: false
            content: "net.example.beta = 1\n"
            decrypt: true
            dest: "{{ __kernel_find_dir__.path }}/{{ item }}"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        - name: 'PROCESS | Link To The Regular File, Once Hidden'
          changed_when: false
          loop: ['link.conf', '.hidden-link.conf']
          loop_control: { label: "{{ item }}" }

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            dest: "{{ __kernel_find_dir__.path }}/{{ item }}"
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            recurse: false
            src: 'real.conf'
            state: 'link'
            unsafe_writes: false

        - name: 'BEGIN | Find Files And Then Links'
          check_mode: false
          loop: ['file', 'link']
          loop_control: { label: "{{ item }}" }
          register: '__kernel_found__'

          ansible.builtin.find:
            age_stamp: 'mtime'
            checksum_algorithm: 'sha1'
            exact_mode: true
            file_type: "{{ item }}"
            follow: true
            get_checksum: false
            hidden: true
            paths: ["{{ __kernel_find_dir__.path }}"]
            patterns: ['*.conf']
            read_whole_file: false
            recurse: false
            use_regex: false

        - name: 'END | Assert The Links, Hidden Or Not, Appear Only Under The Link File Type'

          ansible.builtin.assert:
            fail_msg: >-
              find listed {{ __kernel_found__.results | map(attribute='files') | map('map',
              attribute='path') | map('map', 'basename') | list }} for file and link; the role
              relies on the link type to see symlinks.
            quiet: true
            that:
              - >-
                __kernel_found__.results[0].files | map(attribute='path') | map('basename') |
                sort == ['.hidden.conf', 'real.conf']
              - >-
                __kernel_found__.results[1].files | map(attribute='path') | map('basename') |
                sort == ['.hidden-link.conf', 'link.conf']

      always:

        - name: 'PROCESS | Remove The Scratch Tree'
          changed_when: false
          when: (__kernel_find_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_find_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | Build The Hit Pairs From Per-File Grep Results'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
  tasks:

    - name: 'PROCESS | Grep Two Scratch Files With The Role Flags'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_grep_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_grep_'
            state: 'directory'
            suffix: ''

        # A space, a colon and a leading dot in the names: a multi-file grep prefix could not be
        # parsed back into these paths, the per-file loop needs none, and hidden files count.
        - name: 'PROCESS | Write One Definition Into Each File'
          changed_when: false
          loop: >-
            {{ [__kernel_grep_dir__.path ~ '/zz policy.conf', __kernel_grep_dir__.path ~
            '/zz:policy.conf', __kernel_grep_dir__.path ~ '/.hidden.conf'] }}
          loop_control: { label: "{{ item | basename }}" }

          ansible.builtin.copy:
            backup: false
            content: "net.example.beta = 1\n"
            decrypt: true
            dest: "{{ item }}"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        # The grep task adapts the role's to one literal key over scratch files; keep the pair
        # and hit expressions below equal to the role's as parsed.
        - name: 'BEGIN | Read The Other Definitions Of The Managed Keys'
          changed_when: false
          check_mode: false
          failed_when: __kernel_conflicting__.rc not in [0, 1]
          loop: >-
            {{ [__kernel_grep_dir__.path ~ '/zz policy.conf', __kernel_grep_dir__.path ~
            '/zz:policy.conf', __kernel_grep_dir__.path ~ '/.hidden.conf'] }}
          loop_control: { label: "{{ item | basename }}" }
          register: '__kernel_conflicting__'

          ansible.builtin.command:
            argv: >-
              {{ ['grep', '-nE', '^[[:space:]]*(' ~ 'net[.]example[.]beta' ~ ')[[:space:]]*='] +
              [item] }}
            expand_argument_vars: true
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'END | Assert Each Pair Carries The Loop Path And The Bare Line'
          vars:
            __pairs__: >-
              {{ query('ansible.builtin.subelements', __kernel_conflicting__.results |
              default([], true), 'stdout_lines', skip_missing=true) }}
            __hits__: >-
              {{ __pairs__ | map(attribute='0.item') | zip(__pairs__ | map(attribute='1') |
              map('regex_replace', '^[0-9]+:', '')) | map('list') | list }}

          ansible.builtin.assert:
            fail_msg: >-
              The hit pairs read {{ __hits__ }}; the role records [path, original line] for each
              definition it comments out.
            quiet: true
            that:
              - >-
                (__hits__ | sort) == ([[__kernel_grep_dir__.path ~ '/zz policy.conf',
                'net.example.beta = 1'], [__kernel_grep_dir__.path ~ '/zz:policy.conf',
                'net.example.beta = 1'], [__kernel_grep_dir__.path ~ '/.hidden.conf',
                'net.example.beta = 1']] | sort)

      always:

        - name: 'PROCESS | Remove The Scratch Tree'
          changed_when: false
          when: (__kernel_grep_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_grep_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | List The Legacy Sysctl Directory Only As A Distinct Real Directory'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
  tasks:

    - name: 'PROCESS | Run The Alias Predicate Against Three Scratch Trees'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_alias_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_alias_'
            state: 'directory'
            suffix: ''

        # merged: lib is a symlink to usr/lib, the EL 8 and 9 layout; split: lib/sysctl.d is
        # its own directory; linked: lib is real but lib/sysctl.d links to the vendor directory.
        - name: 'PROCESS | Create The Directories Of The Three Trees'
          changed_when: false
          loop: >-
            {{ ['merged/usr/lib/sysctl.d', 'split/usr/lib/sysctl.d', 'split/lib/sysctl.d',
            'linked/usr/lib/sysctl.d', 'linked/lib'] | map('regex_replace', '^',
            __kernel_alias_dir__.path ~ '/') | list }}
          loop_control: { label: "{{ item }}" }

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            mode: '0700'
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ item }}"
            recurse: false
            state: 'directory'
            unsafe_writes: false

        - name: 'PROCESS | Write A Vendor File Into Each Tree'
          changed_when: false
          loop: >-
            {{ ['merged', 'split', 'linked'] | map('regex_replace', '^',
            __kernel_alias_dir__.path ~ '/') | map('regex_replace', '$',
            '/usr/lib/sysctl.d/50-vendor.conf') | list }}
          loop_control: { label: "{{ item }}" }

          ansible.builtin.copy:
            backup: false
            content: "net.example.beta = 1\n"
            decrypt: true
            dest: "{{ item }}"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        - name: 'PROCESS | Link The Merged Tree At lib And The Linked Tree At lib/sysctl.d'
          changed_when: false
          loop:
            - ["{{ __kernel_alias_dir__.path }}/merged/lib", 'usr/lib']
            - ["{{ __kernel_alias_dir__.path }}/linked/lib/sysctl.d", '../usr/lib/sysctl.d']
          loop_control: { label: "{{ item.0 }}" }

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            dest: "{{ item.0 }}"
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            recurse: false
            src: "{{ item.1 }}"
            state: 'link'
            unsafe_writes: false

        - name: 'BEGIN | Stat lib, lib/sysctl.d And usr/lib/sysctl.d In Each Tree'
          check_mode: false
          loop: >-
            {{ ['merged', 'split', 'linked'] | product(['lib', 'lib/sysctl.d',
            'usr/lib/sysctl.d']) | map('join', '/') | map('regex_replace', '^',
            __kernel_alias_dir__.path ~ '/') | list }}
          loop_control: { label: "{{ item }}" }
          register: '__kernel_lib_stats__'

          ansible.builtin.stat:
            checksum_algorithm: 'sha1'
            follow: false
            get_attributes: false
            get_checksum: false
            get_mime: false
            get_selinux_context: false
            path: "{{ item }}"

        # Keep __all_dirs__ equal to the four find tasks' (BEGIN and END, files and symlinks) as
        # parsed; the three stat results it reads are this play's, one set per tree.
        - name: 'END | Assert The Alias Is Listed Only For The Split Tree'
          loop: [['merged', false], ['split', true], ['linked', false]]
          loop_control: { label: "{{ item.0 }}" }
          vars:
            __tree__: "{{ __kernel_alias_dir__.path ~ '/' ~ item.0 }}"
            __kernel_lib__: >-
              {{ __kernel_lib_stats__.results | selectattr('item', 'eq', __tree__ ~ '/lib') |
              first }}
            __kernel_lib_dir__: >-
              {{ __kernel_lib_stats__.results | selectattr('item', 'eq', __tree__ ~
              '/lib/sysctl.d') | first }}
            __kernel_usr_lib_dir__: >-
              {{ __kernel_lib_stats__.results | selectattr('item', 'eq', __tree__ ~
              '/usr/lib/sysctl.d') | first }}
            __all_dirs__: >-
              {{ ['/etc/sysctl.d', '/run/sysctl.d', '/usr/local/lib/sysctl.d',
              '/usr/lib/sysctl.d'] + (['/lib/sysctl.d'] if (__kernel_lib__.stat.exists and
              __kernel_lib__.stat.isdir and not __kernel_lib__.stat.islnk and
              __kernel_lib_dir__.stat.exists and __kernel_lib_dir__.stat.isdir and not
              __kernel_lib_dir__.stat.islnk and [__kernel_lib_dir__.stat.dev,
              __kernel_lib_dir__.stat.inode] != [__kernel_usr_lib_dir__.stat.dev | default(none),
              __kernel_usr_lib_dir__.stat.inode | default(none)]) else []) }}

          ansible.builtin.assert:
            fail_msg: >-
              The alias predicate listed {{ __all_dirs__ }} for the {{ item.0 }} tree;
              /lib/sysctl.d belongs there only when it is a distinct real directory under a real
              /lib.
            quiet: true
            that:
              - ('/lib/sysctl.d' in __all_dirs__) == item.1

      always:

        - name: 'PROCESS | Remove The Scratch Tree'
          changed_when: false
          when: (__kernel_alias_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_alias_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | Refuse Only The Exact Marked Line And Count Duplicates Exactly'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    # Two distinct pairs whose joined forms would collide on the old '@@SEP@@' sentinel, and one
    # true duplicate pair: the duplicate check must count two and one.
    __crafted__:
      - ['/etc/sysctl.d/a.conf', 'net.example.beta = z.conf@@SEP@@net.example.beta = 1']
      - ['/etc/sysctl.d/a.conf@@SEP@@net.example.beta = z.conf', 'net.example.beta = 1']
    __repeated__:
      - ['/etc/sysctl.d/b.conf', 'net.example.beta = 1']
      - ['/etc/sysctl.d/b.conf', 'net.example.beta = 1']
    # accept.conf holds the sentinel in an active value and a different marked line; refuse.conf
    # holds the exact marked form of its active line.
    __accept_text__: |
      net.example.beta = @@SEP@@wanted
      # kernel-role-disabled: net.example.beta = different
    __refuse_text__: |
      net.example.beta = 1
      # kernel-role-disabled: net.example.beta = 1
  tasks:

    - name: 'END | Assert The Duplicate Check Counts Distinct Pairs As Distinct'
      vars:
        __distinct__: "{{ __crafted__ | map('to_json') | list }}"
        __same__: "{{ __repeated__ | map('to_json') | list }}"

      ansible.builtin.assert:
        fail_msg: >-
          The duplicate check miscounts: {{ __distinct__ | unique(case_sensitive=true) | length
          }} of {{ __distinct__ | length }} distinct pairs and {{ __same__ |
          unique(case_sensitive=true) | length }} of {{ __same__ | length }} repeated pairs.
        quiet: true
        that:
          - (__distinct__ | unique(case_sensitive=true) | length) == (__distinct__ | length)
          - (__same__ | unique(case_sensitive=true) | length) == 1

    - name: 'PROCESS | Run The Marked-Line Refusal Over An Accepted And A Refused File'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_marker_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_marker_'
            state: 'directory'
            suffix: ''

        - name: 'PROCESS | Write The Accepted And The Refused File'
          changed_when: false
          loop:
            - ['accept.conf', "{{ __accept_text__ }}"]
            - ['refuse.conf', "{{ __refuse_text__ }}"]
          loop_control: { label: "{{ item.0 }}" }

          ansible.builtin.copy:
            backup: false
            content: "{{ item.1 }}"
            decrypt: true
            dest: "{{ __kernel_marker_dir__.path }}/{{ item.0 }}"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        # The grep task adapts the role's to one literal key over two scratch files; keep the
        # slurp loop and the refusal equal to the role's tasks as parsed.
        - name: 'BEGIN | Read The Other Definitions Of The Managed Keys'
          changed_when: false
          check_mode: false
          failed_when: __kernel_conflicting__.rc not in [0, 1]
          loop: >-
            {{ [__kernel_marker_dir__.path ~ '/accept.conf', __kernel_marker_dir__.path ~
            '/refuse.conf'] }}
          loop_control: { label: "{{ item | basename }}" }
          register: '__kernel_conflicting__'

          ansible.builtin.command:
            argv: >-
              {{ ['grep', '-nE', '^[[:space:]]*(' ~ 'net[.]example[.]beta' ~ ')[[:space:]]*='] +
              [item] }}
            expand_argument_vars: true
            stdin_add_newline: true
            strip_empty_ends: true

        - name: 'BEGIN | Read Each File The Run Would Edit'
          check_mode: false
          loop: >-
            {{ __kernel_conflicting__.results | default([], true) | selectattr('stdout',
            'defined') | rejectattr('stdout', 'eq', '') | map(attribute='item') | unique | sort
            }}
          loop_control: { label: "{{ __kernel_edit_path__ }}", loop_var: '__kernel_edit_path__' }
          register: '__kernel_edit_targets__'

          ansible.builtin.slurp:
            armor: true
            src: "{{ __kernel_edit_path__ }}"

        - name: 'BEGIN | Refuse An Edit Whose Marked Line Already Exists'
          loop: "{{ __hits__ }}"
          loop_control: { label: "{{ __kernel_hit__.0 }}", loop_var: '__kernel_hit__' }
          vars:
            __nl__: "\n"
            __paths__: >-
              {{ __kernel_edit_targets__.results | default([], true) |
              map(attribute='__kernel_edit_path__') | list }}
            __texts__: >-
              {{ __kernel_edit_targets__.results | default([], true) | map(attribute='content') |
              map('b64decode') | map('regex_replace', '\A', '\n') | list }}
            __text_of__: >-
              {{ __paths__ | zip(__texts__) | list | items2dict(key_name=0, value_name=1) }}
            __pairs__: >-
              {{ query('ansible.builtin.subelements', __kernel_conflicting__.results |
              default([], true), 'stdout_lines', skip_missing=true) }}
            __hits__: >-
              {{ __pairs__ | map(attribute='0.item') | zip(__pairs__ | map(attribute='1') |
              map('regex_replace', '^[0-9]+:', '')) | map('list') | list }}
            __marked__: "{{ __nl__ ~ '# kernel-role-disabled: ' ~ __kernel_hit__.1 ~ __nl__ }}"
            __haystack__: "{{ __text_of__[__kernel_hit__.0] }}"

          ansible.builtin.assert:
            fail_msg: >-
              Refusing to comment out a definition whose marked form already exists in the file:
              {{ __kernel_hit__.0 }} holds '# kernel-role-disabled: {{ __kernel_hit__.1 }}'.
              Remove the pre-existing marked line by hand; the role cannot tell it from its own.
            quiet: true
            that:
              - __marked__ not in __haystack__

        - name: 'END | Fail Because The Refusal Accepted The Exact Marked Line'

          ansible.builtin.fail:
            msg: >-
              The marked-line refusal accepted refuse.conf, whose active line already has its
              exact marked form.

      rescue:

        - name: 'END | Assert Only The Refused File Was Refused, With Its Cause'
          vars:
            __results__: "{{ ansible_failed_result.results | default([], true) }}"
            __refused__: >-
              {{ __results__ | selectattr('failed', 'defined') | selectattr('failed') |
              map(attribute='__kernel_hit__.0') | map('basename') | list }}
            __accepted__: >-
              {{ __results__ | rejectattr('failed', 'defined') |
              map(attribute='__kernel_hit__.0') | map('basename') | list + (__results__ |
              selectattr('failed', 'defined') | rejectattr('failed') |
              map(attribute='__kernel_hit__.0') | map('basename') | list) }}
            __cause__: >-
              {{ __results__ | selectattr('failed', 'defined') | selectattr('failed') |
              map(attribute='msg') | join(' ') }}

          ansible.builtin.assert:
            fail_msg: >-
              The marked-line refusal refused {{ __refused__ }} and accepted {{ __accepted__ }}
              with {{ __cause__ }}; it must refuse exactly refuse.conf, naming its marked line.
            quiet: true
            that:
              - __refused__ == ['refuse.conf']
              - __accepted__ == ['accept.conf']
              - "'marked form already exists' in __cause__"
              - "'net.example.beta = 1' in __cause__"

      always:

        - name: 'PROCESS | Remove The Scratch Directory'
          changed_when: false
          when: (__kernel_marker_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_marker_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | Comment And Restore Lines Holding Backslash Sequences'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    __nl__: "\n"
    # Each is replacement syntax to a backreference expansion; each must survive as text.
    __lines__: ['net.example.beta = \1', 'net.example.beta = \t', 'net.example.beta = \g<0>']
  tasks:

    - name: 'PROCESS | Comment Out Three Lines And Restore Them'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_backslash_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_backslash_'
            state: 'directory'
            suffix: ''

        - name: 'PROCESS | Write The Three Lines'
          changed_when: false

          ansible.builtin.copy:
            backup: false
            content: "{{ __lines__ | join(__nl__) ~ __nl__ }}"
            decrypt: true
            dest: "{{ __kernel_backslash_dir__.path }}/scratch.conf"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        # Keep the module arguments equal to the role's commenting task's as parsed; the loop is
        # this play's.
        - name: 'PROCESS | Comment Out Each Line As The Role Does'
          changed_when: false
          loop: >-
            {{ [__kernel_backslash_dir__.path ~ '/scratch.conf'] | product(__lines__) |
            map('list') | list }}
          loop_control: { label: "{{ item.1 }}" }

          ansible.builtin.lineinfile:
            backrefs: true
            backup: false
            create: false
            encoding: 'utf-8'
            firstmatch: false
            line: '# kernel-role-disabled: \g<0>'
            path: "{{ item.0 }}"
            regexp: "^{{ item.1 | regex_escape }}$"
            state: 'present'
            unsafe_writes: false

        - name: 'END | Read The Commented File'
          check_mode: false
          register: '__kernel_backslash_commented__'

          ansible.builtin.slurp:
            armor: true
            src: "{{ __kernel_backslash_dir__.path }}/scratch.conf"

        - name: 'END | Assert Each Line Is Marked And Otherwise Byte-Identical'

          ansible.builtin.assert:
            fail_msg: >-
              Commenting changed the text: {{ __kernel_backslash_commented__.content | b64decode
              }}
            quiet: true
            that:
              - >-
                (__kernel_backslash_commented__.content | b64decode) == (__lines__ |
                map('regex_replace', '^', '# kernel-role-disabled: ') | join(__nl__) ~ __nl__)

        # Keep the module arguments equal to the role's restoration task's as parsed; the loop is
        # this play's.
        - name: 'PROCESS | Restore Each Line As The Role Does'
          changed_when: false
          loop: >-
            {{ [__kernel_backslash_dir__.path ~ '/scratch.conf'] | product(__lines__) |
            map('list') | list }}
          loop_control: { label: "{{ item.1 }}" }

          ansible.builtin.lineinfile:
            backrefs: true
            backup: false
            create: false
            encoding: 'utf-8'
            firstmatch: false
            line: '\g<1>'
            path: "{{ item.0 }}"
            regexp: "^# kernel-role-disabled: ({{ item.1 | regex_escape }})$"
            state: 'present'
            unsafe_writes: false

        - name: 'END | Read The Restored File'
          check_mode: false
          register: '__kernel_backslash_restored__'

          ansible.builtin.slurp:
            armor: true
            src: "{{ __kernel_backslash_dir__.path }}/scratch.conf"

        - name: 'END | Assert The Restored Bytes Equal The Original'

          ansible.builtin.assert:
            fail_msg: >-
              Restoration changed the text: {{ __kernel_backslash_restored__.content | b64decode
              }}
            quiet: true
            that:
              - >-
                (__kernel_backslash_restored__.content | b64decode) == (__lines__ | join(__nl__)
                ~ __nl__)

        # Keep the module arguments equal to the role's commenting task's as parsed; the loop is
        # this play's.
        - name: 'PROCESS | Comment Out Each Line Again'
          changed_when: false
          loop: >-
            {{ [__kernel_backslash_dir__.path ~ '/scratch.conf'] | product(__lines__) |
            map('list') | list }}
          loop_control: { label: "{{ item.1 }}" }

          ansible.builtin.lineinfile:
            backrefs: true
            backup: false
            create: false
            encoding: 'utf-8'
            firstmatch: false
            line: '# kernel-role-disabled: \g<0>'
            path: "{{ item.0 }}"
            regexp: "^{{ item.1 | regex_escape }}$"
            state: 'present'
            unsafe_writes: false

        # Keep the module arguments equal to the absent state's restoration task's as parsed; the
        # loop is this play's.
        - name: 'PROCESS | Restore Each Line As The Absent State Does'
          changed_when: false
          loop: >-
            {{ [__kernel_backslash_dir__.path ~ '/scratch.conf'] | product(__lines__) |
            map('list') | list }}
          loop_control: { label: "{{ item.1 }}" }

          ansible.builtin.lineinfile:
            backrefs: true
            backup: false
            create: false
            encoding: 'utf-8'
            firstmatch: false
            line: '\g<1>'
            path: "{{ item.0 }}"
            regexp: "^# kernel-role-disabled: ({{ item.1 | regex_escape }})$"
            state: 'present'
            unsafe_writes: false

        - name: 'END | Read The File The Absent Arguments Restored'
          check_mode: false
          register: '__kernel_backslash_absent__'

          ansible.builtin.slurp:
            armor: true
            src: "{{ __kernel_backslash_dir__.path }}/scratch.conf"

        - name: 'END | Assert The Absent Arguments Restore The Original Bytes'

          ansible.builtin.assert:
            fail_msg: >-
              The absent state's restoration changed the text: {{
              __kernel_backslash_absent__.content | b64decode }}
            quiet: true
            that:
              - >-
                (__kernel_backslash_absent__.content | b64decode) == (__lines__ | join(__nl__) ~
                __nl__)

      always:

        - name: 'PROCESS | Remove The Scratch Directory'
          changed_when: false
          when: (__kernel_backslash_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_backslash_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | List The Legacy File As A Read-Only Candidate When It Is A Live Symlink'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
  tasks:

    - name: 'PROCESS | Run The Candidate Expressions Over A Live And A Dangling Legacy Link'
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_legacy_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_legacy_'
            state: 'directory'
            suffix: ''

        - name: 'PROCESS | Write A Regular File'
          changed_when: false

          ansible.builtin.copy:
            backup: false
            content: "net.example.beta = 1\n"
            decrypt: true
            dest: "{{ __kernel_legacy_dir__.path }}/real.conf"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        - name: 'PROCESS | Link A Live And A Dangling Legacy Path'
          changed_when: false
          loop: [['live.conf', 'real.conf'], ['dangling.conf', 'missing.conf']]
          loop_control: { label: "{{ item.0 }}" }

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            dest: "{{ __kernel_legacy_dir__.path }}/{{ item.0 }}"
            follow: false
            force: true
            modification_time_format: '%Y%m%d%H%M.%S'
            recurse: false
            src: "{{ item.1 }}"
            state: 'link'
            unsafe_writes: false

        - name: 'BEGIN | Stat Each Link Itself'
          check_mode: false
          loop: ['live.conf', 'dangling.conf']
          loop_control: { label: "{{ item }}" }
          register: '__kernel_legacy_links__'

          ansible.builtin.stat:
            checksum_algorithm: 'sha1'
            follow: false
            get_attributes: false
            get_checksum: false
            get_mime: false
            get_selinux_context: false
            path: "{{ __kernel_legacy_dir__.path }}/{{ item }}"

        - name: 'BEGIN | Stat Each Link Through To Its Target'
          check_mode: false
          loop: ['live.conf', 'dangling.conf']
          loop_control: { label: "{{ item }}" }
          register: '__kernel_legacy_targets__'

          ansible.builtin.stat:
            checksum_algorithm: 'sha1'
            follow: true
            get_attributes: false
            get_checksum: false
            get_mime: false
            get_selinux_context: false
            path: "{{ __kernel_legacy_dir__.path }}/{{ item }}"

        # Keep the candidate expressions equal to the role's as parsed; the directory scans are
        # this play's and empty, and the legacy path is a candidate only for the live link.
        - name: 'END | Assert The Live Link Is A Read-Only Candidate And The Dangling One Is Not'
          loop: [['live.conf', true], ['dangling.conf', false]]
          loop_control: { label: "{{ item.0 }}" }
          vars:
            __kernel_sysctl_conf__: >-
              {{ __kernel_legacy_links__.results | selectattr('item', 'eq', item.0) | first }}
            __kernel_sysctl_conf_target__: >-
              {{ __kernel_legacy_targets__.results | selectattr('item', 'eq', item.0) | first }}
            __kernel_sysctl_files__: {files: []}
            __kernel_link_stats__: {results: []}
            __inside_re__: '^/etc/sysctl[.]d/[^/]+$'
            __own__: []
            __conflicts__: 'etc'
            __regular__: >-
              {{ __kernel_sysctl_files__.files | map(attribute='path') | select('match',
              __inside_re__) | list }}
            __editable__: >-
              {{ (__regular__ + (['/etc/sysctl.conf'] if (__kernel_sysctl_conf__.stat.exists and
              __kernel_sysctl_conf__.stat.isreg and not __kernel_sysctl_conf__.stat.islnk) else
              [])) | reject('in', __own__) | unique | sort }}
            __links__: >-
              {{ __kernel_link_stats__.results | default([], true) | selectattr('stat.exists') |
              selectattr('stat.isreg') | map(attribute='item') | select('match', __inside_re__) |
              reject('in', __own__) | list }}
            __legacy__: >-
              {{ ['/etc/sysctl.conf'] if (__kernel_sysctl_conf__.stat.islnk | default(false) and
              __kernel_sysctl_conf_target__.stat.exists and
              __kernel_sysctl_conf_target__.stat.isreg and __conflicts__ != 'none') else [] }}
            __candidates__: "{{ (__editable__ + __links__ + __legacy__) | unique | sort }}"

          ansible.builtin.assert:
            fail_msg: >-
              For {{ item.0 }} the candidates read {{ __candidates__ }} and the editable set {{
              __editable__ }}; a live legacy link is a read-only candidate, a dangling one
              nothing.
            quiet: true
            that:
              - (__candidates__ == ['/etc/sysctl.conf']) == item.1
              - __editable__ == []

      always:

        - name: 'PROCESS | Remove The Scratch Directory'
          changed_when: false
          when: (__kernel_legacy_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_legacy_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | Name Exactly The Unsafe Parents And Targets With The Guard'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
  tasks:

    - name: 'PROCESS | Run The Guard Expressions Against A Scratch Tree'
      vars:
        __guard_dirs__: >-
          {{ [__kernel_guard_dir__.path ~ '/record', __kernel_guard_dir__.path ~ '/record-link']
          }}
        __guard_files__: >-
          {{ [__kernel_guard_dir__.path ~ '/link/x.conf', __kernel_guard_dir__.path ~
          '/real/x.conf'] }}
      block:

        - name: 'BEGIN | Create A Scratch Directory'
          changed_when: false
          check_mode: false
          register: '__kernel_guard_dir__'

          ansible.builtin.tempfile:
            prefix: 'ansible_kernel_guard_'
            state: 'directory'
            suffix: ''

        - name: 'PROCESS | Create A Real Directory'
          changed_when: false

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            mode: '0700'
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_guard_dir__.path }}/real"
            recurse: false
            state: 'directory'
            unsafe_writes: false

        - name: 'PROCESS | Write A Regular File In It'
          changed_when: false

          ansible.builtin.copy:
            backup: false
            content: "net.example.beta = 1\n"
            decrypt: true
            dest: "{{ __kernel_guard_dir__.path }}/real/x.conf"
            follow: false
            force: true
            mode: '0600'
            remote_src: false
            unsafe_writes: false

        - name: 'PROCESS | Link A Second Parent To The Real Directory'
          changed_when: false

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            dest: "{{ __kernel_guard_dir__.path }}/link"
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            recurse: false
            src: 'real'
            state: 'link'
            unsafe_writes: false

        - name: 'PROCESS | Link A Directory Target To The Real Directory'
          changed_when: false

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            dest: "{{ __kernel_guard_dir__.path }}/record-link"
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            recurse: false
            src: 'real'
            state: 'link'
            unsafe_writes: false

        - name: 'PROCESS | Create A Real Directory Target'
          changed_when: false

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            mode: '0700'
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_guard_dir__.path }}/record"
            recurse: false
            state: 'directory'
            unsafe_writes: false

        # Keep the stat task equal to the role's, and the guard's variables equal to its
        # refusal's, as parsed; the two directory and two file targets are this play's.
        - name: 'BEGIN | Stat Every Path This Run May Change And Its Parents'
          check_mode: false
          loop: >-
            {{ ((__targets__ | map('dirname') | list) + (__targets__ | map('dirname') |
            map('dirname') | list) + (__targets__ | map('dirname') | map('dirname') |
            map('dirname') | list) + (__targets__ | map('dirname') | map('dirname') |
            map('dirname') | map('dirname') | list) + __targets__) | reject('eq', '/') | unique |
            sort }}
          loop_control: { label: "{{ item }}" }
          register: '__kernel_guard__'
          vars:
            __targets__: "{{ __guard_dirs__ + __guard_files__ }}"

          ansible.builtin.stat:
            checksum_algorithm: 'sha1'
            follow: false
            get_attributes: false
            get_checksum: false
            get_mime: false
            get_selinux_context: false
            path: "{{ item }}"

        - name: 'END | Assert The Expressions Name Exactly The Unsafe Parents And Targets'
          vars:
            __targets__: "{{ __guard_dirs__ + __guard_files__ }}"
            __found__: >-
              {{ __kernel_guard__.results | default([], true) | selectattr('stat.exists') | list
              }}
            __parents__: "{{ __found__ | rejectattr('item', 'in', __targets__) | list }}"
            __dirs__: "{{ __found__ | selectattr('item', 'in', __guard_dirs__) | list }}"
            __files__: "{{ __found__ | selectattr('item', 'in', __guard_files__) | list }}"
            __bad_parents__: >-
              {{ (__parents__ | rejectattr('stat.isdir') | map(attribute='item') | list) +
              (__parents__ | selectattr('stat.islnk') | map(attribute='item') | list) +
              (__parents__ | rejectattr('stat.pw_name', 'eq', 'root') | map(attribute='item') |
              list) }}
            __bad_targets__: >-
              {{ (__dirs__ | rejectattr('stat.isdir') | map(attribute='item') | list) + (__dirs__
              | selectattr('stat.islnk') | map(attribute='item') | list) + (__dirs__ |
              rejectattr('stat.pw_name', 'eq', 'root') | map(attribute='item') | list) +
              (__files__ | rejectattr('stat.isreg') | map(attribute='item') | list) + (__files__
              | selectattr('stat.islnk') | map(attribute='item') | list) }}
            __link__: "{{ __kernel_guard_dir__.path ~ '/link' }}"
            __real__: "{{ __kernel_guard_dir__.path ~ '/real' }}"
            __record__: "{{ __kernel_guard_dir__.path ~ '/record' }}"
            __record_link__: "{{ __kernel_guard_dir__.path ~ '/record-link' }}"

          # The expressions list a path once per reason. A symlink carries exactly two reasons
          # (not a directory, a symlink) beyond its real twin, whose only possible reason is an
          # owner other than root, as when the tests run unprivileged.
          ansible.builtin.assert:
            fail_msg: >-
              The guard expressions named {{ __bad_parents__ }} as unsafe parents and {{
              __bad_targets__ }} as unsafe targets over a tree whose only defects are the
              symlinked parent {{ __link__ }} and the symlinked directory target {{
              __record_link__ }}.
            quiet: true
            that:
              - >-
                (__bad_parents__ | select('eq', __link__) | list | length) == (__bad_parents__ |
                select('eq', __real__) | list | length) + 2
              - (__bad_parents__ | select('eq', __real__) | list | length) <= 1
              - >-
                (__bad_targets__ | select('eq', __record_link__) | list | length) ==
                (__bad_targets__ | select('eq', __record__) | list | length) + 2
              - (__bad_targets__ | select('eq', __record__) | list | length) <= 1
              - (__bad_targets__ | reject('in', [__record__, __record_link__]) | list) == []

