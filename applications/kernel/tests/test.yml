# ============================================================================================= #
# File: '{{ role_path }}/tests/test.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Localhost regression tests for the kernel role's contract and readbacks. Coverage and the
# command to run them are documented in README.md under Verification.
#
# ============================================================================================= #

- name: 'PLAY | Accept A Conforming Configuration'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    state: 'present'
    ansible_become: false
    ansible_facts:
      os_family: 'RedHat'
    kernel_running:
      package_manager:
        'RedHat':
          name: ['kernel']
      sysctl:
        conflicts: 'etc'
      modules:
        unload: true
      templates:
        '/etc/sysctl.d/90-example.conf':
          template: 'sysctl.conf.j2'
          file:
            path: '/etc/sysctl.d/90-example.conf'
            owner: 'root'
            group: 'root'
            mode: '0644'
          settings:
            net.example.beta: 'sample'
            kernel.example_alpha: 7
        '/etc/modprobe.d/example.conf':
          template: 'modprobe.conf.j2'
          file:
            path: '/etc/modprobe.d/example.conf'
            owner: 'root'
            group: 'root'
            mode: '0644'
          settings:
            disabled: ['example_two', 'example-one']
  tasks:

    - name: 'PROCESS | Validate The Conforming Configuration'

      ansible.builtin.include_role:
        allow_duplicates: true
        defaults_from: 'main'
        handlers_from: 'main'
        name: 'kernel'
        public: false
        rescuable: true
        rolespec_validate: false
        tasks_from: 'validate.yml'

- name: 'PLAY | Accept False Sections In The Absent State'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    state: 'absent'
    ansible_become: false
    ansible_facts:
      os_family: 'RedHat'
    kernel_running:
      package_manager:
        'RedHat':
          name: ['kernel']
      sysctl: false
      modules: false
      templates: false
  tasks:

    - name: 'PROCESS | Validate An Absent Configuration Whose Sections The State Will Not Read'

      ansible.builtin.include_role:
        allow_duplicates: true
        defaults_from: 'main'
        handlers_from: 'main'
        name: 'kernel'
        public: false
        rescuable: true
        rolespec_validate: false
        tasks_from: 'validate.yml'

