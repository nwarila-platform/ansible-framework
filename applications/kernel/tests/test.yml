        # The raw object is asserted before any value is used: exactly three members, version
        # the integer 1, destinations direct *.conf children of the two drop-in directories,
        # lines as [path, text] pairs with an in-scope path and single-line control-free text.
        - name: 'BEGIN | Validate The Record Before Any Value Is Used'
          when: __kernel_manifest_stat__.stat.exists | default(false)
          block:

            - name: 'BEGIN | Assert The Record Schema'
              vars:
                __record__: "{{ __kernel_manifest_raw__.content | b64decode | from_json }}"
                __dests__: "{{ __record__.destinations if __record__ is mapping else [] }}"
                __lines__: "{{ __record__.lines if __record__ is mapping else [] }}"
                __dest_re__: '^/etc/(sysctl|modprobe)[.]d/[^/\x00-\x1f]+[.]conf$'
                __conf_re__: '^/etc/sysctl[.]conf$'
                __d_re__: >-
                  ^/(etc|run|usr/local/lib|usr/lib|lib)/sysctl[.]d/[^/\x00-\x1f]+[.]conf$
                __bad_dests__: >-
                  {{ (__dests__ | reject('string') | list) + (__dests__ | select('string') |
                  reject('match', __dest_re__) | list) }}
                __bad_lines__: >-
                  {{ (__lines__ | reject('sequence') | list) + (__lines__ | select('string') |
                  list) + (__lines__ | select('mapping') | list) + (__lines__ |
                  select('sequence') | reject('string') | reject('mapping') | rejectattr('0',
                  'string') | list) + (__lines__ | select('sequence') | reject('string') |
                  reject('mapping') | selectattr('0', 'string') | rejectattr('1', 'string') |
                  list) + (__lines__ | select('sequence') | reject('string') | reject('mapping')
                  | selectattr('0', 'string') | selectattr('1', 'string') | rejectattr('0',
                  'match', __conf_re__) | rejectattr('0', 'match', __d_re__) | list) + (__lines__
                  | select('sequence') | reject('string') | reject('mapping') | selectattr('0',
                  'string') | selectattr('1', 'string') | selectattr('1', 'search', '[\r\n\x00]')
                  | list) }}

              ansible.builtin.assert:
                fail_msg: >-
                  Refusing to use /var/lib/ansible-kernel/manifest.json: the record must hold
                  exactly version, destinations and lines (observed members {{ __record__ | list
                  if __record__ is mapping else __record__ | type_debug }}), version must be the
                  integer 1 (observed {{ __record__.version | default('absent') }}), destinations
                  must be direct .conf children of /etc/sysctl.d or /etc/modprobe.d (refused {{
                  __bad_dests__ }}) and lines must be [path, text] pairs with an in-scope path
                  and a single-line text without control bytes (refused {{ __bad_lines__ }}).
                  Repair or remove the record by hand.
                quiet: true
                that:
                  - __record__ is mapping
                  - (__record__ | list | sort) == ['destinations', 'lines', 'version']
                  - __record__.version is integer
                  - __record__.version is not boolean
                  - __record__.version == 1
                  - __dests__ is sequence
                  - __dests__ is not string
                  - __dests__ is not mapping
                  - __lines__ is sequence
                  - __lines__ is not string
                  - __lines__ is not mapping
                  - (__bad_dests__ | length) == 0
                  - (__bad_lines__ | length) == 0
                  - (__lines__ | select('sequence') | reject('string') | reject('mapping')
                     | map('length') | reject('eq', 2) | list | length) == 0

          rescue:

            - name: 'BEGIN | Refuse An Unreadable Record'

              ansible.builtin.fail:
                msg: >-
                  Refusing to continue: /var/lib/ansible-kernel/manifest.json could not be
                  validated: {{ ansible_failed_result.msg | default('kernel operation failed',
                  true) }}. Repair or remove the record by hand.

        - name: 'END | Fail Because The Validation Accepted Text That Is Not JSON'

          ansible.builtin.fail:
            msg: The record validation accepted a record with text that is not json.

      rescue:

        - name: 'END | Assert The Validation Refused Text That Is Not JSON'

          ansible.builtin.assert:
            fail_msg: The record validation said {{ ansible_failed_result.msg | default('') }}.
            quiet: true
            that:
              - "'could not be validated' in ansible_failed_result.msg"

- name: 'PLAY | Render The Same Record Bytes From Both Phases'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    __pending__:
      version: 1
      destinations: ['/etc/modprobe.d/example.conf', '/etc/sysctl.d/90-example.conf']
      lines: [['/etc/sysctl.conf', 'net.example.beta = 0']]
    __record__:
      version: 1
      destinations: ['/etc/modprobe.d/example.conf', '/etc/sysctl.d/90-example.conf']
      lines: [['/etc/sysctl.conf', 'net.example.beta = 0']]
    # Keep both renderings equal to the content of the role's two record writes as parsed; the
    # records are this play's.
    __pending_bytes__: "{{ __pending__ | to_nice_json(indent=2) }}\n"
    __record_bytes__: "{{ __record__ | to_nice_json(indent=2) }}\n"
  tasks:

    - name: 'END | Assert The Two Record Expressions Render Identical Bytes'

      ansible.builtin.assert:
        fail_msg: >-
          The pending and final record expressions differ: {{ __pending_bytes__ | length }}
          against {{ __record_bytes__ | length }} bytes; a converged host would rewrite its
          record on every run.
        quiet: true
        that:
          - __pending_bytes__ == __record_bytes__
          - __pending_bytes__[-1:] == "\n"
          - __pending_bytes__[-2:] != " \n"

- name: 'PLAY | Name Exactly The Keys Whose Observed Value Differs'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    __keys__: ['a.one', 'b.two', 'c.three', 'd.four', 'e.five']
    __observed__: ['0', '1', '2', 'x', 'X']
    __expected__: ['0', '2', '1', 'x', 'x']
    # Keep these three expressions equal to END's as parsed; the keys and values are this play's.
    __differs__: >-
      {{ __observed__ | zip(__expected__) | map('unique', case_sensitive=true) | map('length') |
      list }}
    __mismatched__: >-
      {{ __keys__ | zip(__differs__) | selectattr('1', 'eq', 2) | map(attribute='0') | list }}
    __report__: >-
      {{ __keys__ | zip(__observed__, __expected__) | selectattr('0', 'in', __mismatched__) |
      map('join', ' ') | list }}
  tasks:

    - name: 'END | Assert The Mismatch Expression Names The Three Differing Keys'

      ansible.builtin.assert:
        fail_msg: >-
          The END comparison expression is wrong: mismatched {{ __mismatched__ }}, report {{
          __report__ }}.
        quiet: true
        that:
          - __mismatched__ == ['b.two', 'c.three', 'e.five']
          - __report__ == ['b.two 1 2', 'c.three 2 1', 'e.five X x']
