        - name: 'PROCESS | Remove The Scratch Tree'
          changed_when: false
          when: (__kernel_guard_dir__.path | default('') | length) > 0

          ansible.builtin.file:
            access_time_format: '%Y%m%d%H%M.%S'
            follow: true
            force: false
            modification_time_format: '%Y%m%d%H%M.%S'
            path: "{{ __kernel_guard_dir__.path }}"
            recurse: false
            state: 'absent'
            unsafe_writes: false

- name: 'PLAY | Judge Each Disabled Module By Its Soft Dependencies And Dry Run'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    __disabled__: ['example_one', 'example_two', 'example_three', 'example_four', 'example_five',
                   'example_six', 'example_seven', 'example_eight', 'example_nine',
                   'example_ten', 'example_eleven']
    # Shapes kmod prints: dependencies before install (measured on the stock AMIs); a post and a
    # pre softdep's own insmod, options after an insmod and an install line, and a dependency's
    # install command (measured, kmod 31); the rest are constructed failures [INV-06].
    __kernel_resolution__:
      results:
        - item: 'example_one'
          stdout_lines: ['install /bin/false ']
        - item: 'example_two'
          stdout_lines: ['insmod /lib/modules/k/x/example_dep.ko.xz ', 'install /bin/false ']
        - item: 'example_three'
          stdout_lines: ['insmod /lib/modules/k/x/example_dep.ko.xz ', 'install /bin/true ']
        - item: 'example_four'
          stdout_lines: ['insmod /lib/modules/k/x/example_four.ko.xz ']
        - item: 'example_five'
          stdout_lines: []
        - item: 'example_six'
          stdout_lines: ['insmod /lib/modules/k/x/example_six.ko.zst ', 'install /bin/false ']
        - item: 'example_seven'
          stdout_lines: ['install /bin/false ', 'insmod /lib/modules/k/x/example_seven.ko.zst ']
        - item: 'example_eight'
          stdout_lines: ['insmod /lib/modules/k/x/example-eight.ko.xz ', 'install /bin/false ']
        - item: 'example_nine'
          stdout_lines: ['insmod /lib/modules/k/x/example_dep.ko.xz ',
                         'insmod /lib/modules/k/x/example_nine.ko.zst example_param=1 ',
                         'install /bin/false ']
        - item: 'example_ten'
          stdout_lines: ['insmod /lib/modules/k/x/example_dep.ko.xz ',
                         'install /bin/false example_param=1 ']
        - item: 'example_eleven'
          stdout_lines: ['insmod /lib/modules/k/x/example_dep.ko.xz ',
                         'install /sbin/modprobe -C /k/empty example_eleven ',
                         'install /bin/false ']
    __kernel_showconfig__:
      stdout_lines:
        - 'blacklist example_one'
        - 'softdep example_one '
        - 'softdep other_module pre: example_two'
  tasks:

    - name: 'PROCESS | Run The Dry-Run Judgement Over Two Passing And Nine Failing Shapes'
      block:

        # END accepts a disabled module's dry run only as insmod lines for other modules, options
        # aside, then exactly install /bin/false; anything else is refused, whether or not kmod
        # would load the module [INV-06].
        - name: 'END | Assert Kmod Would Run False For Each Disabled Module'
          loop: "{{ __kernel_resolution__.results | default([], true) }}"
          loop_control: { label: "{{ __kernel_module__.item }}", loop_var: '__kernel_module__' }
          vars:
            __lines__: >-
              {{ __kernel_module__.stdout_lines | default([], true) | map('trim') | reject('eq',
              '') | list }}
            __last__: "{{ __lines__ | last | default('') }}"
            __other_actions__: "{{ __lines__[:-1] | reject('match', '^insmod[\x20\t]') | list }}"
            __inserted__: >-
              {{ __lines__ | select('match', '^insmod[\x20\t]') | map('regex_replace',
              '^insmod[\x20\t]+[^\x20\t]*/', '') | map('regex_replace', '[\x20\t].*$', '') |
              map('regex_replace', '[.]ko([.][a-z]+)?$', '') | map('replace', '-', '_') | list }}
          when: (__disabled__ | length) > 0

          ansible.builtin.assert:
            fail_msg: >-
              kmod's dry run of {{ __kernel_module__.item }} ends in '{{ __last__ }}', inserts {{
              __inserted__ }} and runs {{ __other_actions__ }} before its last line. END accepts
              only insmod lines for other modules, options aside, followed by exactly install
              /bin/false; an earlier-sorting install directive, a softdep entry, a dependency's
              install command or options set for the module produce anything else [INV-06].
            quiet: true
            that:
              - __last__ == 'install /bin/false'
              - (__other_actions__ | length) == 0
              - __kernel_module__.item not in __inserted__

        - name: 'END | Fail Because The Judgement Accepted Every Shape'

          ansible.builtin.fail:
            msg: The dry-run judgement accepted shapes that keep a disabled module loadable.

      rescue:

        - name: 'END | Assert Exactly The Nine Failing Shapes Were Refused'
          vars:
            __refused__: >-
              {{ ansible_failed_result.results | default([], true) | selectattr('failed',
              'defined') | selectattr('failed') | map(attribute='__kernel_module__.item') | sort
              }}

          ansible.builtin.assert:
            fail_msg: The dry-run judgement refused {{ __refused__ }}.
            quiet: true
            that:
              - >-
                __refused__ == ['example_eight', 'example_eleven', 'example_five',
                'example_four', 'example_nine', 'example_seven', 'example_six', 'example_ten',
                'example_three']

    # Keep these copies equal to the role's task as parsed; divergence would leave END untested.
    - name: 'PROCESS | Run The Softdep Refusal Over An Empty And An Unrelated Softdep'
      block:

        # A softdep entry listing modules replaces a module's install command whenever kmod
        # acts on it; END refuses one keyed by a disabled module's exact name whether or not
        # kmod acts on it now, and leaves a glob-keyed one to the dry run below [INV-06].
        - name: 'END | Refuse A Soft Dependency On A Disabled Module'
          vars:
            __softdeps__: >-
              {{ __kernel_showconfig__.stdout_lines | default([], true) | select('match',
              '^softdep[\x20\t]+[^\x20\t]+[\x20\t]+(pre|post):') | map('regex_replace',
              '^softdep[\x20\t]+([^\x20\t]+).*$', '\1') | map('replace', '-', '_') | unique |
              sort }}
            __overridden__: "{{ __softdeps__ | select('in', __disabled__) | list }}"
          when: (__disabled__ | length) > 0

          ansible.builtin.assert:
            fail_msg: >-
              END refuses the softdep entries listing modules for {{ __overridden__ }}: such an
              entry replaces a module's install command whenever kmod acts on it, whether or not
              it does on this host now. Remove the entry, or stop disabling the module [INV-06].
            quiet: true
            that:
              - (__overridden__ | length) == 0

    - name: 'PROCESS | Run The Softdep Refusal Over A Softdep On A Disabled Module'
      vars:
        __kernel_showconfig__:
          stdout_lines:
            - 'blacklist example_one'
            - 'softdep example-one post: example_two'
            - 'softdep other_module pre: example_two'
      block:

        # A softdep entry listing modules replaces a module's install command whenever kmod
        # acts on it; END refuses one keyed by a disabled module's exact name whether or not
        # kmod acts on it now, and leaves a glob-keyed one to the dry run below [INV-06].
        - name: 'END | Refuse A Soft Dependency On A Disabled Module'
          vars:
            __softdeps__: >-
              {{ __kernel_showconfig__.stdout_lines | default([], true) | select('match',
              '^softdep[\x20\t]+[^\x20\t]+[\x20\t]+(pre|post):') | map('regex_replace',
              '^softdep[\x20\t]+([^\x20\t]+).*$', '\1') | map('replace', '-', '_') | unique |
              sort }}
            __overridden__: "{{ __softdeps__ | select('in', __disabled__) | list }}"
          when: (__disabled__ | length) > 0

          ansible.builtin.assert:
            fail_msg: >-
              END refuses the softdep entries listing modules for {{ __overridden__ }}: such an
              entry replaces a module's install command whenever kmod acts on it, whether or not
              it does on this host now. Remove the entry, or stop disabling the module [INV-06].
            quiet: true
            that:
              - (__overridden__ | length) == 0

        - name: 'END | Fail Because The Softdep Refusal Accepted It'

          ansible.builtin.fail:
            msg: The softdep refusal accepted a softdep that names a disabled module.

      rescue:

        - name: 'END | Assert The Refusal Named Only The Overridden Module'

          ansible.builtin.assert:
            fail_msg: The softdep refusal said {{ ansible_failed_result.msg | default('') }}.
            quiet: true
            that:
              - "'example_one' in ansible_failed_result.msg"
              - "'other_module' not in ansible_failed_result.msg"

- name: 'PLAY | Refuse A Disabled Name That Resolves To Another Module'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    # Shapes modprobe --resolve-alias prints: the name, a hyphenated spelling, nothing for an
    # absent module, an alias's target and two targets (measured, kmod 25, 28 and 31) [INV-04].
    __kernel_aliases__:
      results:
        - { item: 'example_one', stdout_lines: ['example_one'] }
        - { item: 'example_two', stdout_lines: ['example-two'] }
        - { item: 'example_three', stdout_lines: [] }
        - { item: 'example_four', stdout_lines: ['other_module'] }
        - { item: 'example_five', stdout_lines: ['example_five', 'other_module'] }
  tasks:

    # Keep this copy equal to the role's task as parsed; divergence would leave BEGIN untested.
    - name: 'PROCESS | Run The Alias Refusal Over Three Accepted And Two Redirected Names'
      block:

        # A declared name kmod resolves to another module would leave that module governed by
        # nothing the role writes, so it is refused before any change [INV-04].
        - name: 'BEGIN | Refuse A Disabled Name That Resolves To Another Module'
          loop: "{{ __kernel_aliases__.results | default([], true) }}"
          loop_control: { label: "{{ __kernel_alias__.item }}", loop_var: '__kernel_alias__' }
          vars:
            __resolved__: >-
              {{ __kernel_alias__.stdout_lines | default([], true) | map('trim') | reject('eq',
              '') | map('replace', '-', '_') | list }}

          ansible.builtin.assert:
            fail_msg: >-
              kmod resolves the disabled name {{ __kernel_alias__.item }} to {{ __resolved__ }},
              so the role's install and blacklist lines for that name would not govern the module
              kmod loads. Declare the module name kmod resolves it to instead [INV-04].
            quiet: true
            that:
              - (__resolved__ | reject('eq', __kernel_alias__.item) | list | length) == 0

        - name: 'END | Fail Because The Refusal Accepted Every Name'

          ansible.builtin.fail:
            msg: The alias refusal accepted names that kmod resolves to another module.

      rescue:

        - name: 'END | Assert Exactly The Two Redirected Names Were Refused'
          vars:
            __refused__: >-
              {{ ansible_failed_result.results | default([], true) | selectattr('failed',
              'defined') | selectattr('failed') | map(attribute='__kernel_alias__.item') | sort
              }}

          ansible.builtin.assert:
            fail_msg: The alias refusal refused {{ __refused__ }}.
            quiet: true
            that:
              - __refused__ == ['example_five', 'example_four']

- name: 'PLAY | Accept A Valid Record And Refuse Malformed Ones'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    ansible_become: false
    __kernel_manifest_stat__: { stat: { exists: true } }
  tasks:

    # Keep each validation block equal to the role's as parsed; the records are this play's.
    - name: 'PROCESS | Validate A Well-Formed Record'
      vars:
        __kernel_manifest_raw__: { content: "{{ __fixture__ | to_json | b64encode }}" }
        __fixture__:
          version: 1
          destinations: ['/etc/sysctl.d/99-example.conf']
          lines: [['/etc/sysctl.conf', 'net.example.beta = 0']]
      block:

        # The raw object is asserted before any value is used: exactly three members, version
        # the integer 1, destinations direct *.conf children of the two drop-in directories,
        # lines as [path, text] pairs with an in-scope path and single-line control-free text.
        - name: 'BEGIN | Validate The Record Before Any Value Is Used'
          when: __kernel_manifest_stat__.stat.exists | default(false)
          block:

            - name: 'BEGIN | Assert The Record Schema'
              vars:
                __record__: "{{ __kernel_manifest_raw__.content | b64decode | from_json }}"
                __dests__: "{{ __record__.destinations if __record__ is mapping else [] }}"
                __lines__: "{{ __record__.lines if __record__ is mapping else [] }}"
                __dest_re__: '^/etc/(sysctl|modprobe)[.]d/[^/\x00-\x1f]+[.]conf$'
                __conf_re__: '^/etc/sysctl[.]conf$'
