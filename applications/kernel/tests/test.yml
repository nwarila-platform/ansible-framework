# ============================================================================================= #
# File: '{{ role_path }}/tests/test.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Localhost tests of the contract, the templates, the guard expressions and the END comparison,
# without root: one conforming configuration is accepted, four absent-state configurations whose
# unread sections are malformed are accepted, twenty-six malformed present-state ones are refused
# with their cause, both templates render to the expected bytes and the reload gate's rendering
# expression matches them, find lists a symlink only under the link type, hidden files included,
# the hit pairs are built from per-file grep results over a space-named, a colon-named and a
# hidden file, the legacy sysctl directory is listed only as a distinct real directory, the guard
# expressions name exactly a symlinked parent, both record phases render identical bytes, the
# duplicate and marked-line refusals are exact for names and values holding any byte the contract
# admits, commenting and restoration preserve backslash sequences, the legacy file is a read-only
# candidate only as a live symlink, and the mismatch expression names exactly the keys that
# differ. Run from the repository root: ansible-playbook -i applications/kernel/tests/inventory
# applications/kernel/tests/test.yml.
#
# ============================================================================================= #

- name: 'PLAY | Accept A Conforming Configuration'
  hosts: 'localhost'
  connection: 'local'
  gather_facts: false
  vars:
    state: 'present'
    ansible_become: false
    ansible_facts:
      os_family: 'RedHat'
    kernel_running:
      package_manager:
        'RedHat':
          name: ['kernel']
      sysctl:
        conflicts: 'etc'
      modules:
        unload: true
      templates:
        '/etc/sysctl.d/90-example.conf':
          template: 'sysctl.conf.j2'
          file:
            path: '/etc/sysctl.d/90-example.conf'
            owner: 'root'
            group: 'root'
            mode: '0644'
          settings:
            net.example.beta: 'sample'
            kernel.example_alpha: 7
        '/etc/modprobe.d/example.conf':
          template: 'modprobe.conf.j2'
          file:
            path: '/etc/modprobe.d/example.conf'
            owner: 'root'
            group: 'root'
            mode: '0644'
          settings:
            disabled: ['example_two', 'example-one']
  tasks:

    - name: 'PROCESS | Validate The Conforming Configuration'

      ansible.builtin.include_role:
        allow_duplicates: true
        defaults_from: 'main'
        handlers_from: 'main'
        name: 'kernel'
        public: false
        rescuable: true
        rolespec_validate: false
        tasks_from: 'validate.yml'

