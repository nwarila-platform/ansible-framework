---
# =============================================================================
# Pre-Commit Hook Configuration
# =============================================================================
# Run locally:  pre-commit run --all-files
# Install hook: pre-commit install
# Update revs:  pre-commit autoupdate
#
# Stages: commit (default), push, manual
# =============================================================================

# Minimum pre-commit version required
minimum_pre_commit_version: '3.0.0'

repos:

  # ---------------------------------------------------------------------------
  # General Hygiene (pre-commit-hooks)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Remove trailing whitespace on all lines
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']

      # Ensure files end with a single newline
      - id: end-of-file-fixer

      # Normalize line endings to LF
      - id: mixed-line-ending
        args: ['--fix=lf']

      # Validate YAML syntax
      # --unsafe: allows !vault and !unsafe Ansible tags
      - id: check-yaml
        args: ['--unsafe']

      # Block commits with unresolved merge conflict markers
      - id: check-merge-conflict

      # Prevent accidentally committing large binaries
      - id: check-added-large-files
        args: ['--maxkb=500']

      # Detect private keys before they leave the workstation
      - id: detect-private-key

      # Ensure JSON files are valid and consistently formatted
      - id: check-json

      # Prevent committing directly to the main branch
      - id: no-commit-to-branch
        args: ['--branch=main']

  # ---------------------------------------------------------------------------
  # YAML Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['--config-file=.yamllint.yml']

  # ---------------------------------------------------------------------------
  # Ansible Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        # v26.8.0's hook manifest pins language_version python3.14, which neither the
        # CI runner nor developer machines are guaranteed to have; 3.12 is what the
        # requirements-based CI lint jobs prove this tree against.
        language_version: python3.12
        additional_dependencies:
          - ansible-core>=2.21.3,<2.22

  # ---------------------------------------------------------------------------
  # Conventional Commits
  # ---------------------------------------------------------------------------
  # Enforces commit message format: <type>(<scope>): <description>
  # Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build
  # Scope: role name (e.g., python3_pip, RedHat_Rocky_10) or 'framework'
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - test
          - chore
          - perf
          - ci
          - build
          - revert
