# Keys are the lower-case Linux ID and major release, or 'windows' and the Windows build.
os_bootstrap_role_map:
  rhel:
    '8': 'redhat_rocky_8'
    '9': 'redhat_rocky_9'
    '10': 'redhat_rocky_10'
  rocky:
    '8': 'redhat_rocky_8'
    '9': 'redhat_rocky_9'
    '10': 'redhat_rocky_10'
  windows:
    '14393': 'windows_server_2016'
    '17763': 'windows_server_2019'
    '20348': 'windows_server_2022'
    '26100': 'windows_server_2025'
