# ============================================================================================= #
# File: '{{ role_path }}/meta/main.yml'                                                         #
# --- [ Description ] ------------------------------------------------------------------------- #
# Role metadata for os_bootstrap. Description-only (style guide 8): NOT an enforcing            #
# argument spec.                                                                                #
#                                                                                               #
# The role dispatches and converges nothing, so it declares no dependencies: the role it        #
# selects is included at run time by name, which a static dependency cannot express.            #
# ============================================================================================= #
galaxy_info:

  role_name: 'os_bootstrap'
  namespace: 'ansible_framework'
  author: 'nwarila-platform'
  description: >-
    Selects and runs the bootstrap role for each host. Reads the host's identity without an
    inventory hint through POSIX and Windows raw probes, then routes by Linux distribution
    and major release or by Windows build. Refuses Windows workstations before including a
    server role. Includes the selected bootstrap entry point by bare name through roles_path
    and converges nothing of its own.

  license: 'MIT'
  min_ansible_version: '2.21'

  platforms:
    - name: 'EL'
      versions:
        - '8'
        - '9'
        - '10'
    - name: 'Windows'
      versions:
        - '2016'
        - '2019'
        - '2022'
        - '2025'

  galaxy_tags:
    - 'bootstrap'
    - 'dispatch'
    - 'osfamily'
    - 'provisioning'

allow_duplicates: false

dependencies: []
