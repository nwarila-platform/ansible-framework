# ============================================================================================= #
# File: '{{ role_path }}/tasks/main.yml'                                                        #
# --- [ Description ] ------------------------------------------------------------------------- #
# Reads the host's operating-system identity without an inventory hint, then runs the matching  #
# release-specific bootstrap entry point.                                                       #
#                                                                                               #
# Raw is the one primitive every target can run before bootstrap: stock EL8 may not have a      #
# usable Python, and fresh Windows SSH may still serve cmd.exe regardless of the configured     #
# module shell. The probes disable SSH TTY allocation so a failed POSIX command keeps its real  #
# return code. Windows workstations are refused here before a server role can mutate them.      #
# ============================================================================================= #

#region ------ [ Process: Bootstrap The Detected Operating System ] --------------------------- #

- name: 'PROCESS | Bootstrap The Detected Operating System'
  vars:
    __os_bootstrap_is_windows__: "{{ __os_bootstrap_posix_probe__ is failed }}"
    __os_bootstrap_probe__: >-
      {{ __os_bootstrap_windows_probe__
         if __os_bootstrap_is_windows__
         else __os_bootstrap_posix_probe__ }}
    __os_bootstrap_kind__: "{{ __os_bootstrap_probe__.stdout_lines[0] }}"
    __os_bootstrap_release__: "{{ __os_bootstrap_probe__.stdout_lines[1] }}"
    __os_bootstrap_role__: >-
      {{ os_bootstrap_role_map[
           'windows' if __os_bootstrap_is_windows__ else __os_bootstrap_kind__
         ][__os_bootstrap_release__] }}

  block:

  #region ------ [ Begin: Read The Release ] -------------------------------------------------- #

    - name: 'BEGIN | Read The Release'
      become: false
      check_mode: false
      vars:
        ansible_become: false
        ansible_ssh_use_tty: false

      block:
        - name: 'BEGIN | Read The POSIX Release'
          changed_when: false
          ignore_errors: true
          register: '__os_bootstrap_posix_probe__'

          ansible.builtin.raw: . /etc/os-release && printf '%s\n%s\n' "$ID" "${VERSION_ID%%.*}"

        - name: 'BEGIN | Read The Windows Release'
          changed_when: false
          register: '__os_bootstrap_windows_probe__'
          when: __os_bootstrap_posix_probe__ is failed

          ansible.builtin.raw: >-
            powershell.exe -NoProfile -NonInteractive -Command "(Get-CimInstance -ClassName
            Win32_OperatingSystem).ProductType; [Environment]::OSVersion.Version.Build"

  #endregion --- [ Begin: Read The Release ] -------------------------------------------------- #

  #region ------ [ Begin: Require A Windows Server ] ------------------------------------------ #

    - name: 'BEGIN | Require A Windows Server'
      when: __os_bootstrap_is_windows__

      ansible.builtin.assert:
        fail_msg: >-
          The host reports Windows product type {{ __os_bootstrap_kind__ }} and build
          {{ __os_bootstrap_release__ }}. os_bootstrap requires a Windows server.
        quiet: true
        that: __os_bootstrap_kind__ in ['2', '3']

  #endregion --- [ Begin: Require A Windows Server ] ------------------------------------------ #

  #region ------ [ Process: Run The Selected Bootstrap Role ] --------------------------------- #

    # Unguarded on purpose. A role named by the repository map must exist and ship bootstrap.yml;
    # include_role fails loudly if either framework invariant is broken.
    - name: 'PROCESS | Run The Selected Bootstrap Role'

      ansible.builtin.include_role:
        name: "{{ __os_bootstrap_role__ }}"
        tasks_from: 'bootstrap'

  #endregion --- [ Process: Run The Selected Bootstrap Role ] --------------------------------- #

#endregion --- [ Process: Bootstrap The Detected Operating System ] --------------------------- #
