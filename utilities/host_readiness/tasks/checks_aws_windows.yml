# ============================================================================================= #
# File: '{{ role_path }}/tasks/checks_aws_windows.yml'
# --- [ Description ] ------------------------------------------------------------------------ #
#
# The AWS + Windows precondition: a host answers its transport well before EC2Launch has finished
# provisioning it, and work done underneath sysprep is work done twice or not at all. A disk
# partitioned mid-provision, a computer name set before the image resets it, a service configured
# before the agent restarts it.
#
# 'raw', like everything else this role runs, and for the same reason: os_bootstrap has not run,
# so the shell OpenSSH serves is still cmd and a module would be wrapped for the wrong one.
#
# Invoked through powershell.exe explicitly so the command parses on BOTH shells the host may
# serve -- cmd on first boot, and PowerShell on every converge after os_bootstrap has flipped the
# DefaultShell, including the one that follows an operating-system swap.
#
# ============================================================================================= #
---

- name: 'Host Readiness | Wait For EC2Launch Provisioning To Complete'
  become: false
  changed_when: false
  check_mode: false

  ansible.builtin.raw: >-
    powershell -NoProfile -Command
    "& 'C:\Program Files\Amazon\EC2Launch\EC2Launch.exe' status -b"

# EC2Launch reporting 'complete' is not the same as the machine having finished starting. Measured
# on a Server 2025 image, 2026-09-11: the blocking status call returned in one second and the
# machine restarted itself a minute later -- winlogon, on behalf of SYSTEM, reason 'Operating
# System: Upgrade (Planned)'. Windows was finishing its own setup, and the agent's answer did not
# speak for that.
#
# A play that continues into those seconds configures a host that is about to vanish. It cost a
# converge: the domain join completed, its own restart completed, and the machine then went away
# under the following task. It went away QUIETLY, too -- SSH keepalives take ten minutes to call a
# dead connection dead, so a ninety-second event surfaced as an eleven-minute hang attributed to
# whichever task happened to be running.
#
# So the gate is the machine's own uptime rather than an agent's opinion of it: wait until the host
# has been up for a settle window with no restart pending, and treat a lost connection as the very
# thing being waited for instead of as a failure. ignore_unreachable plus a retry is what makes
# that survivable -- a host that reboots mid-check is unreachable for one attempt and answers the
# next.
#
# The servicing flag, RebootPending, does NOT on its own mean a restart is owed. Component-Based
# Servicing sets it when any servicing session starts and clears it when that session ends; it is a
# crash-safety mark, not a request. Measured on a Server 2025 image, 2026-09-16, with the flag and
# CBS.log watched through a whole converge: StartComponentCleanup -- idle component-store
# maintenance, overdue on any freshly launched image -- began at the host's first idle moment,
# held the flag for 1,465 seconds, and cleared it itself with S_OK and no restart. So a mark held
# while the Windows Modules Installer service runs is work in progress and does not hold this gate.
#
# A mark left behind with that service STOPPED is different: no session is running, so nothing will
# clear it but a restart, and neither will the Windows Update flag. Waiting on either only fails the
# run and leaves the restart for someone to do by hand. So the probe answers three ways -- 0
# settled, 1 still settling, 2 a restart is owed -- and an owed restart is performed, once, and
# the machine is waited for again. Restarting cannot interrupt servicing here: an owed restart is
# only ever reported while the service that does the servicing is stopped.
- name: 'Host Readiness | Settle The Machine, Restarting It Once If Windows Owes A Restart'
  vars:
    # Defined once so the wait before a restart and the wait after it can never ask different
    # questions. NO PowerShell VARIABLES, deliberately: the shell OpenSSH serves is cmd on first boot
    # and PowerShell after os_bootstrap flips DefaultShell, and under PowerShell the outer double
    # quotes INTERPOLATE, so a '$Name' inside them is expanded by the outer shell -- to nothing --
    # before the inner powershell ever sees it. Measured: a draft that used two variables reached the
    # host as "... -f , )", a parse error that consumed every retry.
    __host_readiness_settle_probe__: >-
      powershell -NoProfile -Command
      "if (((Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalSeconds -lt 90) { exit 1 }
      elseif (((Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending')
      -and ((Get-Service TrustedInstaller).Status -ne 'Running'))
      -or (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'))
      { exit 2 }
      else { exit 0 }"

  block:

    # Stops as soon as the machine is settled OR owes a restart: waiting longer cannot change an owed
    # restart. raw reports any non-zero exit as a failure, and 1 and 2 are answers here rather than
    # errors, so the result is read -- by the tasks below and the assert that closes the block --
    # instead of being allowed to stop the play on its own.
    - name: 'Host Readiness | Wait Until The Machine Has Stopped Restarting Itself'
      become: false
      changed_when: false
      check_mode: false
      delay: 20
      ignore_errors: true
      ignore_unreachable: true
      register: '__host_readiness_settled__'
      retries: 15
      until:
        - not (__host_readiness_settled__.unreachable | default(false))
        - (__host_readiness_settled__.rc | default(1)) in [0, 2]

      ansible.builtin.raw: '{{ __host_readiness_settle_probe__ }}'

    # 1115 and 1190 mean a shutdown is already in progress or scheduled: Windows was restarting itself
    # anyway, which is the outcome asked for. A dropped connection is the restart taking effect.
    - name: 'Host Readiness | Restart The Machine To Apply What Windows Owes'
      become: false
      changed_when: true
      failed_when: >-
        not (__host_readiness_restarted__.unreachable | default(false))
        and (__host_readiness_restarted__.rc | default(1)) not in [0, 1115, 1190]
      ignore_unreachable: true
      register: '__host_readiness_restarted__'
      when:
        - not (__host_readiness_settled__.unreachable | default(false))
        - (__host_readiness_settled__.rc | default(1)) == 2
        - host_readiness_restart_when_owed | bool
        - not ansible_check_mode

      ansible.builtin.raw: >-
        shutdown /r /t 5 /c "host_readiness: Windows reported a restart owed before configuration"

    # Longer than the first wait: servicing finishes its pending work during that boot, which is the
    # slowest boot a host has.
    - name: 'Host Readiness | Wait For The Machine To Return Settled'
      become: false
      changed_when: false
      check_mode: false
      delay: 20
      ignore_errors: true
      ignore_unreachable: true
      register: '__host_readiness_returned__'
      retries: 30
      until:
        - not (__host_readiness_returned__.unreachable | default(false))
        - (__host_readiness_returned__.rc | default(1)) == 0
      when: __host_readiness_restarted__ is changed

      ansible.builtin.raw: '{{ __host_readiness_settle_probe__ }}'

    # The one place this gate fails, so the reason it gives is always the real one. Check mode reports
    # an owed restart as the restart a real run would make, rather than failing over it.
    - name: 'Host Readiness | Require That The Machine Settled'
      vars:
        __settled_rc__: "{{ __host_readiness_settled__.rc | default(1) }}"
        __settled_lost__: "{{ __host_readiness_settled__.unreachable | default(false) }}"
        __restarted__: "{{ __host_readiness_restarted__ is changed }}"
      ansible.builtin.assert:
        fail_msg: >-
          '{{ inventory_hostname }}' is not ready to be configured:
          {% if __settled_lost__ | bool %}it never stayed reachable long enough to be checked.
          {% elif (__settled_rc__ | int) == 2 and not (host_readiness_restart_when_owed | bool) %}Windows
          owes a restart -- a servicing mark with the Windows Modules Installer stopped, or the Windows
          Update reboot flag -- and host_readiness_restart_when_owed is false, so it was not restarted.
          Restart the host, or allow the role to.
          {% elif __restarted__ | bool %}it was restarted once because Windows owed a restart, and did
          not settle afterwards. A restart owed again straight away needs a person rather than a loop;
          CBS.log names the servicing session that set the mark.
          {% else %}it was still restarting after every attempt.{% endif %}
          The System log's event 1074 names whatever restarted the machine, and why.
        quiet: true
        that:
          - >-
            (not (__settled_lost__ | bool) and (__settled_rc__ | int) == 0)
            or (not (__settled_lost__ | bool) and (__settled_rc__ | int) == 2
                and ansible_check_mode and (host_readiness_restart_when_owed | bool))
            or ((__restarted__ | bool)
                and not (__host_readiness_returned__.unreachable | default(false))
                and (__host_readiness_returned__.rc | default(1)) == 0)
