# ============================================================================================= #
# File: '{{ role_path }}/tasks/checks_aws_windows.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# The AWS + Windows precondition: a host answers its transport well before EC2Launch has finished
# provisioning it, and work done underneath sysprep is work done twice or not at all. A disk
# partitioned mid-provision, a computer name set before the image resets it, a service configured
# before the agent restarts it.
#
# 'raw', like everything else this role runs, and for the same reason: os_bootstrap has not run,
# so the shell OpenSSH serves is still cmd and a module would be wrapped for the wrong one.
#
# Invoked through powershell.exe explicitly so the command parses on BOTH shells the host may
# serve -- cmd on first boot, and PowerShell on every converge after os_bootstrap has flipped the
# DefaultShell, including the one that follows an operating-system swap.
#
# ============================================================================================= #

- name: 'PROCESS | Wait For EC2Launch Provisioning To Complete'
  become: false
  changed_when: false
  check_mode: false
  failed_when: (__host_readiness_ec2launch_status__.rc | default(-1)) not in [0, 1]
  register: '__host_readiness_ec2launch_status__'
  vars:
    __host_readiness_ec2launch_status_script__: |
      $wrapperExitCode = 255
      $ErrorActionPreference = 'Stop'
      try {
          & 'C:\Program Files\Amazon\EC2Launch\EC2Launch.exe' status -b
          if ($null -eq $LASTEXITCODE) {
              [Console]::Error.WriteLine(
                  'EC2Launch status invocation failed: no native exit code was supplied.'
              )
          }
          else {
              $wrapperExitCode = $LASTEXITCODE
          }
      }
      catch {
          [Console]::Error.WriteLine(
              ('EC2Launch status invocation failed: {0}' -f $_.Exception.Message)
          )
      }
      exit $wrapperExitCode

  ansible.builtin.raw: >-
    powershell -NoProfile -NonInteractive -EncodedCommand
    {{ __host_readiness_ec2launch_status_script__
       | ansible.builtin.b64encode(encoding='utf-16-le') }}

# Measured with EC2Launch 2.5.1 on Server 2025, 2026-10-17: a later boot can fail only because user
# data could not reach metadata while every other stage completes. The latest exact start record
# correlates state and a pre-existing .run-once because the agent can run more than once per boot.
# Acceptance is caller-controlled and needs PowerShell as the outer shell; cmd cannot carry the
# encoded probe.
- name: 'PROCESS | Inspect A Failed EC2Launch Run'
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: '__host_readiness_ec2launch_probe_result__'
  vars:
    __host_readiness_ec2launch_probe__: |
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'
      $stateDirectory = 'C:\ProgramData\Amazon\EC2Launch\state'
      $agentLogPath = 'C:\ProgramData\Amazon\EC2Launch\log\agent.log'

      try {
          $statePath = Join-Path -Path $stateDirectory -ChildPath 'previous-state.json'
          $stateFile = Get-Item -LiteralPath $statePath -ErrorAction Stop
          $lastBootUpTime = (
              Get-CimInstance -ClassName Win32_OperatingSystem -ErrorAction Stop
          ).LastBootUpTime.ToUniversalTime()

          $timestampPattern =
              '(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}Z)'
          $recordPattern = '\A' + $timestampPattern +
              ' (?<severity>Info|Warning|Error|Console): (?<message>.*)\z'
          $startPattern = '\A' + $timestampPattern +
              ' Info: EC2Launch Service starting\z'
          $logLines = @(Get-Content -LiteralPath $agentLogPath -ErrorAction Stop)
          $lastStart = -1
          $lastStartTimestamp = $null
          for ($index = 0; $index -lt $logLines.Count; $index++) {
              $startMatch = [regex]::Match([string]$logLines[$index], $startPattern)
              if ($startMatch.Success) {
                  $lastStart = $index
                  $lastStartTimestamp = $startMatch.Groups['timestamp'].Value
              }
          }
          if ($lastStart -lt 0) {
              throw 'agent.log has no EC2Launch service start marker'
          }

          $lastStartTime = [DateTime]::ParseExact(
              $lastStartTimestamp,
              "yyyy-MM-dd HH:mm:ss.fff'Z'",
              [System.Globalization.CultureInfo]::InvariantCulture,
              [System.Globalization.DateTimeStyles]::AssumeUniversal -bor
                  [System.Globalization.DateTimeStyles]::AdjustToUniversal
          )
          if ($lastStartTime -lt $lastBootUpTime) {
              throw 'the latest agent.log run predates the current boot'
          }
          if ($stateFile.LastWriteTimeUtc -lt $lastStartTime) {
              throw 'previous-state.json predates the latest agent.log run'
          }
          $runOncePath = Join-Path -Path $stateDirectory -ChildPath '.run-once'
          $runOncePredatesRun = (
              (Test-Path -LiteralPath $runOncePath -PathType Leaf) -and
              (Get-Item -LiteralPath $runOncePath -Force -ErrorAction Stop).LastWriteTimeUtc -lt
                  $lastStartTime
          )

          $document = Get-Content -LiteralPath $statePath -Raw -ErrorAction Stop |
              ConvertFrom-Json -ErrorAction Stop
          $stateProperty = $document.PSObject.Properties['state']
          if ($null -eq $stateProperty -or $null -eq $stateProperty.Value -or
              $stateProperty.Value -isnot [System.Array]) {
              throw 'previous-state.json state is not an array'
          }

          $stages = @($stateProperty.Value)
          $stageNames = [System.Collections.Generic.HashSet[string]]::new(
              [System.StringComparer]::Ordinal
          )
          foreach ($stageRecord in $stages) {
              if ($null -eq $stageRecord -or $stageRecord -isnot [PSCustomObject]) {
                  throw 'previous-state.json contains a non-object stage record'
              }
              $stageProperty = $stageRecord.PSObject.Properties['stage']
              $statusProperty = $stageRecord.PSObject.Properties['status']
              if ($null -eq $stageProperty -or $stageProperty.Value -isnot [string] -or
                  [string]::IsNullOrWhiteSpace($stageProperty.Value)) {
                  throw 'previous-state.json contains a stage without a string name'
              }
              if ($null -eq $statusProperty -or $statusProperty.Value -isnot [string] -or
                  [string]::IsNullOrWhiteSpace($statusProperty.Value)) {
                  throw ('previous-state.json stage {0} has no string status' -f
                      $stageProperty.Value)
              }
              if (-not $stageNames.Add($stageProperty.Value)) {
                  throw ('previous-state.json contains duplicate stage {0}' -f
                      $stageProperty.Value)
              }
          }

          $requiredStages = @(
              'sysprepSpecialize',
              'boot',
              'network',
              'preReady',
              'postReady'
          )
          foreach ($requiredStage in $requiredStages) {
              $stageMatches = @($stages | Where-Object { $_.stage -ceq $requiredStage })
              if ($stageMatches.Count -ne 1 -or $stageMatches[0].status -cne 'success') {
                  throw ('previous-state.json does not have one successful {0} stage' -f
                      $requiredStage)
              }
          }

          $otherNonSuccess = @(
              $stages |
                  Where-Object {
                      $_.stage -cne 'postReadyUserData' -and $_.status -cne 'success'
                  } |
                  ForEach-Object { [string]$_.stage }
          )
          if ($otherNonSuccess.Count -ne 0) {
              throw ('previous-state.json has other non-success stages: {0}' -f
                  ($otherNonSuccess -join ', '))
          }

          $userDataStages = @(
              $stages | Where-Object { $_.stage -ceq 'postReadyUserData' }
          )
          $userDataStatus = 'absent'
          if ($userDataStages.Count -eq 1) {
              $userDataStatus = [string]$userDataStages[0].status
              if ($userDataStatus -ceq 'success') {
                  throw 'postReadyUserData is successful'
              }
          }

          $currentRunLines = @($logLines | Select-Object -Skip ($lastStart + 1))
          $userDataFailureMessage =
              'Failing user data stage and running remaining stages: Failed to get user data'
          $userDataFailures = [System.Collections.Generic.List[string]]::new()
          $otherErrors = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $currentRunLines) {
              $recordMatch = [regex]::Match([string]$line, $recordPattern)
              if (-not $recordMatch.Success -or
                  $recordMatch.Groups['severity'].Value -cne 'Error') {
                  continue
              }

              $message = $recordMatch.Groups['message'].Value
              if ($message.StartsWith(
                      $userDataFailureMessage,
                      [System.StringComparison]::Ordinal
                  )) {
                  [void]$userDataFailures.Add([string]$line)
              }
              else {
                  [void]$otherErrors.Add([string]$line)
              }
          }
          if ($userDataFailures.Count -lt 1) {
              throw 'the current agent.log run has no user-data-stage failure'
          }
          if ($otherErrors.Count -ne 0) {
              throw 'the current agent.log run has another error'
          }

          [ordered]@{
              run_once = $runOncePredatesRun
              userdata_status = $userDataStatus
              other_non_success = [string[]]$otherNonSuccess
          } | ConvertTo-Json -Compress
      }
      catch {
          [Console]::Error.WriteLine(
              ('EC2Launch state probe failed: {0}' -f $_.Exception.Message)
          )
          exit 1
      }
  when:
    - (__host_readiness_ec2launch_status__.rc | default(-1)) == 1
    - host_readiness_ec2launch_accept_once_userdata_failure | bool

  ansible.builtin.raw: >-
    powershell -NoProfile -NonInteractive -EncodedCommand
    {{ __host_readiness_ec2launch_probe__
       | ansible.builtin.b64encode(encoding='utf-16-le') }}

- name: 'PROCESS | Require That EC2Launch Provisioned The Host'
  vars:
    __ec2launch_rc__: "{{ __host_readiness_ec2launch_status__.rc | default(-1) }}"
    __ec2launch_probe_rc__: >-
      {{ __host_readiness_ec2launch_probe_result__.rc | default(-1) }}
    __ec2launch_state__: >-
      {{ (__host_readiness_ec2launch_probe_result__.stdout
          | default('{}', true)
          | trim
          | ansible.builtin.from_json)
         if (__host_readiness_ec2launch_probe_result__.rc | default(-1) | int) == 0
         else {} }}
  ansible.builtin.assert:
    fail_msg: >-
      '{{ inventory_hostname }}' is not ready to be configured: EC2Launch {% if not
      (host_readiness_ec2launch_accept_once_userdata_failure | bool) %}reported failure and
      host_readiness_ec2launch_accept_once_userdata_failure is false.{% elif
      (__ec2launch_probe_rc__ | int) != 0 %}reported failure and its current-run state probe
      failed: {{ __host_readiness_ec2launch_probe_result__.stderr | default('no probe error')
      | trim }}.{% elif not (__ec2launch_state__.run_once | default(false) | bool) %}reported
      failure and .run-once was absent or was not written before the current run began.{% endif %}
      Inspect
      C:\ProgramData\Amazon\EC2Launch\log\agent.log.
    quiet: true
    success_msg: 'EC2Launch completed or had only the opted-in later-run user-data read error.'
    that:
      - >-
        (__ec2launch_rc__ | int) == 0
        or ((__ec2launch_rc__ | int) == 1
            and (host_readiness_ec2launch_accept_once_userdata_failure | bool)
            and (__ec2launch_probe_rc__ | int) == 0
            and (__ec2launch_state__.run_once | default(false) | bool))

# EC2Launch reporting 'complete' is not the same as the machine having finished starting.
# Measured on a Server 2025 image, 2026-09-11: the blocking status call returned in one second
# and the machine restarted itself a minute later -- winlogon, on behalf of SYSTEM, reason
# 'Operating System: Upgrade (Planned)'. Windows was finishing its own setup, and the agent's
# answer did not speak for that.
#
# A play that continues into those seconds configures a host that is about to vanish. It cost a
# converge: the domain join completed, its own restart completed, and the machine then went away
# under the following task. It went away QUIETLY, too -- SSH keepalives take ten minutes to call
# a dead connection dead, so a ninety-second event surfaced as an eleven-minute hang attributed
# to whichever task happened to be running.
#
# So the gate is the machine's own uptime rather than an agent's opinion of it: wait until the
# host has been up for a settle window with no restart pending, and treat a lost connection as
# the very thing being waited for instead of as a failure. ignore_unreachable plus a retry is
# what makes that survivable -- a host that reboots mid-check is unreachable for one attempt and
# answers the next.
#
# The servicing flag, RebootPending, does NOT on its own mean a restart is owed. Component-Based
# Servicing sets it when any servicing session starts and clears it when that session ends; it is
# a crash-safety mark, not a request. Measured on a Server 2025 image, 2026-09-16, with the flag
# and CBS.log watched through a whole converge: StartComponentCleanup -- idle component-store
# maintenance, overdue on any freshly launched image -- began at the host's first idle moment,
# held the flag for 1,465 seconds, and cleared it itself with S_OK and no restart. So a mark held
# while the Windows Modules Installer service runs is work in progress and does not
# hold this gate.
#
# A mark left behind with that service STOPPED is different: no session is running, so nothing
# will clear it but a restart, and neither will the Windows Update flag. Waiting on either only
# fails the run and leaves the restart for someone to do by hand. So the probe answers three ways
# -- 0 settled, 1 still settling, 2 a restart is owed -- and an owed restart is performed, once,
# and the machine is waited for again. Restarting cannot interrupt servicing here: an owed
# restart is only ever reported while the service that does the servicing is stopped.
- name: 'PROCESS | Settle The Machine And Restart It Once If Windows Owes One'
  vars:
    # Defined once so the wait before a restart and the wait after it can never ask different
    # questions. NO PowerShell VARIABLES, deliberately: the shell OpenSSH serves is cmd on first
    # boot and PowerShell after os_bootstrap flips DefaultShell, and under PowerShell the outer
    # double quotes INTERPOLATE, so a '$Name' inside them is expanded by the outer shell -- to
    # nothing -- before the inner powershell ever sees it. Measured: a draft that used two
    # variables reached the host as "... -f , )", a parse error that consumed every retry.
    __host_readiness_settle_probe__: >-
      powershell -NoProfile -Command
      "if (((Get-Date)
      - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalSeconds -lt 90) { exit 1 }
      elseif (((Test-Path
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending')
      -and ((Get-Service TrustedInstaller).Status -ne 'Running'))
      -or (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto
      Update\RebootRequired'))
      { exit 2 }
      else { exit 0 }"

  block:

    # Stops as soon as the machine is settled OR owes a restart: waiting longer cannot change an
    # owed restart. raw reports any non-zero exit as a failure, and 1 and 2 are answers here
    # rather than errors, so the result is read -- by the tasks below and the assert that closes
    # the block -- instead of being allowed to stop the play on its own.
    - name: 'PROCESS | Wait Until The Machine Has Stopped Restarting Itself'
      become: false
      changed_when: false
      check_mode: false
      delay: 20
      ignore_errors: true
      ignore_unreachable: true
      register: '__host_readiness_settled__'
      retries: 15
      until:
        - not (__host_readiness_settled__.unreachable | default(false))
        - (__host_readiness_settled__.rc | default(1)) in [0, 2]

      ansible.builtin.raw: '{{ __host_readiness_settle_probe__ }}'

    # 1115 and 1190 mean a shutdown is already in progress or scheduled: Windows was restarting
    # itself anyway, which is the outcome asked for. A dropped connection is the
    # restart taking effect.
    - name: 'PROCESS | Restart The Machine To Apply What Windows Owes'
      become: false
      changed_when: true
      failed_when: >-
        not (__host_readiness_restarted__.unreachable | default(false))
        and (__host_readiness_restarted__.rc | default(1)) not in [0, 1115, 1190]
      ignore_unreachable: true
      register: '__host_readiness_restarted__'
      when:
        - not (__host_readiness_settled__.unreachable | default(false))
        - (__host_readiness_settled__.rc | default(1)) == 2
        - host_readiness_restart_when_owed | bool
        - not ansible_check_mode

      ansible.builtin.raw: >-
        shutdown /r /t 5 /c "host_readiness: Windows reported a restart owed before
        configuration"

    # Longer than the first wait: servicing finishes its pending work during that boot, which is
    # the slowest boot a host has.
    - name: 'PROCESS | Wait For The Machine To Return Settled'  # noqa: no-handler
      become: false
      changed_when: false
      check_mode: false
      delay: 20
      ignore_errors: true
      ignore_unreachable: true
      register: '__host_readiness_returned__'
      retries: 30
      until:
        - not (__host_readiness_returned__.unreachable | default(false))
        - (__host_readiness_returned__.rc | default(1)) == 0
      when: __host_readiness_restarted__ is changed

      ansible.builtin.raw: '{{ __host_readiness_settle_probe__ }}'

    # The one place this gate fails, so the reason it gives is always the real one. Check mode
    # reports an owed restart as the restart a real run would make, rather than failing over it.
    - name: 'END | Require That The Machine Settled'
      vars:
        __settled_rc__: "{{ __host_readiness_settled__.rc | default(1) }}"
        __settled_lost__: "{{ __host_readiness_settled__.unreachable | default(false) }}"
        __restarted__: "{{ __host_readiness_restarted__ is changed }}"
      ansible.builtin.assert:
        fail_msg: >-
          '{{ inventory_hostname }}' is not ready to be configured: {% if __settled_lost__ | bool
          %}it never stayed reachable long enough to be checked. {% elif (__settled_rc__ | int)
          == 2 and not (host_readiness_restart_when_owed | bool) %}Windows owes a restart -- a
          servicing mark with the Windows Modules Installer stopped, or the Windows Update reboot
          flag -- and host_readiness_restart_when_owed is false, so it was not restarted. Restart
          the host, or allow the role to. {% elif __restarted__ | bool %}it was restarted once
          because Windows owed a restart, and did not settle afterwards. A restart owed again
          straight away needs a person rather than a loop; CBS.log names the servicing session
          that set the mark. {% else %}it was still restarting after every attempt.{% endif %}
          The System log's event 1074 names whatever restarted the machine, and why.
        quiet: true
        that:
          - >-
            (not (__settled_lost__ | bool) and (__settled_rc__ | int) == 0)
            or (not (__settled_lost__ | bool) and (__settled_rc__ | int) == 2
                and ansible_check_mode and (host_readiness_restart_when_owed | bool))
            or ((__restarted__ | bool)
                and not (__host_readiness_returned__.unreachable | default(false))
                and (__host_readiness_returned__.rc | default(1)) == 0)
