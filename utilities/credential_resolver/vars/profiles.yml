---
credential_resolver_profile_contracts:
  ssh: &ssh_contract
    written_groups:
      - 'ansible_connection'
      - 'ansible_ssh_args'
      - 'ansible_user'
      - 'ansible_password'
      - 'ansible_private_key'
      - 'ansible_private_key_file'
      - 'ansible_private_key_passphrase'
      - 'ansible_ssh_pkcs11_provider'
      - 'ansible_ssh_password_mechanism'
      - 'ansible_ssh_retries'
      - 'candidate_plumbing'
  winrm: &winrm_contract
    written_groups:
      - 'ansible_connection'
      - 'ansible_user'
      - 'ansible_password'
      - 'ansible_winrm_transport'
      - 'ansible_winrm_kinit_mode'
      - 'ansible_winrm_cert_pem'
      - 'ansible_winrm_cert_key_pem'
      - 'ansible_ssh_pass'
      - 'candidate_plumbing'
  psrp: &psrp_contract
    exclusive_groups: []
    written_groups:
      - 'ansible_connection'
      - 'ansible_user'
      - 'ansible_password'
      - 'ansible_psrp_auth'
      - 'ansible_psrp_certificate_pem'
      - 'ansible_psrp_certificate_key_pem'
      - 'ansible_psrp_certificate_key_password'
      - 'ansible_ssh_pass'
      - 'candidate_plumbing'
    password_owner: null
  aws_ssm: &aws_ssm_contract
    exclusive_groups:
      - ['ansible_aws_ssm_instance_id', 'ansible_host']
    written_groups:
      - 'ansible_connection'
      - 'ansible_aws_ssm_access_key_id'
      - 'ansible_aws_ssm_secret_access_key'
      - 'ansible_aws_ssm_session_token'
      - 'ansible_aws_ssm_profile'
      - 'candidate_plumbing'
    password_owner: null
  local_transport: &local_transport_contract
    exclusive_groups: []
    written_groups:
      - 'ansible_connection'
      - 'plugin_identity_or_selector_groups'
      - 'candidate_plumbing'
    password_owner: null

