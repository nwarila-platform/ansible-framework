      - 'ansible_ssh_verbosity'
      - 'ansible_sshpass_prompt'
      - 'ansible_user'
      - 'ansible_password'
    required: ['ansible_user']
    exclusive_groups:
      - ['key_content', 'key_file', 'pkcs11']
    password_owner: null
    pins:
      ansible_connection: 'ssh'
    password_cost: 0
    prerequisites: []
    conditional_prerequisites:
      passphrase: ['bcrypt']
    floor: 'ssh'
  ssh_password:
