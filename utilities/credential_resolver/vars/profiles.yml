credential_resolver_become_profiles:
  sudo:
    plugin: 'ansible.builtin.sudo'
    method: 'sudo'
    required: []
    exclusive_groups: []
    probe_groups:
      - 'ansible_become_method'
      - 'ansible_become_user'
      - 'ansible_become_exe'
      - 'ansible_become_flags'
      - 'ansible_become_password'
    floor: 'posix'
    prerequisites: []
    password_owner: null
    password_cost: 0
    pins:
      ansible_become_method: 'sudo'
      ansible_become_exe: 'sudo'
    defaults:
      ansible_become_flags: '-H -S -n'
      ansible_become_user: 'root'
  doas:
    plugin: 'community.general.doas'
    method: 'community.general.doas'
    required: []
    exclusive_groups: []
    probe_groups:
      - 'ansible_become_method'
      - 'ansible_become_user'
      - 'ansible_become_exe'
      - 'ansible_become_flags'
      - 'ansible_become_password'
    floor: 'posix'
    prerequisites: []
    password_owner: null
    password_cost: 0
    pins:
      ansible_become_method: 'community.general.doas'
      ansible_become_exe: 'doas'
    defaults:
      ansible_become_flags: ''
      ansible_become_user: 'root'
  pfexec:
    plugin: 'community.general.pfexec'
    method: 'community.general.pfexec'
    required: []
    exclusive_groups: []
    probe_groups:
      - 'ansible_become_method'
      - 'ansible_become_user'
      - 'ansible_become_exe'
      - 'ansible_become_flags'
      - 'ansible_become_password'
    floor: 'posix'
    prerequisites: []
    password_owner: null
    password_cost: 0
    pins:
      ansible_become_method: 'community.general.pfexec'
      ansible_become_exe: 'pfexec'
    defaults:
      ansible_become_flags: ''
      ansible_become_user: 'root'

credential_resolver_refused_connection_profiles:
  ssh_keyboard_interactive: 'its server-driven prompt count has no established lockout bound'
  winrm_credssp: 'it delegates a password and its lockout bound is not established here'
  psrp_basic: 'PSRP password authentication has no established lockout bound here'
  psrp_ntlm: 'PSRP password authentication has no established lockout bound here'
  psrp_negotiate: 'PSRP password authentication can submit more than one password'
  psrp_credssp: 'it delegates a password and its lockout bound is not established here'
  psrp_kerberos_password: 'PSRP password authentication has no established lockout bound here'
  psrp_encrypted_certificate: 'encrypted PSRP key handling is unverified on this controller'
  funcd: 'community.general 7.5.9 leaves its plugin abstract, so ansible-core cannot load it'
  zone: 'community.general 7.5.9 fails listing zones (it splits bytes with a string)'

credential_resolver_refused_become_profiles:
  runas: 'raw does not exercise the Windows runas plugin'
  su: 'it can prompt without a supplied password'
  dzdo: 'its non-interactive behavior is not established here'
  ksu: 'it can prompt without a supplied password'
  machinectl: 'it can prompt without a supplied password'
  pbrun: 'it can prompt without a supplied password'
  pmrun: 'it can prompt without a supplied password'
  sesu: 'it can prompt without a supplied password'
  sudosu: 'its su step depends on target PAM behavior'

