---
- name: 'PROCESS | Count Sets Eligible This Round'
  no_log: true
  ansible.builtin.set_fact:
    __credential_resolver_round_eligible__: 0

- name: 'PROCESS | Add Eligible Sets This Round'
  when:
    - (__credential_resolver_selected__ | length) == 0
    - >-
      (__credential_resolver_round__ | int)
      <= (
        credential_resolver_round_candidate.attempts
        | default(
            1
            if (
              (__credential_resolver_catalog__.credential_resolver_connection_profiles[
                credential_resolver_round_candidate.profile
              ].password_cost | int) > 0
              and (credential_resolver_round_candidate.vars.ansible_password
                   | default('') | string | length) > 0
            )
            else credential_resolver_rounds
          )
        | int
      )
  no_log: true
  loop: "{{ credential_resolver_candidates }}"
  loop_control:
    loop_var: 'credential_resolver_round_candidate'
    label: "{{ credential_resolver_round_candidate.name }}"
  ansible.builtin.set_fact:
    __credential_resolver_round_eligible__: >-
      {{ __credential_resolver_round_eligible__ | int + 1 }}

- name: 'PROCESS | Try Eligible Sets In Caller Order'
  when:
    - (__credential_resolver_selected__ | length) == 0
    - (__credential_resolver_round_eligible__ | int) > 0
  no_log: true
  loop: "{{ credential_resolver_candidates }}"
  loop_control:
    loop_var: '__credential_resolver_candidate__'
    label: "{{ __credential_resolver_candidate__.name }}"
  ansible.builtin.include_tasks:
    file: 'attempt.yml'

- name: 'PROCESS | Count Sets Eligible Next Round'
  no_log: true
  ansible.builtin.set_fact:
    __credential_resolver_next_round_eligible__: 0

- name: 'PROCESS | Add Sets Eligible Next Round'
  when:
    - (__credential_resolver_selected__ | length) == 0
    - (__credential_resolver_round_eligible__ | int) > 0
    - (__credential_resolver_round__ | int) < (credential_resolver_rounds | int)
    - >-
      (__credential_resolver_round__ | int + 1)
      <= (
        credential_resolver_next_candidate.attempts
        | default(
            1
            if (
              (__credential_resolver_catalog__.credential_resolver_connection_profiles[
                credential_resolver_next_candidate.profile
              ].password_cost | int) > 0
              and (credential_resolver_next_candidate.vars.ansible_password
                   | default('') | string | length) > 0
            )
            else credential_resolver_rounds
          )
        | int
      )
  no_log: true
  loop: "{{ credential_resolver_candidates }}"
  loop_control:
    loop_var: 'credential_resolver_next_candidate'
    label: "{{ credential_resolver_next_candidate.name }}"
  ansible.builtin.set_fact:
    __credential_resolver_next_round_eligible__: >-
      {{ __credential_resolver_next_round_eligible__ | int + 1 }}

- name: 'PROCESS | Publish Whether This Host Needs A Follow-Up Round'
  no_log: true
  ansible.builtin.set_fact:
    __credential_resolver_attempt_intent__:
      account: ''
      cost: 0
      eligible: false
    __credential_resolver_need_pause__: >-
      {{ (__credential_resolver_selected__ | length) == 0
         and (__credential_resolver_round_eligible__ | int) > 0
         and (__credential_resolver_round__ | int) < (credential_resolver_rounds | int)
         and (__credential_resolver_next_round_eligible__ | int) > 0 }}

- name: 'PROCESS | Pause Before A Follow-Up Round'
  when: (__batch_hosts_needing_pause__ | length) > 0
  vars:
    __batch_hosts_needing_pause__: >-
      {{ ansible_play_batch
         | map('extract', hostvars, '__credential_resolver_need_pause__')
         | map('default', false)
         | select('equalto', true)
         | list }}
  ansible.builtin.pause:
    seconds: "{{ credential_resolver_pause_seconds | int }}"

- name: 'PROCESS | Advance To The Follow-Up Round'
  when: __credential_resolver_need_pause__ | bool
  no_log: true
  ansible.builtin.set_fact:
    __credential_resolver_round__: "{{ __credential_resolver_round__ | int + 1 }}"

- name: 'PROCESS | Walk The Follow-Up Round'
  when: __credential_resolver_need_pause__ | bool
  ansible.builtin.include_tasks:
    file: 'round.yml'
