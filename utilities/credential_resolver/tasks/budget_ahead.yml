---
# Hosts whose sets differ reach this task one at a time; a host ahead that has already decided is
# counted by its tally, never reserved again.
- name: 'PROCESS | Decide Password Budget Grant'
  no_log: true
  vars:
    __budget_account__: "{{ __credential_resolver_attempt_intent__.account | string }}"
    __budget_used__: >-
      {%- set budget = namespace(total=0) -%}
      {%- for tally_host in groups['all'] -%}
      {%- set tally = hostvars[tally_host].__credential_resolver_password_tallies__
                      | default({}) -%}
      {%- set budget.total = budget.total + (tally.get(__budget_account__, 0) | int) -%}
      {%- endfor -%}
      {{ budget.total }}
    __budget_ahead__: >-
      {%- set reservation = namespace(total=0) -%}
      {%- for ahead_host in
            ansible_play_batch[:ansible_play_batch.index(inventory_hostname)] -%}
      {%- set intent = hostvars[ahead_host].__credential_resolver_attempt_intent__
                       | default({}) -%}
      {%- if intent.get('eligible', false) | bool
            and not (intent.get('decided', false) | bool)
            and (intent.get('account', '') | string) == __budget_account__ -%}
      {%- set reservation.total = reservation.total + (intent.get('cost', 0) | int) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ reservation.total }}
  ansible.builtin.set_fact:
    __credential_resolver_attempt_intent__: >-
      {{ __credential_resolver_attempt_intent__ | combine({'decided': true}) }}
    __credential_resolver_budget_granted__: >-
      {{
        __credential_resolver_attempt_intent__.eligible | bool
        and (
          (__credential_resolver_attempt_intent__.cost | int) == 0
          or (
            __budget_used__ | int
            + __budget_ahead__ | int
            + __credential_resolver_attempt_intent__.cost | int
            <= credential_resolver_password_budget | int
          )
        )
      }}
