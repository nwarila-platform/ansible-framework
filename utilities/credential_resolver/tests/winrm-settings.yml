---
- name: 'PLAY | Exercise Published WinRM Settings'
  hosts: 'all'
  gather_facts: false
  vars:
    winrm_cases:
      - {name: 'default-settings', scheme: 'https', encryption: 'auto'}
      - {name: 'string-http-settings', port: '5985', scheme: 'http', encryption: 'always'}
      - {name: 'custom-https-settings', port: 55986, scheme: 'https', encryption: 'auto'}
      - {name: 'integer-http-settings', port: 5985, scheme: 'http', encryption: 'always'}
  tasks:
    - name: 'PROCESS | Check Each WinRM Setting Set'
      loop: "{{ winrm_cases }}"
      vars:
        winrm_case: "{{ item }}"
      ansible.builtin.include_tasks: 'winrm-settings-case.yml'
