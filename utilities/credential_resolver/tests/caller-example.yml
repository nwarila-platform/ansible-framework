# ============================================================================================= #
# File: '{{ playbook_dir }}/caller-example.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# The roles-only caller shape the README points to, run by tests/run.sh before and after a floor.
#
# ============================================================================================= #

#region ------ [ Play: Resolve A Host Connection Identity ] ----------------------------------- #

- name: 'PLAY | Resolve A Host Connection Identity'
  hosts: 'all'
  gather_facts: false
  roles:
    - role: 'credential_resolver'
      tags: ['always']
      vars:
        credential_resolver_boot_time_after: >-
          {{ __domain_member_boot_time__ | default('') }}
        credential_resolver_candidates: >-
          {{ [caller_post_join_set]
             if __domain_member_boot_time__ is defined
             else caller_sets }}
        credential_resolver_require_elevated: true
        credential_resolver_wait_pause_seconds: "{{ caller_pause }}"
        credential_resolver_wait_rounds: "{{ caller_rounds }}"

#endregion --- [ Play: Resolve A Host Connection Identity ] ----------------------------------- #
