# ============================================================================================= #
# File: '{{ playbook_dir }}/input-cases.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Holds malformed fixtures once so role and caller validation use identical inputs.
#
# ============================================================================================= #
---

input_canary_a: "{{ lookup('env', 'CREDENTIAL_RESOLVER_CANARY_A') }}"
input_cases:
  basic: {name: 'basic', connection: 'winrm', user: 'u', transport: 'basic',
          password: "{{ input_canary_a }}"}
  kerberos_integer: {name: 'kerberos-int', connection: 'winrm', user: 'u@example.com',
                     transport: 'kerberos', port: 5985, password: "{{ input_canary_a }}"}
  kerberos_string: {name: 'kerberos-string', connection: 'winrm', user: 'u@example.com',
                    transport: 'kerberos', port: '5985', password: "{{ input_canary_a }}"}
  missing_name: {connection: 'ssh', user: 'u', password: "{{ input_canary_a }}"}
  null_name: {name: null, connection: 'ssh', user: 'u', password: "{{ input_canary_a }}"}
  missing_user: {name: 'missing-user', connection: 'ssh', password: "{{ input_canary_a }}"}
  null_user: {name: 'null-user', connection: 'ssh', user: null,
              password: "{{ input_canary_a }}"}
  launch_and_password:
    name: 'launch-and-password'
    connection: 'winrm'
    user: 'u'
    password: "{{ input_canary_a }}"
    launch_password: {instance_id: 'i-test', region: 'us-east-1', private_key_file: '/tmp/key'}
    transport: 'ntlm'
  launch_missing_key:
    name: 'launch-missing-key'
    connection: 'winrm'
    user: 'u'
    launch_password: {instance_id: 'i-test', region: 'us-east-1'}
    transport: 'ntlm'
  launch_extra_key:
    name: 'launch-extra-key'
    connection: 'winrm'
    user: 'u'
    launch_password:
      instance_id: 'i-test'
      private_key_file: '/tmp/key'
      region: 'us-east-1'
      unexpected: 'value'
    transport: 'ntlm'
  launch_empty_value:
    name: 'launch-empty-value'
    connection: 'winrm'
    user: 'u'
    launch_password: {instance_id: '', region: 'us-east-1', private_key_file: '/tmp/key'}
    transport: 'ntlm'
