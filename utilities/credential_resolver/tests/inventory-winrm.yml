# ============================================================================================= #
# File: '{{ playbook_dir }}/inventory-winrm.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Declares WinRM so transport-latched cases run separately from the SSH cases.
#
# ============================================================================================= #

#region ------ [ Local WinRM Test Host ] ------------------------------------------------------ #

all:
  hosts:
    localhost:
      ansible_connection: 'winrm'
      ansible_host: '127.0.0.1'
      credential_test_transport: 'winrm'
      platform: 'Linux'

#endregion --- [ Local WinRM Test Host ] ------------------------------------------------------ #
