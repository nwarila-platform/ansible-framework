---
- name: 'PROCESS | Resolve {{ winrm_case.name }}'
  vars:
    credential_resolver_candidates:
      - {name: "{{ winrm_case.name }}", connection: 'winrm', user: "{{ winrm_case.name }}",
         transport: 'ntlm', port: "{{ winrm_case.port }}",
         password: "{{ lookup('env', 'CREDENTIAL_RESOLVER_CANARY_A') }}"}
  ansible.builtin.include_role:
    name: 'credential_resolver'
- name: 'PROCESS | Assert {{ winrm_case.name }}'
  vars:
    winrm_log: "{{ lookup('file', lookup('env', 'CREDENTIAL_RESOLVER_WINRM_LOG')) }}"
  ansible.builtin.assert:
    fail_msg: 'A WinRM set did not publish and pass its port-derived settings to the connection.'
    quiet: true
    that:
      - __credential_resolver_winner__ == winrm_case.name
      - ansible_winrm_scheme == winrm_case.scheme
      - ansible_winrm_message_encryption == winrm_case.encryption
      - >-
        [__credential_resolver_attempts__[0].msg, __credential_resolver_attempts__[0].rc,
        __credential_resolver_attempts__[0].stdout, __credential_resolver_attempts__[0].stderr]
        == [None, 0, 'S-1-16-12288\r\n200\r\n', '']
      - winrm_log is search('ENDPOINT=' ~ winrm_case.scheme ~ '://127.0.0.1:'
          ~ winrm_case.port ~ '/wsman .*ENCRYPTION=' ~ winrm_case.encryption)
