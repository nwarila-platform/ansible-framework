---
- name: 'Scenario M | Secrecy Surfaces'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario M | Write A Cacheable Marker Beside The Resolver Facts'
      ansible.builtin.set_fact:
        scenario_m_cache_marker: 'M-CACHE-MARKER'
        cacheable: true

    - name: 'Scenario M | Report The Winner'
      ansible.builtin.debug:
        msg: >-
          M-WINNER {{ inventory_hostname }}
          {{ __credential_resolver_observations__ | to_json }}
        verbosity: 0
