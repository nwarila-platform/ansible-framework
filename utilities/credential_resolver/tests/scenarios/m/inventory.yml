all:
  vars:
    fixtures: utilities/credential_resolver/tests/fixtures
  hosts:
    m-ssh-password.invalid:
      ansible_host: 192.0.2.70
      credential_resolver_candidates:
        - name: m-ssh-password
          profile: ssh_password
          account: m-account
          vars:
            ansible_user: m-ssh-IDENTITY-CANARY
            ansible_password: PASSWORD-SECRET-CANARY-M
    m-pkcs11.invalid:
      ansible_host: 192.0.2.71
      credential_resolver_candidates:
        - name: m-pkcs11
          profile: ssh_publickey
          vars:
            ansible_user: m-pkcs11-IDENTITY-CANARY
            ansible_private_key_file: '{{ fixtures }}/id_stub.pub'
            ansible_ssh_pkcs11_provider: '{{ fixtures }}/provider.so'
            ansible_password: PKCS11-PIN-SECRET-CANARY-M
    m-key-content.invalid:
      ansible_host: 192.0.2.72
      credential_resolver_candidates:
        - name: m-key-content
          profile: ssh_publickey
          vars:
            ansible_user: m-key-content-IDENTITY-CANARY
            ansible_private_key: >-
              {{ lookup('ansible.builtin.file',
                        lookup('ansible.builtin.env', 'CREDRES_INPUT') ~ '/content-key') }}
            ansible_private_key_passphrase: KEY-PASSPHRASE-SECRET-CANARY
    m-winrm.invalid:
      ansible_host: 192.0.2.73
      platform: windows
      ansible_shell_type: cmd
      credential_resolver_candidates:
        - name: m-winrm
          profile: winrm_ntlm
          account: m-windows-account
          vars:
            ansible_user: m-winrm-IDENTITY-CANARY
            ansible_password: PASSWORD-SECRET-CANARY-MW
            ansible_port: 5985
            ansible_winrm_scheme: http
            ansible_winrm_message_encryption: always
    m-kerberos.invalid:
      ansible_host: 192.0.2.74
      platform: windows
      ansible_shell_type: cmd
      credential_resolver_candidates:
        - name: m-kerberos
          profile: winrm_kerberos
          account: m-kerberos-account
          vars:
            ansible_user: m-kerberos-IDENTITY-CANARY@TEST.INVALID
            ansible_password: PASSWORD-SECRET-CANARY-MK
            ansible_port: 5986
            ansible_winrm_scheme: https
            ansible_winrm_kinit_env_vars:
              - CREDRES_KINIT_LOG
    m-aws-static.invalid:
      ansible_host: 192.0.2.75
      ansible_python_interpreter: /root/.local/share/pipx/venvs/ansible-core/bin/python
      credential_resolver_candidates:
        - name: m-aws-static
          profile: aws_ssm_static
          vars:
            ansible_aws_ssm_instance_id: i-m-static
            ansible_aws_ssm_region: us-test-1
            ansible_aws_ssm_bucket_name: bucket-m-static
            ansible_aws_ssm_endpoint_url: https://ssm.invalid
            ansible_aws_ssm_access_key_id: M-STATIC-ACCESS-IDENTITY-CANARY
            ansible_aws_ssm_secret_access_key: M-STATIC-SECRET-CANARY
            ansible_aws_ssm_session_token: M-STATIC-TOKEN-SECRET-CANARY
