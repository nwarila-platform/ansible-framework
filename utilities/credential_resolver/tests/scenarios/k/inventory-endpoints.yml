      ansible_host: 192.0.2.50
      credential_resolver_candidates:
      - name: k-ssm-option-http
        profile: aws_ssm_ambient
        vars:
          ansible_aws_ssm_instance_id: i-ssm-option-http
          ansible_aws_ssm_region: us-test-1
          ansible_aws_ssm_bucket_name: bucket-ssm-option-http
