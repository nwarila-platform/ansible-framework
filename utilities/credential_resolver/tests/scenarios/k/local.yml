---
- name: 'Scenario K | Community Local Transports'
  hosts: 'all'
  gather_facts: false
  remote_user: 'poison-keyword-user'
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario K | Report The Winner'
      ansible.builtin.debug:
        msg: 'K-WINNER {{ inventory_hostname }} {{ __credential_resolver_selected__ }}'
        verbosity: 0
