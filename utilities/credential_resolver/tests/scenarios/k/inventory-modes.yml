all:
  vars:
    ansible_python_interpreter: /root/.local/share/pipx/venvs/ansible-core/bin/python
  hosts:
    k-ambient.invalid:
      ansible_host: 192.0.2.41
      credential_resolver_candidates:
      - name: k-ambient
        profile: aws_ssm_ambient
        vars:
          ansible_aws_ssm_instance_id: i-ambient
          ansible_aws_ssm_region: us-test-1
          ansible_aws_ssm_bucket_name: bucket-ambient
          ansible_aws_ssm_endpoint_url: https://ssm-option.invalid
    k-profile.invalid:
      ansible_host: 192.0.2.42
      credential_resolver_candidates:
      - name: k-profile
        profile: aws_ssm_profile
        vars:
          ansible_aws_ssm_instance_id: i-profile
          ansible_aws_ssm_region: us-test-1
          ansible_aws_ssm_bucket_name: bucket-profile
          ansible_aws_ssm_endpoint_url: https://ssm-option.invalid
          ansible_aws_ssm_profile: profile-only
    k-static.invalid:
      ansible_host: 192.0.2.43
      credential_resolver_candidates:
      - name: k-static
        profile: aws_ssm_static
        vars:
          ansible_aws_ssm_instance_id: i-static
          ansible_aws_ssm_region: us-test-1
          ansible_aws_ssm_bucket_name: bucket-static
          ansible_aws_ssm_endpoint_url: https://ssm-option.invalid
          ansible_aws_ssm_access_key_id: STATIC-ACCESS-IDENTITY-CANARY
          ansible_aws_ssm_secret_access_key: STATIC-SECRET-CANARY
          ansible_aws_ssm_session_token: STATIC-TOKEN-SECRET-CANARY
    k-static-missing.invalid:
      ansible_host: 192.0.2.44
      credential_resolver_candidates:
      - name: k-static-missing
        profile: aws_ssm_static
        vars:
          ansible_aws_ssm_instance_id: i-static-missing
          ansible_aws_ssm_region: us-test-1
          ansible_aws_ssm_bucket_name: bucket-static-missing
          ansible_aws_ssm_endpoint_url: https://ssm-option.invalid
          ansible_aws_ssm_access_key_id: STATIC-ACCESS-IDENTITY-CANARY
