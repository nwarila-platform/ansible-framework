---
- name: 'Scenario E | Lower Sources Never Reach An Attempt'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario E | Report The Winner'
      ansible.builtin.debug:
        msg: 'E-WINNER {{ __credential_resolver_selected__ }}'
        verbosity: 0
