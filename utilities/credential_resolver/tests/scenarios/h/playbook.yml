---
- name: 'Scenario H | Escalation Under Poisoned Keywords'
  hosts: 'all'
  gather_facts: false
  become: true
  become_user: 'poison-keyword-user'
  become_flags: '--poison-keyword-flags'
  become_method: 'ansible.builtin.su'
  become_exe: '/poison/keyword-exe'
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
    ansible_shell_executable: '/poison/variable-shell'
    # Lower-precedence canaries in every alias the accepted become plugins read.
    ansible_become_user: 'poison-play-become-user'
    ansible_become_exe: '/poison/play-become-exe'
    ansible_become_flags: '--poison-play-become-flags'
    ansible_become_pass: 'BECOME-PLAY-SECRET-CANARY-BECOME'
    ansible_sudo_user: 'poison-play-sudo-user'
    ansible_sudo_exe: '/poison/play-sudo-exe'
    ansible_sudo_flags: '--poison-play-sudo-flags'
    ansible_sudo_pass: 'BECOME-PLAY-SECRET-CANARY-SUDO'
    ansible_doas_user: 'poison-play-doas-user'
    ansible_doas_exe: '/poison/play-doas-exe'
    ansible_doas_flags: '--poison-play-doas-flags'
    ansible_doas_pass: 'BECOME-PLAY-SECRET-CANARY-DOAS'
    ansible_pfexec_user: 'poison-play-pfexec-user'
    ansible_pfexec_exe: '/poison/play-pfexec-exe'
    ansible_pfexec_flags: '--poison-play-pfexec-flags'
    ansible_pfexec_pass: 'BECOME-PLAY-SECRET-CANARY-PFEXEC'
    ansible_become_password: 'BECOME-PLAY-SECRET-CANARY-PASSWORD'
    ansible_become_method: 'community.general.ksu'
    host_readiness_attempts: 1
    host_readiness_pause_seconds: 0
    host_readiness_platform: 'declared'
  tasks:
    - name: 'Scenario H | Resolve'
      block:
        - name: 'Scenario H | Walk'
          ansible.builtin.include_role:
            allow_duplicates: true
            name: 'credential_resolver'
            public: false
            rescuable: true
            rolespec_validate: true
      rescue:
        - name: 'Scenario H | Record A Set That Does Not Work'
          ansible.builtin.debug:
            msg: 'H-NOT-WORKING {{ inventory_hostname }} {{ ansible_failed_result.msg }}'
            verbosity: 0

    - name: 'Scenario H | Prove The Transport Without Escalation'
      when: (__credential_resolver_selected__ | length) > 0
      ansible.builtin.include_role:
        allow_duplicates: true
        name: 'host_readiness'
        public: false
        rescuable: true
        rolespec_validate: true

    - name: 'Scenario H | Report The Winner'
      when: (__credential_resolver_selected__ | length) > 0
      ansible.builtin.debug:
        msg: 'H-WINNER {{ __credential_resolver_selected__ }}'
        verbosity: 0

- name: 'Scenario H | A Later Block Keeps Its Own Escalation'
  hosts: 'all'
  gather_facts: false
  tasks:
    - name: 'Scenario H | Run A Runas Block After Resolution'
      ansible.builtin.include_role:
        allow_duplicates: true
        name: 'credential_resolver_runas_block'
        public: false
        rescuable: true
        rolespec_validate: true
      vars:
        credential_resolver_runas_block_user: 'H-RUNAS-USER'
        credential_resolver_runas_block_password: 'RUNAS-PASSWORD-SECRET-CANARY-H'
