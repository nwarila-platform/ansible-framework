---
- name: 'Scenario I | Refusals Before Traffic'
  hosts: 'all:!i-include-parameter.invalid:!i-role-parameter.invalid'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  tasks:
    - name: 'Scenario I | Expect A Refusal'
      block:
        - name: 'Scenario I | Resolve'
          ansible.builtin.include_role:
            allow_duplicates: true
            name: 'credential_resolver'
            public: false
            rescuable: true
            rolespec_validate: true
      rescue:
        - name: 'Scenario I | Record The Refusal'
          ansible.builtin.debug:
            msg: 'I-REFUSED {{ inventory_hostname }} {{ ansible_failed_result.msg }}'
            verbosity: 0

- name: 'Scenario I | An Include Parameter Collides With A Written Key'
  hosts: 'i-include-parameter.invalid'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  tasks:
    - name: 'Scenario I | Expect The Post-Apply Check To Fail'
      block:
        - name: 'Scenario I | Resolve With A Colliding Include Parameter'
          ansible.builtin.include_role:
            allow_duplicates: true
            name: 'credential_resolver'
            public: false
            rescuable: true
            rolespec_validate: true
          vars:
            ansible_user: 'i-include-parameter-IDENTITY-CANARY'
      rescue:
        - name: 'Scenario I | Record The Refusal'
          ansible.builtin.debug:
            msg: 'I-REFUSED {{ inventory_hostname }} {{ ansible_failed_result.msg }}'
            verbosity: 0

- name: 'Scenario I | A Role Parameter Collides With A Written Key'
  hosts: 'i-role-parameter.invalid'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
      # The parameter under test outranks the resolver's written value.
      ansible_password: 'ROLE-PARAMETER-SECRET-CANARY'  # noqa: var-naming[no-role-prefix]
