---
- name: 'Scenario I | A Fleet Without Become Blocks Keeps Its Own Become Extra Variables'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario I | Run A Runas Block After Resolution'
      ansible.builtin.include_role:
        allow_duplicates: true
        name: 'credential_resolver_runas_block'
        public: false
        rescuable: true
        rolespec_validate: true
      vars:
        credential_resolver_runas_block_user: 'I-RUNAS-USER'
        credential_resolver_runas_block_password: 'RUNAS-BLOCK-SECRET-CANARY-I'
