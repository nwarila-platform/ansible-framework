---
- name: 'Scenario L | Remote Message Text Never Stops The Walk'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario L | Report The Walk'
      ansible.builtin.debug:
        msg: >-
          L-WINNER {{ inventory_hostname }}
          {{ __credential_resolver_observations__ | to_json }}
        verbosity: 0
