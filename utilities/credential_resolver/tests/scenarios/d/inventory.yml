all:
  vars:
    ansible_user: D-GROUP-USER-IDENTITY-CANARY
    ansible_winrm_user: D-GROUP-WINRM_USER-IDENTITY-CANARY
    ansible_ssh_user: D-GROUP-SSH_USER-IDENTITY-CANARY
    ansible_password: D-GROUP-PASSWORD-SECRET-CANARY
    ansible_winrm_pass: D-GROUP-WINRM_PASS-SECRET-CANARY
    ansible_winrm_password: D-GROUP-WINRM_PASSWORD-SECRET-CANARY
    ansible_ssh_pass: D-GROUP-SSH_PASS-SECRET-CANARY
    ansible_ssh_password: D-GROUP-SSH_PASSWORD-SECRET-CANARY
    ansible_private_key: D-GROUP-PRIVATE_KEY-SECRET-CANARY
    ansible_ssh_private_key: D-GROUP-SSH_PRIVATE_KEY-SECRET-CANARY
    ansible_private_key_passphrase: D-GROUP-PASSPHRASE-SECRET-CANARY
    ansible_ssh_private_key_passphrase: D-GROUP-SSH_PASSPHRASE-SECRET-CANARY
    ansible_private_key_file: /poison/d-group-private-key-file
    ansible_ssh_private_key_file: /poison/d-group-ssh-private-key-file
    ansible_ssh_pkcs11_provider: /poison/d-group-provider.so
    ansible_winrm_kinit_mode: D-GROUP-WINRM_KINIT_MODE-SELECTOR-CANARY
    ansible_winrm_transport: D-GROUP-WINRM_TRANSPORT-SELECTOR-CANARY
    ansible_winrm_cert_pem: D-GROUP-WINRM_CERT_PEM-SELECTOR-CANARY
    ansible_winrm_cert_key_pem: D-GROUP-WINRM_CERT_KEY_PEM-SELECTOR-CANARY
  hosts:
    d-windows.invalid:
      ansible_host: 192.0.2.6
      ansible_port: 5985
      ansible_winrm_scheme: http
      ansible_winrm_message_encryption: always
      ansible_winrm_read_timeout_sec: 33
      ansible_shell_type: cmd
      platform: windows
      ansible_user: D-HOST-USER-IDENTITY-CANARY
      ansible_winrm_user: D-HOST-WINRM_USER-IDENTITY-CANARY
      ansible_ssh_user: D-HOST-SSH_USER-IDENTITY-CANARY
      ansible_password: D-HOST-PASSWORD-SECRET-CANARY
      ansible_winrm_pass: D-HOST-WINRM_PASS-SECRET-CANARY
      ansible_winrm_password: D-HOST-WINRM_PASSWORD-SECRET-CANARY
      ansible_ssh_pass: D-HOST-SSH_PASS-SECRET-CANARY
      ansible_ssh_password: D-HOST-SSH_PASSWORD-SECRET-CANARY
      ansible_private_key: D-HOST-PRIVATE_KEY-SECRET-CANARY
      ansible_ssh_private_key: D-HOST-SSH_PRIVATE_KEY-SECRET-CANARY
      ansible_private_key_passphrase: D-HOST-PASSPHRASE-SECRET-CANARY
      ansible_ssh_private_key_passphrase: D-HOST-SSH_PASSPHRASE-SECRET-CANARY
      ansible_private_key_file: /poison/d-host-private-key-file
      ansible_ssh_private_key_file: /poison/d-host-ssh-private-key-file
      ansible_ssh_pkcs11_provider: /poison/d-host-provider.so
      ansible_winrm_kinit_mode: D-HOST-WINRM_KINIT_MODE-SELECTOR-CANARY
      ansible_winrm_transport: D-HOST-WINRM_TRANSPORT-SELECTOR-CANARY
      ansible_winrm_cert_pem: D-HOST-WINRM_CERT_PEM-SELECTOR-CANARY
      ansible_winrm_cert_key_pem: D-HOST-WINRM_CERT_KEY_PEM-SELECTOR-CANARY
