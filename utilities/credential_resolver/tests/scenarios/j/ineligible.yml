---
- name: 'Scenario J | An Attempts-Exhausted Host Ahead Reserves Nothing'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 2
    credential_resolver_pause_seconds: 0
    credential_resolver_password_budget: 3
  tasks:
    - name: 'Scenario J | Resolve'
      block:
        - name: 'Scenario J | Walk'
          ansible.builtin.include_role:
            allow_duplicates: true
            name: 'credential_resolver'
            public: false
            rescuable: true
            rolespec_validate: true
      rescue:
        - name: 'Scenario J | Record The Observation'
          ansible.builtin.debug:
            msg: >-
              J-INELIGIBLE {{ inventory_hostname }}
              {{ __credential_resolver_observations__ | to_json }}
            verbosity: 0
