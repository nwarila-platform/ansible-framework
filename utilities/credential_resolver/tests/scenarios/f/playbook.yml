---
- name: 'Scenario F | SSH Isolation'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
    ansible_ssh_args: >-
      -C -o ControlMaster=auto -o ControlPersist=60s -o BatchMode=yes
      -o PreferredAuthentications=keyboard-interactive -o IdentitiesOnly=no
      -o PubkeyAuthentication=yes -o PasswordAuthentication=yes -o GSSAPIAuthentication=no
      -o HostbasedAuthentication=no
    ansible_ssh_common_args: >-
      -o BatchMode=yes -o PreferredAuthentications=keyboard-interactive,password
    ansible_ssh_extra_args: '-o BatchMode=yes -o IdentitiesOnly=no'
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario F | Report The Winner'
      ansible.builtin.debug:
        msg: 'F-WINNER {{ __credential_resolver_selected__ }}'
        verbosity: 0
