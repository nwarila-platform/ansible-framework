- name: 'Scenario A | A Batch Keeps Pausing For A Host Still Walking'
  hosts: 'a-batch-first.invalid,a-batch-second.invalid'
  gather_facts: false
  vars:
    credential_resolver_rounds: 4
    credential_resolver_pause_seconds: 0
    credential_resolver_candidates:
      - name: 'a-batch'
        profile: 'ssh_publickey'
        vars:
          ansible_user: '{{ inventory_hostname }}-IDENTITY-CANARY'
          ansible_private_key_file: 'utilities/credential_resolver/tests/fixtures/id_stub'
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario A | Record The Round Of Each Win'
      ansible.builtin.debug:
        msg: 'A-BATCH {{ inventory_hostname }} rounds={{ __credential_resolver_round__ }}'
        verbosity: 0
