---
- name: 'Scenario G | WinRM And PSRP Profiles'
  hosts: 'all'
  gather_facts: false
  vars:
    credential_resolver_rounds: 1
    credential_resolver_pause_seconds: 0
  roles:
    - role: 'credential_resolver'
  tasks:
    - name: 'Scenario G | Run An Ordinary Task As The Winner'
      changed_when: false
      ansible.builtin.raw: 'echo g-ordinary'

    - name: 'Scenario G | Report The Winner'
      ansible.builtin.debug:
        msg: 'G-WINNER {{ __credential_resolver_selected__ }}'
        verbosity: 0
