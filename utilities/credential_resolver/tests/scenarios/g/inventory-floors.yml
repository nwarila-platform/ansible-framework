all:
  vars:
    platform: 'windows'
    ansible_shell_type: 'cmd'
    fixtures: 'utilities/credential_resolver/tests/fixtures'
    user: 'g-floor-IDENTITY-CANARY'
    password: 'PASSWORD-SECRET-CANARY-GF'
  hosts:
    g-basic-http.invalid:
      ansible_host: 192.0.2.21
      credential_resolver_candidates:
        - name: 'basic-http'
          profile: 'winrm_basic'
          account: 'g-floor'
          vars:
            ansible_user: '{{ user }}'
            ansible_password: '{{ password }}'
            ansible_port: 5986
            ansible_winrm_scheme: 'http'
    g-basic-port.invalid:
      ansible_host: 192.0.2.22
      credential_resolver_candidates:
