---

#region ------ [ Play: Exercise Credential Input Validation ] --------------------------------- #

- name: 'PLAY | Exercise Credential Input Validation'
  hosts: 'all'
  gather_facts: false
  tasks:
    - name: 'BEGIN | Check Every Malformed Set Before Connecting'
      loop: "{{ input_cases | list }}"
      loop_control:
        loop_var: '__input_key__'

      ansible.builtin.include_tasks: 'input-case.yml'

#endregion --- [ Play: Exercise Credential Input Validation ] --------------------------------- #
