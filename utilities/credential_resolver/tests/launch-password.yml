# ============================================================================================= #
# File: '{{ playbook_dir }}/launch-password.yml'
# --- [ Description ] ------------------------------------------------------------------------- #
#
# Exercises transport selection and the controller-side EC2 launch-password path.
#
# ============================================================================================= #

#region ------ [ Play: Exercise EC2 Launch Passwords ] ---------------------------------------- #

- name: 'PLAY | Exercise EC2 Launch Passwords'
  hosts: 'all'
  gather_facts: false
  vars:
    __launch_case__: "{{ lookup('env', 'CREDENTIAL_RESOLVER_LAUNCH_CASE') }}"
    __launch_candidate__:
      name: 'image-administrator'
      connection: 'winrm'
      user: 'Administrator'
      launch_password:
        instance_id: 'i-0123456789abcdef0'
        region: 'us-east-1'
        private_key_file: "{{ lookup('env', 'CREDENTIAL_RESOLVER_KEY_FILE') }}"
      transport: 'ntlm'
    __domain_candidate__:
      name: 'domain-automation'
      connection: 'winrm'
      user: 'domain-automation'
      password: "{{ lookup('env', 'CREDENTIAL_RESOLVER_CANARY_A') }}"
      transport: 'ntlm'
    __ssh_candidate__:
      name: 'ssh-key-file'
      connection: 'ssh'
      user: 'publication-key-file'
      private_key_file: "{{ lookup('env', 'CREDENTIAL_RESOLVER_KEY_FILE') }}"
    __launch_candidates__: >-
      {{ [__domain_candidate__]
         if __launch_case__ == 'domain-only'
         else [__launch_candidate__, __ssh_candidate__]
         if __launch_case__ == 'skip-launch'
         else [__launch_candidate__] }}
  roles:
    - role: 'credential_resolver'
      vars:
        credential_resolver_candidates: "{{ __launch_candidates__ }}"

#endregion --- [ Play: Exercise EC2 Launch Passwords ] ---------------------------------------- #
