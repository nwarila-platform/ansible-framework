# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ------------------------------------------------------------------------ #
#
# Validates load-bearing domain_member configuration after the v3 loader merge, on the CONTROLLER,
# before anything touches the guest. The realm, the joining account and the object its password
# lives in are supplied by the playbook rather than defaulted, so this is where a missing or
# malformed one is caught — in a second, rather than part-way through a join that leaves a
# half-configured machine and an orphaned computer object behind.
#
# meta/main.yml describes these inputs; this file is what enforces them.
#
# Every guard is scoped to state=present. The clean path removes nothing and needs no inputs, so
# requiring a realm to run it would fail a host for a contract it is not using.
#
# =========================================================================================== #
---
- name: 'VALIDATE | Require The Realm, The Account, And Where Its Password Lives'
  when: (state | default('present') | string | lower | trim) == 'present'

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to join: the identity contract is incomplete. The playbook must supply
      domain_member.realm as the DNS name of the realm ('corp.example.com', not the NetBIOS short
      name), domain_member.user as an account permitted to create or reuse this machine's computer
      object, and password.bucket, password.object and password.sha256 naming the object that holds
      that account's password. The digest must be a lowercase 64-character sha256, because the
      object is verified against it before it is ever used as a credential. See meta/main.yml.
    quiet: true
    that:
      - domain_member_running.realm | default('', true) | string | trim
        is match('^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?([.][A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$')
      - domain_member_running.user | default('', true) | string | trim | length > 0
      - domain_member_running.password.bucket | default('', true) | string | trim | length > 0
      - domain_member_running.password.object | default('', true) | string | trim | length > 0
      - domain_member_running.password.sha256 | default('') is match('^[0-9a-f]{64}$')

- name: 'VALIDATE | Require A Usable Join And Posture Contract'
  when: (state | default('present') | string | lower | trim) == 'present'

  vars:
    __computer_ou__: "{{ domain_member_running.computer_ou | default('', true) | string | trim }}"
    __timesync__: "{{ domain_member_running.timesync_source | default('', true) | string | trim }}"

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to join: the join contract is malformed. computer_ou, when declared, must be an LDAP
      distinguished name such as 'OU=Servers,DC=corp,DC=example,DC=com' — DN values containing
      escaped commas are not supported. timesync_source, when declared, must be a host name or
      address. force_rejoin is a boolean, which a string that merely looks like one is not. Leave
      either null or false to keep the platform's own arrangement.
    quiet: true
    that:
      - __computer_ou__ | length == 0
        or __computer_ou__ is match('^[A-Za-z]+=[^,]+([,] ?[A-Za-z]+=[^,]+)*$')
      - __timesync__ | length == 0
        or __timesync__ is match('^[A-Za-z0-9]([A-Za-z0-9.:-]*[A-Za-z0-9])?$')
      - domain_member_running.force_rejoin is boolean

- name: 'VALIDATE | Require The RedHat Proof Commands And Machine Account Posture'
  when:
    - (state | default('present') | string | lower | trim) == 'present'
    - (ansible_facts.os_family | lower) == 'redhat'

  vars:
    # Named here rather than in the overlay: these are the settings the ROLE requires to exist,
    # which is a different statement from the values the overlay declares for them. A site may
    # legitimately change a value; dropping the key altogether is what this refuses.
    __posture_keys__:
      - 'ad_machine_account_password_renewal_opts'
      - 'ad_maximum_machine_account_password_age'
      - 'krb5_validate'

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to join: the RedHat overlay is incomplete. realm_binary and adcli_binary must be
      absolute paths, and not because a wrong one merely fails at exec — it never reaches exec. A
      path that does not resolve makes BEGIN's stat report absent, skips the realm read, and leaves
      the refuse-if-joined-elsewhere guard looking at an empty list, so a host already joined
      somewhere else sails past the one refusal this role exists to make. sssd_custom_settings must
      be a list of key/value pairs -- the shape the system role writes into sssd.conf -- and it must
      still carry all three machine-account settings: ad_maximum_machine_account_password_age,
      ad_machine_account_password_renewal_opts and krb5_validate. A caller override REPLACES this
      list rather than extending it, so declaring one unrelated setting silently drops the posture
      this role exists to hold, and every membership proof still passes.
    quiet: true
    that:
      - domain_member_running.realm_binary | default('') is match('^/')
      - domain_member_running.adcli_binary | default('') is match('^/')
      - domain_member_running.sssd_custom_settings is not string
      - domain_member_running.sssd_custom_settings is sequence
      - domain_member_running.sssd_custom_settings | rejectattr('key', 'defined')
        | list | length == 0
      - domain_member_running.sssd_custom_settings | rejectattr('value', 'defined')
        | list | length == 0
      - __posture_keys__ | difference(domain_member_running.sssd_custom_settings
        | map(attribute='key') | list) | length == 0

- name: 'VALIDATE | Require The Windows Security Posture'
  when:
    - (state | default('present') | string | lower | trim) == 'present'
    - (ansible_facts.os_family | lower) == 'windows'

  ansible.builtin.assert:
    fail_msg: >-
      Refusing to join: the Windows overlay is incomplete. secure_channel must be a non-empty map
      of registry value names to whole numbers — the Domain member policy family this role writes
      to Netlogon — and workgroup_name must name somewhere for a forced rejoin to park the machine
      between leaving the realm and joining it again. The Kerberos encryption types are not
      validated because they are not configurable: the task writes the benchmark's value directly.
    quiet: true
    that:
      - domain_member_running.secure_channel is mapping
      - domain_member_running.secure_channel | length > 0
      - domain_member_running.secure_channel | dict2items | rejectattr('value', 'integer')
        | list | length == 0
      - domain_member_running.workgroup_name | default('', true) | string | trim | length > 0
