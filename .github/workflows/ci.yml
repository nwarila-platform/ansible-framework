---
# =============================================================================
# CI Workflow — Lint & Validate
# =============================================================================
# Runs on every pull request targeting main and on direct pushes to main.
# Jobs are intentionally independent so they run in parallel — a yamllint
# failure does not block ansible-lint from reporting its own findings.
#
# Required status checks (configure in branch protection):
#   - yamllint
#   - allowlist-check
#   - ansible-lint
#   - loader-identity-check
# =============================================================================

name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Minimal permissions at workflow level — elevated per-job only where required
permissions:
  contents: read

# Limit concurrent runs per branch — cancel stale runs on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # YAML Lint
  # ---------------------------------------------------------------------------
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run yamllint
        run: yamllint --config-file .yamllint.yml .

  # ---------------------------------------------------------------------------
  # Deny-All Allowlist
  # ---------------------------------------------------------------------------
  allowlist-check:
    name: Deny-All Allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check deny-all allowlist
        run: make allowlist-check

  # ---------------------------------------------------------------------------
  # Shared Loader Byte Identity
  # ---------------------------------------------------------------------------
  loader-identity-check:
    name: Shared Loader Byte Identity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check application loader byte identity
        run: make loader-identity-check

  # ---------------------------------------------------------------------------
  # Ansible Lint
  # ---------------------------------------------------------------------------
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run ansible-lint
        run: make ansible-lint

  # ---------------------------------------------------------------------------
  # Pre-Commit (full suite, non-blocking — informational only)
  # ---------------------------------------------------------------------------
  # Runs the full pre-commit suite to catch any hooks developers may have
  # skipped locally. Results are reported but do not block merges while the
  # conventional-commit hook is being adopted.
  # ---------------------------------------------------------------------------
  pre-commit:
    name: Pre-Commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run pre-commit
        run: pre-commit run --all-files
        continue-on-error: true  # Remove once adoption is complete
