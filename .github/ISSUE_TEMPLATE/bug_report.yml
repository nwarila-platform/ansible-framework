name: Bug Report
description: Report a bug or unexpected behavior in the framework
title: "bug: "
labels: ["bug", "triage"]
assignees:
  - NWarila

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run playbook with role `python3_pip`
        2. See error
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Paste the exact error output here.
      render: shell
    validations:
      required: false

  - type: input
    id: ansible_version
    attributes:
      label: Ansible version
      placeholder: "e.g. 2.17.0"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Target OS
      placeholder: "e.g. Rocky Linux 10.0"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role or component affected
      placeholder: "e.g. python3_pip, RedHat_Rocky_10, tasks/main.yml loader"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant information (logs, screenshots, related issues).
    validations:
      required: false
